[project]
name = "keel"
version = "0.1.0"
description = "Keel — a framework for building and running your own living GenAI/LLM threat model, served over MCP"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastapi>=0.150.0",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.17.1",
]

[project.scripts]
keel = "keel.mcp.server:main"

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin an explicit rule set (pycodestyle errors + pyflakes) rather than relying on
# ruff's default, which drifts across versions. Import-sort/pyupgrade are left off
# to avoid churning the auto-generated Alembic migrations.
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["keel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
