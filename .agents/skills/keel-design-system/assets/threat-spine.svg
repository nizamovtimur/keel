<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#97a0b5" stroke-width="1.6"></path>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17203a" flood-opacity="0.18"></feDropShadow>
    </filter>
  </defs>

  <rect x="8" y="8" width="944" height="364" rx="18" fill="#ffffff" stroke="#dfe3ec"></rect>
  <text x="40" y="46" fill="#97a0b5" font-size="12" font-weight="700" letter-spacing="1.6">HOW A THREAT IS ASSEMBLED</text>

  
  
  <rect x="40" y="78" width="176" height="76" rx="12" fill="#f6f8fc" stroke="#d7dce8"></rect>
  <text x="128" y="112" text-anchor="middle" fill="#232d4a" font-size="16" font-weight="700">Source · Surface</text>
  <text x="128" y="132" text-anchor="middle" fill="#6b7690" font-size="11">who drives it · which boundary</text>

  
  <rect x="264" y="78" width="176" height="76" rx="12" fill="#38415f"></rect>
  <text x="352" y="112" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Weakness</text>
  <text x="352" y="132" text-anchor="middle" fill="#d7dce8" font-size="11">at a component · nature</text>

  
  <rect x="488" y="74" width="176" height="84" rx="12" fill="#d6294e" filter="url(#sh)"></rect>
  <text x="576" y="110" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">Threat</text>
  <text x="576" y="132" text-anchor="middle" fill="#f6c9d3" font-size="11">what can go wrong</text>

  
  <rect x="712" y="78" width="176" height="76" rx="12" fill="#fdeef1" stroke="#f6c9d3"></rect>
  <text x="800" y="112" text-anchor="middle" fill="#b81f42" font-size="16" font-weight="700">Harm</text>
  <text x="800" y="132" text-anchor="middle" fill="#d6294e" font-size="11">the consequence</text>

  
  <line x1="216" y1="116" x2="262" y2="116" stroke="#97a0b5" stroke-width="1.6" marker-end="url(#arw)"></line>
  <text x="239" y="106" text-anchor="middle" fill="#97a0b5" font-size="10">reaches</text>
  <line x1="440" y1="116" x2="486" y2="116" stroke="#97a0b5" stroke-width="1.6" marker-end="url(#arw)"></line>
  <text x="463" y="106" text-anchor="middle" fill="#97a0b5" font-size="10">rests on</text>
  <line x1="664" y1="116" x2="710" y2="116" stroke="#97a0b5" stroke-width="1.6" marker-end="url(#arw)"></line>
  <text x="687" y="106" text-anchor="middle" fill="#97a0b5" font-size="10">leads to</text>

  
  
  <path d="M540,158 C520,205 470,214 468,250" fill="none" stroke="#e0a021" stroke-width="1.5" stroke-dasharray="4 4"></path>
  <path d="M612,158 C660,205 690,214 706,250" fill="none" stroke="#97a0b5" stroke-width="1.5" marker-end="url(#arw)"></path>
  <text x="470" y="205" text-anchor="middle" fill="#b9820f" font-size="10">live only if…</text>
  <text x="676" y="205" text-anchor="middle" fill="#97a0b5" font-size="10">addressed by</text>

  
  <rect x="248" y="250" width="240" height="58" rx="12" fill="#ffffff" stroke="#e0a021" stroke-dasharray="5 4"></rect>
  <text x="368" y="278" text-anchor="middle" fill="#b9820f" font-size="15" font-weight="700">Reachability</text>
  <text x="368" y="296" text-anchor="middle" fill="#6b7690" font-size="11">rule out when the path isn't live</text>

  
  <rect x="540" y="250" width="150" height="58" rx="12" fill="#eaf4ee" stroke="#bfe0cc"></rect>
  <text x="615" y="278" text-anchor="middle" fill="#1f9d57" font-size="15" font-weight="700">Mitigation</text>
  <text x="615" y="296" text-anchor="middle" fill="#4a5570" font-size="11">gating | soft</text>

  
  <rect x="726" y="250" width="162" height="58" rx="12" fill="#f6f8fc" stroke="#d7dce8"></rect>
  <text x="807" y="278" text-anchor="middle" fill="#232d4a" font-size="15" font-weight="700">Implementation</text>
  <text x="807" y="296" text-anchor="middle" fill="#6b7690" font-size="11">how it's realized here</text>

  <line x1="690" y1="279" x2="724" y2="279" stroke="#97a0b5" stroke-width="1.6" marker-end="url(#arw)"></line>

  <text x="40" y="352" fill="#97a0b5" font-size="11">A technique like prompt injection is a <tspan font-style="italic">mechanism</tspan> — it lives in <tspan font-family="ui-monospace, monospace" fill="#6b7690">source</tspan> / <tspan font-family="ui-monospace, monospace" fill="#6b7690">references</tspan>, never as a threat.</text>
</svg>