<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 316px;font-family:var(--font-sans);overflow:hidden}
.main{background:var(--navy-900);display:flex;align-items:center;justify-content:center}
.mark{font-size:300px;font-weight:700;letter-spacing:-.03em;color:#fff;line-height:.9}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip>div{width:100%;height:100%}</style></head>
<body><div class="main"><span class="mark">Keel</span></div>
<div class="strip">
<div style="background:var(--amber)"></div>
<div style="background:var(--green)"></div>
<div style="background:var(--crimson-600)"></div>
<div style="background:var(--crimson-700)"></div>
</div></body></html>
