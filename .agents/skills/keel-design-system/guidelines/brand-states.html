<!-- @dsCard group="Brand" viewport="700x170" name="Interaction states" subtitle="Hover neutral → navy-100. Hover a jump target → crimson wash. No press state exists." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div class="grid" style="grid-template-columns:1fr 1fr;gap:14px">
<div><p class="k">Neutral hover</p><div style="background:var(--navy-100);padding:10px 15px;border-radius:var(--r-6);font-size:var(--fs-13)">rows · commit rows · facets bar</div></div>
<div><p class="k">Jump-target hover</p><div style="background:var(--crimson-50);color:var(--crimson-700);border:1px solid var(--crimson-200);padding:9px 14px;border-radius:var(--r-6);font-size:var(--fs-13)">gap chips · jump cards</div></div>
<div><p class="k">Selected</p><div style="background:var(--crimson-50);box-shadow:var(--selected-rail-accent);padding:10px 15px;font-size:var(--fs-13)">crimson-50 + inset 3px accent</div></div>
<div><p class="k">Disabled</p><div style="background:var(--crimson-600);color:#fff;opacity:.5;padding:8px 14px;border-radius:var(--r-8);font-size:var(--fs-13);font-weight:600;display:inline-block">Save</div></div></div>
<p class="tok" style="margin:11px 0 0">transition: background .12s, border-color .12s. No custom easing, no bounce, nothing shrinks on click.</p>
</body></html>
