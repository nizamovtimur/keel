<!-- @dsCard group="Type" viewport="700x150" name="The eyebrow" subtitle="11px / 700 / uppercase / .08em — the signature treatment on every section" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div style="background:var(--surface-section);border:1px solid var(--line-inner);border-radius:var(--r-10);padding:var(--pad-section)">
<h3 style="font-size:var(--fs-11);text-transform:uppercase;letter-spacing:var(--ls-eyebrow);color:var(--navy-700);margin:0 0 9px;font-weight:var(--fw-bold)">Reachability <span style="font-weight:400;text-transform:none;color:var(--navy-400)">when it is NOT a live path</span></h3>
<p style="margin:0;color:var(--text-body-read);line-height:var(--lh-prose)">NOT applicable if the reachable tools have no operations with real consequences (read-only, no side effects).</p></div>
<p class="tok" style="margin:9px 0 0">Author the label in sentence case; CSS uppercases it. No rule underneath, ever.</p>
</body></html>
