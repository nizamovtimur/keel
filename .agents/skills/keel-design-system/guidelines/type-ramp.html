<!-- @dsCard group="Type" viewport="700x230" name="Size ramp" subtitle="Narrow and dense: 10→15, then a jump to 19/20 and 24/28" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline">
<span class="tok">28 / 700</span><span style="font-size:28px;font-weight:700;letter-spacing:var(--ls-number);font-variant-numeric:tabular-nums;line-height:1.1">71</span>
<span class="tok">24 / 700</span><span style="font-size:24px;font-weight:700;letter-spacing:var(--ls-number);font-variant-numeric:tabular-nums">62%</span>
<span class="tok">20 / 700</span><span style="font-size:20px;font-weight:700;letter-spacing:var(--ls-title)">Unauthorized tool action</span>
<span class="tok">19 / 700</span><span style="font-size:19px;font-weight:700">Inline title input</span>
<span class="tok">15 / 700</span><span style="font-size:15px;font-weight:700;letter-spacing:-.01em">Keel · Threats</span>
<span class="tok">14 / 500</span><span style="font-size:14px;font-weight:500;line-height:1.35">Row title — the primary line in a rail</span>
<span class="tok">13 / 600</span><span style="font-size:13px;font-weight:600">Button label, card title</span>
<span class="tok">12 / 400</span><span style="font-size:12px;color:var(--navy-500)">Meta, hints, counts, secondary lines</span>
<span class="tok">11 / 500</span><span class="mono" style="font-size:11px;color:var(--navy-500)">T-DATA-LEAK</span>
<span class="tok">10 / 700</span><span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--navy-500)">Facet group key</span></div>
</body></html>
