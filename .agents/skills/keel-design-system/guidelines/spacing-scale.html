<!-- @dsCard group="Spacing" viewport="700x130" name="Scale" subtitle="One scale, multiples of 4" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div style="display:flex;gap:14px;align-items:flex-end">
<div style="text-align:center"><div style="width:var(--sp-1);height:32px;background:var(--navy-200);border-radius:2px;margin:0 auto"></div><p class="tok" style="margin:6px 0 0">4</p></div><div style="text-align:center"><div style="width:var(--sp-2);height:36px;background:var(--navy-200);border-radius:2px;margin:0 auto"></div><p class="tok" style="margin:6px 0 0">8</p></div><div style="text-align:center"><div style="width:var(--sp-3);height:40px;background:var(--navy-200);border-radius:2px;margin:0 auto"></div><p class="tok" style="margin:6px 0 0">12</p></div><div style="text-align:center"><div style="width:var(--sp-4);height:44px;background:var(--navy-200);border-radius:2px;margin:0 auto"></div><p class="tok" style="margin:6px 0 0">16</p></div><div style="text-align:center"><div style="width:var(--sp-5);height:48px;background:var(--navy-200);border-radius:2px;margin:0 auto"></div><p class="tok" style="margin:6px 0 0">20</p></div><div style="text-align:center"><div style="width:var(--sp-6);height:52px;background:var(--navy-200);border-radius:2px;margin:0 auto"></div><p class="tok" style="margin:6px 0 0">24</p></div><div style="text-align:center"><div style="width:var(--sp-8);height:60px;background:var(--navy-200);border-radius:2px;margin:0 auto"></div><p class="tok" style="margin:6px 0 0">32</p></div><div style="text-align:center"><div style="width:var(--sp-10);height:68px;background:var(--navy-200);border-radius:2px;margin:0 auto"></div><p class="tok" style="margin:6px 0 0">40</p></div></div>
</body></html>
