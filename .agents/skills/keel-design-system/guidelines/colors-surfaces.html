<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & hairlines" subtitle="Cool off-white, never pure white — and two line weights that say where you are" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div style="display:flex;gap:0;border-radius:var(--r-10);overflow:hidden;border:1px solid var(--line-panel)">
<div style="flex:1;height:60px;background:var(--bg);display:flex;align-items:flex-end;padding:6px 8px" class="mono"><span style="font-size:9px;color:var(--navy-600)">--bg f4f6fb</span></div>
<div style="flex:1;height:60px;background:var(--panel);display:flex;align-items:flex-end;padding:6px 8px" class="mono"><span style="font-size:9px;color:var(--navy-600)">--panel ffffff</span></div>
<div style="flex:1;height:60px;background:var(--tint);display:flex;align-items:flex-end;padding:6px 8px" class="mono"><span style="font-size:9px;color:var(--navy-600)">--tint f6f8fc</span></div></div>
<div style="display:flex;gap:16px;margin-top:12px;align-items:center">
<div style="flex:1"><div style="height:0;border-top:1px solid var(--border)"></div><p class="tok" style="margin:6px 0 0">--border dfe3ec · pane edges, cards, controls</p></div>
<div style="flex:1"><div style="height:0;border-top:1px solid var(--border2)"></div><p class="tok" style="margin:6px 0 0">--border2 eef1f7 · dividers inside a pane</p></div></div>
</body></html>
