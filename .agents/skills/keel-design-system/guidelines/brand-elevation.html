<!-- @dsCard group="Brand" viewport="700x150" name="Elevation & focus" subtitle="Almost absent — only floating layers cast a shadow. No blur anywhere." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<div style="background:var(--navy-900);color:#fff;padding:10px 16px;border-radius:var(--r-10);font-size:var(--fs-13);box-shadow:var(--shadow-toast)">Saved.</div>
<div style="background:#fff;border:1px solid var(--border);border-left:4px solid var(--green);padding:11px 14px;border-radius:var(--r-10);font-size:var(--fs-13);box-shadow:var(--shadow-dialog)">Written to <span class="mono" style="font-size:var(--fs-12)">catalog/threats/T-DOS.yaml</span></div>
<input value="focused" readonly style="height:var(--input-h);border:1px solid var(--crimson-600);border-radius:var(--r-8);padding:8px 10px;box-shadow:var(--focus-ring);font:var(--fs-14) var(--font-sans);color:var(--navy-900);width:120px">
<div style="background:var(--crimson-50);box-shadow:var(--selected-rail-accent);padding:10px 15px;border-radius:0;font-size:var(--fs-13);color:var(--navy-900)">selected row</div></div>
</body></html>
