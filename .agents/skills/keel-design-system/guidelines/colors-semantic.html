<!-- @dsCard group="Colors" viewport="700x150" name="Status hues" subtitle="Amber advises and never blocks; green passes; crimson blocks" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div class="grid" style="grid-template-columns:1fr 1fr 1fr">
<div><p class="k">Crimson · blocks</p><div class="sw"><div style="background:var(--crimson-50);color:var(--crimson-700)">50</div><div style="background:var(--crimson-700);color:#fff">700</div></div></div>
<div><p class="k">Amber · advises</p><div class="sw"><div style="background:var(--amber-50);color:var(--amber)">fdf3e0</div><div style="background:var(--amber);color:#fff">e0a021</div></div></div>
<div><p class="k">Green · passes</p><div class="sw"><div style="background:var(--green-50);color:var(--green)">eaf4ee</div><div style="background:var(--green-200);color:var(--green)">bfe3cd</div><div style="background:var(--green);color:#fff">1f9d57</div></div></div></div>
</body></html>
