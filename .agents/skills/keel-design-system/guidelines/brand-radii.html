<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
<div style="text-align:center"><div style="width:76px;height:44px;background:#fff;border:1px solid var(--line-panel);border-radius:var(--r-4)"></div><p class="tok" style="margin:6px 0 0">4px<br><span style="color:var(--text-faint)">badge</span></p></div><div style="text-align:center"><div style="width:76px;height:44px;background:#fff;border:1px solid var(--line-panel);border-radius:var(--r-6)"></div><p class="tok" style="margin:6px 0 0">6px<br><span style="color:var(--text-faint)">chip / hit area</span></p></div><div style="text-align:center"><div style="width:76px;height:44px;background:#fff;border:1px solid var(--line-panel);border-radius:var(--r-8)"></div><p class="tok" style="margin:6px 0 0">8px<br><span style="color:var(--text-faint)">button, input</span></p></div><div style="text-align:center"><div style="width:76px;height:44px;background:#fff;border:1px solid var(--line-panel);border-radius:var(--r-9)"></div><p class="tok" style="margin:6px 0 0">9px<br><span style="color:var(--text-faint)">rail search</span></p></div><div style="text-align:center"><div style="width:76px;height:44px;background:#fff;border:1px solid var(--line-panel);border-radius:var(--r-10)"></div><p class="tok" style="margin:6px 0 0">10px<br><span style="color:var(--text-faint)">card, band, tile</span></p></div><div style="text-align:center"><div style="width:76px;height:44px;background:#fff;border:1px solid var(--line-panel);border-radius:var(--r-pill)"></div><p class="tok" style="margin:6px 0 0">20px<br><span style="color:var(--text-faint)">facet chip</span></p></div></div>
</body></html>
