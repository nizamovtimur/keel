<!-- @dsCard group="Colors" viewport="700x130" name="Diff channels" subtitle="GitHub's colours on purpose — the diff quotes another tool's convention" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div class="mono" style="font-size:var(--fs-12);border:1px solid var(--line-panel);border-radius:var(--r-8);overflow:hidden;background:#fff">
<div style="display:flex;background:var(--diff-hunk-bg)"><span style="min-width:42px;text-align:right;padding:2px 10px;color:var(--navy-400);border-right:1px solid var(--border2)"></span><span style="padding:2px 10px;color:var(--navy-500)">@@ -14,6 +14,8 @@</span></div>
<div style="display:flex;background:var(--diff-del-bg)"><span style="min-width:42px;text-align:right;padding:2px 10px;background:var(--diff-del-gutter);color:var(--diff-del-gutter-fg);border-left:2px solid var(--crimson-600);border-right:1px solid var(--border2)">14</span><span style="padding:2px 10px;color:var(--diff-del-fg)">-reachability: NOT applicable if the tool is read-only.</span></div>
<div style="display:flex;background:var(--diff-add-bg)"><span style="min-width:42px;text-align:right;padding:2px 10px;background:var(--diff-add-gutter);color:var(--diff-add-gutter-fg);border-left:2px solid var(--green);border-right:1px solid var(--border2)">14</span><span style="padding:2px 10px;color:var(--diff-add-fg)">+reachability: NOT applicable if the reachable tools have no</span></div>
<div style="display:flex"><span style="min-width:42px;text-align:right;padding:2px 10px;background:var(--tint);color:var(--navy-400);border-right:1px solid var(--border2)">15</span><span style="padding:2px 10px;color:var(--navy-700)"> mitigations:</span></div></div>
</body></html>
