<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div style="display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start">
<div style="text-align:center"><div style="font-size:20px;color:var(--navy-600);line-height:1.6">«  »</div><p class="tok" style="margin:2px 0 0;font-size:10px">collapse / expand rail</p></div><div style="text-align:center"><div style="font-size:20px;color:var(--navy-600);line-height:1.6">▾  ▸</div><p class="tok" style="margin:2px 0 0;font-size:10px">disclosure</p></div><div style="text-align:center"><div style="font-size:20px;color:var(--navy-600);line-height:1.6">＋</div><p class="tok" style="margin:2px 0 0;font-size:10px">create</p></div><div style="text-align:center"><div style="font-size:20px;color:var(--navy-600);line-height:1.6">×</div><p class="tok" style="margin:2px 0 0;font-size:10px">remove</p></div><div style="text-align:center"><div style="font-size:20px;color:var(--navy-600);line-height:1.6">ⓘ</div><p class="tok" style="margin:2px 0 0;font-size:10px">field guidance</p></div><div style="text-align:center"><div style="font-size:20px;color:var(--navy-600);line-height:1.6">·</div><p class="tok" style="margin:2px 0 0;font-size:10px">title separator</p></div><div style="text-align:center"><div style="font-size:20px;color:var(--navy-600);line-height:1.6">+  -</div><p class="tok" style="margin:2px 0 0;font-size:10px">diff sign</p></div>
<div style="text-align:center"><div style="width:34px;height:34px;border-radius:var(--r-10);background:var(--crimson-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;margin:0 auto">T</div><p class="tok" style="margin:4px 0 0;font-size:10px">entity tile — a letter</p></div>
<div style="text-align:center"><div style="display:flex;gap:5px;justify-content:center;padding-top:11px"><span style="width:8px;height:8px;border-radius:50%;background:var(--crimson-600);display:inline-block"></span><span style="width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block"></span></div><p class="tok" style="margin:8px 0 0;font-size:10px">status — a CSS dot</p></div></div>
</body></html>
