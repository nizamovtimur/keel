<!-- @dsCard group="Type" viewport="700x120" name="Every number is tabular" subtitle="Counts, coverage, diff gutters — font-variant-numeric: tabular-nums" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:16px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.sw{display:flex;gap:0;border-radius:var(--r-8);overflow:hidden;border:1px solid var(--line-panel)}
.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 6px}
.mono{font-family:var(--font-mono)}
.tok{font-family:var(--font-mono);font-size:var(--fs-11);color:var(--text-muted)}
</style></head><body>
<div style="display:flex;gap:28px;align-items:baseline;font-variant-numeric:tabular-nums">
<span><span style="font-size:28px;font-weight:700;letter-spacing:var(--ls-number)">13</span> <span class="tok">threats</span></span>
<span><span style="font-size:24px;font-weight:700;letter-spacing:var(--ls-number)">62%</span> <span class="tok">coverage</span></span>
<span class="mono" style="font-size:var(--fs-12);color:var(--navy-500)">9 / 13</span>
<span class="mono" style="font-size:var(--fs-12);color:var(--navy-400)">1141 · 1142 · 1143</span></div>
<p class="tok" style="margin:12px 0 0">Counts render bare — never "13 threats found". Just <span style="font-variant-numeric:tabular-nums">9 / 13</span>.</p>
</body></html>
