<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--surface-panel);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:18px 20px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 7px}.rowz{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.colz{display:flex;flex-direction:column;gap:14px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Field, TextInput, TextArea, Select, CheckSet, SearchInput } = window.KeelDesignSystem_7d5998;
function Demo() {
  const [sf, setSf] = React.useState(["agent-environment"]);
  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"var(--field-gap)"}}>
      <Field label="Title" hint="One line: the action plus its consequence.">
        <TextInput title defaultValue="Unauthorized tool action" />
      </Field>
      <Field label="Harm" hint="The consequence class if it fires." error="'rce' is outside the vocabulary.">
        <Select invalid defaultValue="" placeholder="— select a harm —"
          options={["wrong-decision","data-exposed","code-execution","downtime","reputation-legal"]} />
      </Field>
      <Field label="Surface" hint="Which trust boundary untrusted influence crosses.">
        <CheckSet value={sf} onToggle={v => setSf(s => s.includes(v) ? s.filter(x=>x!==v) : [...s,v])}
          options={["user-agent","agent-agent","agent-environment"]} />
      </Field>
      <Field label="Reference URL" hint="Into a public catalog.">
        <TextInput mono defaultValue="https://owasp.org/www-project-top-10-for-large-language-model-applications/" />
      </Field>
      <Field label="Reachability" hint="When it is NOT a live path, judged un-mitigated."
        advice="No carve-out authored — every deployment will inherit this threat."
        guidance="Open with “NOT applicable if”. Describe the architecture that removes the path, never a control that mitigates it."
        style={{gridColumn:"1 / -1"}}>
        <TextArea rows={3} defaultValue="NOT applicable if the reachable tools have no operations with real consequences (read-only, no side effects)." />
      </Field>
      <div style={{gridColumn:"1 / -1",border:"1px solid var(--line-panel)",borderRadius:"var(--r-10)",overflow:"hidden",background:"var(--surface-panel)"}}>
        <p className="k" style={{margin:"10px 14px 0"}}>SearchInput · the rail filter</p>
        <SearchInput placeholder="Filter threats…" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
