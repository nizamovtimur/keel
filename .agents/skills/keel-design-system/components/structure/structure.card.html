<!-- @dsCard group="Components" viewport="700x520" name="Structure" subtitle="Read band and edit fieldset wear the same surface — review-first in CSS" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:18px 20px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 7px}.rowz{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.colz{display:flex;flex-direction:column;gap:14px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { SectionBand, Card, EditorCard, EntityHeader, Breadcrumb, ScreenTabs, RailRow, Button, Badge, Field, Select } = window.KeelDesignSystem_7d5998;
function Demo() {
  const [screen, setScreen] = React.useState("threats");
  const [sel, setSel] = React.useState("T-TOOL-ABUSE");
  const [open, setOpen] = React.useState(true);
  return (
    <div className="colz">
      <div style={{border:"1px solid var(--line-panel)",borderRadius:"var(--r-10)",overflow:"hidden",background:"var(--surface-panel)"}}>
        <ScreenTabs value={screen} onChange={setScreen}
          screens={[["overview","Overview"],["threats","Threats"],["mitigations","Mitigations"],["style","Style guide"],["reports","Reports"]]} />
        {[["T-TOOL-ABUSE","Unauthorized or destructive tool action"],["T-DATA-LEAK","Sensitive data leaves through the agent"],["T-CMD-INJECT","Command injection through a tool"]].map(([id,ti]) =>
          <RailRow key={id} id={id} title={ti} selected={sel===id} onClick={() => setSel(id)}
            badges={id===sel ? <Badge tone="harm">code-execution</Badge> : null} />)}
      </div>
      <div style={{background:"var(--surface-panel)",border:"1px solid var(--line-panel)",borderRadius:"var(--r-10)",padding:"18px 20px"}}>
        <Breadcrumb type="Threats" id="T-TOOL-ABUSE" lastChanged="Last changed 2 days ago by jane" onViewChange={()=>{}} />
        <EntityHeader glyph="T" title="Unauthorized or destructive tool action" id="T-TOOL-ABUSE"
          badges={<><Badge tone="harm">code-execution</Badge><Badge tone="type" mono>agent-environment</Badge><Badge tone="soft">4 weaknesses</Badge></>}
          actions={<><Button size="sm">Delete</Button><Button variant="primary" size="sm">Edit</Button></>} />
        <SectionBand label="Reachability" sub="when it is NOT a live path">
          <p style={{margin:0,color:"var(--text-body-read)",fontSize:"var(--fs-14)",lineHeight:"var(--lh-prose)"}}>NOT applicable if the reachable tools have no operations with real consequences (read-only, no side effects), or the model influences neither the choice of tool nor its arguments.</p>
        </SectionBand>
        <SectionBand label="Mitigations" count="20 linked">
          <Card id="CTRL-TOOL-ALLOWLIST" title="Tool allowlist" jump onClick={()=>{}}
            badges={<Badge tone="harm">gating</Badge>}
            rationale="An allowlist of permitted tools limits exposure of destructive operations to only those tools the agent actually needs" />
          <Card id="CTRL-INPUT-FILTERING" title="Input filtering" jump onClick={()=>{}}
            badges={<Badge tone="soft">soft</Badge>}
            rationale="Filtering input for prompt injection" style={{marginBottom:0}} />
        </SectionBand>
        <SectionBand as="fieldset" label="Weaknesses" count="edit mode">
          <EditorCard summary="tool · targeted" open={open} onToggle={()=>setOpen(o=>!o)} onRemove={()=>{}}>
            <Field label="Component" hint="Which owned part it sits on.">
              <Select defaultValue="tool" options={["model","tool","downstream","memory","knowledge-base","identity-store"]} />
            </Field>
          </EditorCard>
          <EditorCard summary="model · secondary" open={false} hasError onToggle={()=>{}} onRemove={()=>{}} />
        </SectionBand>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
