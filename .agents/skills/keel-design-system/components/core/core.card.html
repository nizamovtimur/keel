<!-- @dsCard group="Components" viewport="700x300" name="Core" subtitle="Button, IconButton, Badge, Chip, Dot — one crimson action per screen" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--surface-app);font:var(--fs-14)/var(--lh-base) var(--font-sans);color:var(--text-strong);padding:18px 20px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.k{font-size:var(--fs-10);text-transform:uppercase;letter-spacing:var(--ls-key);color:var(--text-faint);font-weight:var(--fw-bold);margin:0 0 7px}.rowz{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.colz{display:flex;flex-direction:column;gap:14px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Badge, Chip, Dot } = window.KeelDesignSystem_7d5998;
function Demo() {
  const [sel, setSel] = React.useState(["data-exposed"]);
  const t = v => setSel(s => s.includes(v) ? s.filter(x => x !== v) : [...s, v]);
  return (
    <div className="colz">
      <div><p className="k">Button</p><div className="rowz">
        <Button variant="primary">Save</Button>
        <Button>Edit</Button>
        <Button variant="bare">Cancel</Button>
        <Button size="sm" glyph="＋">New</Button>
        <Button variant="primary" disabled>Save</Button>
      </div></div>
      <div><p className="k">IconButton · Unicode glyphs only</p><div className="rowz">
        <IconButton glyph="«" title="Collapse rail" />
        <IconButton glyph="▾" title="Collapse card" />
        <IconButton glyph="▸" title="Expand card" />
        <IconButton glyph="×" tone="danger" title="Remove" />
      </div></div>
      <div><p className="k">Badge</p><div className="rowz">
        <Badge tone="harm">code-execution</Badge>
        <Badge tone="type" mono>agent-environment</Badge>
        <Badge tone="soft">targeted</Badge>
        <Badge tone="ok">verified</Badge>
        <Badge tone="advice">draft</Badge>
        <Badge tone="danger">dangling link</Badge>
        <Badge tone="ok" numeric>92%</Badge>
        <Badge tone="orphan">orphan</Badge>
      </div></div>
      <div><p className="k">Chip · OR within a group, AND across groups</p><div className="rowz">
        {["wrong-decision","data-exposed","code-execution","downtime"].map(v =>
          <Chip key={v} selected={sel.includes(v)} onClick={() => t(v)}>{v}</Chip>)}
        <Chip variant="jump">T-TOOL-ABUSE</Chip>
      </div></div>
      <div><p className="k">Dot</p><div className="rowz" style={{gap:18,fontSize:'var(--fs-12)',color:'var(--text-muted)'}}>
        <span><Dot tone="error" /> blocks the save</span>
        <span><Dot tone="advice" /> advises only</span>
        <span><Dot tone="ok" /> verified</span>
        <span><Dot tone="none" /> unset</span>
      </div></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
