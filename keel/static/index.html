    else if (screen === "reports" && a) await openReportSystem(a, b);
  } catch (e) {
    toast("That link no longer resolves — showing the list instead", true);
  } finally {
    applyingRoute = false;
  }
  writeRoute();
}
function renderRail() {
  if (state.screen === "overview") return renderOverviewRail();
  if (state.screen === "coverage") return renderCoverageRail();
  if (state.screen === "reports") return renderReportsRail();
  if (state.screen === "style") return renderStyleRail();
  if (state.screen === "mitigations") return renderMitRail();
  return renderList();
}
function renderMain() {
  if (state.screen === "overview") return renderOverviewMain();
  if (state.screen === "coverage") return renderCoverageMain();
  if (state.screen === "reports") return renderReportsMain();
  if (state.screen === "style") return renderStyleDetail();
  if (state.screen === "mitigations") return renderMitDetail();
  return renderDetail();
}
function renderRight() {
  if (state.screen === "overview") return renderOverviewRight();
  if (state.screen === "reports") return applyPreviewVisibility();
  if (state.screen === "style") return renderStylePreview();
  if (state.screen === "mitigations") return renderMitPreview();
  return renderPreview();
}

// The right rail duplicates the read view in READ mode, so show it only when it adds
// value: the live Preview/Guidance while editing a threat or a mitigation, or the
// Style-guide screen's live author preview. Otherwise collapse its grid column (see
// body.no-preview). Called from every right-rail render, so it tracks each mode change.
function previewVisible() {
  // Only the Style-guide author preview earns a third column: it is the one place where
  // you need to see two artifacts AT ONCE (the field you are editing and what an author
  // will read). The report hand-off does not — you finish reading, then you decide what
  // to send — so it is a tab inside the report and takes the full width when open.
  return state.screen === "style";
}
function applyPreviewVisibility() {
  document.body.classList.toggle("no-preview", !previewVisible());
}

// ===================================================================== //
// Overview screen — a read-only dashboard: counts, style-guide coverage,     //
// gaps to review, catalog warnings, and recent git activity. Reads five      //
// sources via Promise.allSettled, so one failing source (most likely git     //
// being unavailable) never blanks the rest of the page. Nothing here blocks. //
// ===================================================================== //
async function loadOverview() {
  const [h, cov, warn, act, ins] = await Promise.allSettled([
    j("/health/library"), j("/style-guide/coverage"), j("/health/warnings"), j("/history/recent?limit=15"),
    j("/reports/insights"),
  ]);
  state.health = h.status === "fulfilled" ? h.value : (state.health || { stats: {}, errors: [], warnings: [] });
  state.coverage = cov.status === "fulfilled" ? cov.value : state.coverage;
  state.warnings = warn.status === "fulfilled" ? warn.value.warnings : [];
  state.recentActivity = act.status === "fulfilled" ? act.value : { available: false, commits: [] };
  state.insights = ins.status === "fulfilled" ? ins.value : null;
  if (h.status === "rejected") toast((h.reason && h.reason.message) || "Failed to load health", true);
  if (state.screen === "overview") { renderOverviewMain(); renderOverviewRight(); }
}

// Nothing to rail — the aside is hidden on this screen (see body.no-rail). Clearing it
// still matters: it would otherwise keep the previous screen's list alive in the DOM.
function renderOverviewRail() {
  document.getElementById("list").innerHTML = "";
  document.getElementById("count").textContent = "";
}

function renderOverviewMain() {
  const m = document.getElementById("main");
  if (!state.health) { m.innerHTML = '<div class="empty">Loading overview…</div>'; return; }
  m.innerHTML = overviewHtml();
  wireOverview();
}

function renderOverviewRight() {
  // The Overview has no right rail (previewVisible() is false); this just collapses
  // the third grid column. The coverage-band legend now lives inline on the screen.
  applyPreviewVisibility();
}

// The rule list is served, not mirrored. Two copies of it lived here and fell behind the
// backend every time a rule was added or renamed; a screen that groups findings has no
// business also deciding what the groups are.
const ruleLabel = code => (state.rules[code] || {}).label || code;
const ruleExplanation = code => (state.rules[code] || {}).explanation || "";

// Findings grouped by rule, largest group first. A bare label and a count ("Unused
// vocabulary 1") says nothing about what was found, so each group carries the rule's own
// one-line explanation.
function findingGroups(findings) {
  const by = new Map();
  for (const f of findings || []) {
    if (!by.has(f.code)) by.set(f.code, []);
    by.get(f.code).push(f);
  }
  return [...by.entries()].map(([code, items]) => ({ code, items }))
    .sort((a, b) => b.items.length - a.items.length);
}

// Long id lists are unreadable as one wall of chips. Show a run, park the rest behind
// one click. The cut is announced, never silent.
const OV_CHIP_LIMIT = 12;
const OV_ACTIVITY_CHIP_LIMIT = 6;   // a commit list is a timeline, not an index
function chipRow(chips, limit) {
  const n = limit || OV_CHIP_LIMIT;
  if (chips.length <= n) return `<div class="ov-chips">${chips.join("")}</div>`;
  return `<div class="ov-chips">${chips.slice(0, n).join("")}
    <span class="ov-rest hide">${chips.slice(n).join("")}</span>
    <button type="button" class="ov-more" data-ov-more="1">show ${chips.length - n} more</button>
  </div>`;
}

// A ranked horizontal bar chart, in CSS. Scaled to the largest bar, not to a total:
// these answer "which of these is worst", where a share-of-the-whole reading would be
// meaningless (three severity bands are not parts of one quantity anyone acts on).
// `unit` names what a bar counts, so a lone "3" is never left to be guessed at.
function hbars(rows, unit) {
  const max = Math.max(1, ...rows.map(r => r.value));
  return `<div class="hbars">${rows.map(r => {
    const key = r.link
      ? `<button type="button" class="reflink" ${r.link}>${esc(r.label)}</button>`
      : esc(r.label);
    return `<div class="hbar-k" title="${esc(r.label)}">${key}</div>
      <div class="hbar-t"><div class="hbar-f ${r.cls || ""}" style="width:${(100 * r.value / max).toFixed(1)}%"></div></div>
      <div class="hbar-v">${r.value} <span class="u">${esc(r.value === 1 ? unit : unit + "s")}</span></div>`;
  }).join("")}</div>`;
}

// One row per system, segmented by severity and sharing one scale across rows, so bar
// lengths compare directly instead of each row filling its own track. This answers three
// questions at once — how many findings per system, at what severity, and which system
// is worst — which is why there is no separate chart for any of them.
function severityBars(rows) {
  const max = Math.max(1, ...rows.map(r => r.findings));
  return `<div class="hbars">${rows.map(r => {
    const segs = SEVERITY_RANK
      .filter(l => r.severity[l])
      .map(l => `<div class="hbar-f sev-${l}" style="width:${(100 * r.severity[l] / max).toFixed(1)}%"
        title="${r.severity[l]} ${l}"></div>`).join("");
    return `<div class="hbar-k"><button type="button" class="reflink"
        data-report-sys="${esc(r.system_id)}" data-report-date="${esc(r.date)}">${esc(r.system_name)}</button></div>
      <div class="hbar-t stack">${segs || ""}</div>
      <div class="hbar-v">${r.findings}</div>`;
  }).join("")}</div>
  <div class="ov-bar-legend">${SEVERITY_RANK.map(l =>
    `<span><span class="dot sev-${l}"></span>${l}</span>`).join("")}</div>`;
}

// Reports read across systems rather than one at a time. Reads each system's LATEST
// report only: an older assessment's findings may already be closed, and counting them
// would keep reporting work that is done.
function estateBlocks(blk) {
  const ins = state.insights;
  if (!ins) return '<div class="ov-block"><p class="placeholder">Loading…</p></div>';
  if (!ins.assessments) {
    return `<div class="ov-block"><p class="placeholder">Nothing assessed yet. Runs of the assessment skill land in <code>reports/</code> and are summed up here.</p></div>`;
  }
  const parts = [];

  if ((ins.per_system || []).length) {
    parts.push(blk("Findings by system", "worst first", severityBars(ins.per_system)));
  }

  // Which cards keep proving true. This is the catalog validating itself against reality:
  // a threat confirmed everywhere deserves a stronger card than one nobody ever meets.
  const recurring = (ins.threat_activity || [])
    .filter(a => a.confirmed.length)
    .sort((a, b) => b.confirmed.length - a.confirmed.length || a.id.localeCompare(b.id))
    .slice(0, 6);
  if (recurring.length) {
    parts.push(blk("Threats that recur", `top ${recurring.length}`,
      hbars(recurring.map(a => ({
        label: a.title, value: a.confirmed.length,
        link: `data-jump-threat="${esc(a.id)}"`,
      })), "system")));
  }

  // The roadmap: a control several systems want and nothing implements is worth building
  // once, centrally, rather than once per team.
  if (ins.most_requested.length) {
    const rows = ins.most_requested.slice(0, 5).map(m => `<div class="ins-row">
      <button type="button" class="ins-name reflink" data-jump-mit="${esc(m.mitigation_id)}">${esc(m.name)}</button>
      ${m.implemented ? "" : '<span class="badge cov c-lo">not implemented</span>'}
      ${m.in_catalog ? "" : '<span class="badge soft">not in the catalog</span>'}
      <span class="ins-meta">${m.systems.length}&times;</span>
    </div>`).join("");
    parts.push(blk("Controls the assessments ask for",
      ins.most_requested.length > 5 ? `top 5 of ${ins.most_requested.length}` : `${ins.most_requested.length}`,
      rows));
  }

  // The library's own to-do, written by real assessments rather than guessed at.
  if (ins.off_catalog.length) {
    const rows = ins.off_catalog.slice(0, 4).map(o => `<div class="ins-row">
      <span class="badge type">${esc(o.kind)}</span>
      <span class="ins-name">${esc(o.label)}</span>
      <span class="ins-meta">${esc(o.system_id)}</span>
    </div>`).join("");
    parts.push(blk("Missing from the library", `${ins.off_catalog.length}`, rows));
  }

  // Dead weight: a threat ruled out as often as it is confirmed is scoped wrong.
  const misfits = (ins.threat_activity || [])
    .filter(a => a.ruled_out.length && a.ruled_out.length >= a.confirmed.length);
  if (misfits.length) {
    const rows = misfits.slice(0, 3).map(a => `<div class="ins-row">
      <button type="button" class="ins-name reflink" data-jump-threat="${esc(a.id)}">${esc(a.title)}</button>
      <span class="ins-meta">ruled out ${a.ruled_out.length}&times;, confirmed ${a.confirmed.length}&times;</span>
    </div>`).join("");
    parts.push(blk("Threats that keep not applying", `${misfits.length}`, rows));
  }

  if (ins.drafts.length) {
    parts.push(blk("Never finalized", `${ins.drafts.length}`,
      chipRow(ins.drafts.map(d =>
        `<span class="ov-chip" data-report-sys="${esc(d.system_id)}" data-report-date="${esc(d.date)}">${esc(d.system_id)} · ${esc(d.date)}</span>`), 6)));
  }
  return parts.join("");
}

function overviewHtml() {
  const h = state.health || {};
  const stats = h.stats || {};
  const cov = state.coverage || {};

  const ins = state.insights || {};
  const overall = (cov.overall != null) ? cov.overall : h.style_guide_coverage;

  const chip = fullId => {
    const tid = fullId.split("::")[0];
    return `<span class="ov-chip" data-threat="${esc(tid)}" title="Open ${esc(tid)}">${esc(fullId)}</span>`;
  };
  // One line per category, opening to the ids. Three cards of wrapped chips took a
  // third of the dashboard to say "there are 39 of these" — a number and a disclosure
  // says the same thing and keeps the detail one click away.
  const foldRow = (n, label, desc, body) => `<details class="ov-fold">
    <summary><span class="ov-line-n">${n}</span><span>${esc(label)}</span></summary>
    <div class="ov-fold-b"><p class="ov-gap-desc">${esc(desc)}</p>${body}</div>
  </details>`;

  const gapCards = findingGroups(h.errors).map(g =>
    foldRow(g.items.length, ruleLabel(g.code), ruleExplanation(g.code),
      chipRow(g.items.filter(f => f.entity_id).map(f => chip(f.entity_id))))).join("");
  const emptyCatalog = !stats.threats && !stats.mitigations;
  const gaps = emptyCatalog
    ? `<p class="placeholder">Nothing in the catalog yet. Entries move here from <code>drafts/</code> once someone has vouched for them.</p>`
    : !(h.errors || []).length
      ? `<div class="ov-clean"><span class="ok-i"></span>
          <p><b>Nothing flagged.</b> Every threat has weaknesses, a classified harm, and at least one linked mitigation.</p></div>`
      : gapCards;

  // Authoring hygiene compressed to three clickable lines. It used to be two segmented
  // bars with legends and a five-row coverage chart — a quarter of the screen spent on
  // numbers that answer "is the catalog tidy", which is not why anyone opens Keel. The
  // breakdown still exists, on the screen that owns it.
  const ic = h.implementation_coverage_counts || { shared: 0, local_only: 0, none: 0 };
  const line = (n, text, attrs) =>
    `<button type="button" class="ov-line" ${attrs}><span class="ov-line-n">${n}</span><span>${esc(text)}</span></button>`;
  const libraryLines = [
    line(overall == null ? "—" : overall + "%", "of the style guide is authored", 'data-goto="style"'),
    line(ic.none, "carry no recorded implementation",
      'data-ov-filter="implementations" data-ov-value="none"'),
  ].join("");

  // Warnings/activity chips reuse .ov-chip but carry data-warn-* (not data-threat), so
  // wireOverview can tell them apart from the Gaps chips above (threats only).
  const warnChip = w =>
    `<span class="ov-chip" data-warn-entity="${esc(w.entity_type)}" data-warn-id="${esc(w.entity_id)}" title="Open ${esc(w.entity_id)}">${esc(w.entity_id)}</span>`;
  const warningCards = findingGroups(state.warnings || []).map(g => {
    // A finding about the catalog as a whole names no entity, so it has no chip to
    // click - its own message is the only thing that carries it.
    const withId = g.items.filter(w => w.entity_id);
    const body = withId.length
      ? chipRow(withId.map(warnChip))
      : g.items.map(w => `<p class="ov-warn-msg">${esc(w.message)}</p>`).join("");
    return foldRow(g.items.length, ruleLabel(g.code), ruleExplanation(g.code), body);
  }).join("");
  const warningCount = (state.warnings || []).length;
  const warningsSection = warningCount
    ? warningCards
    : emptyCatalog
      ? `<p class="placeholder">Nothing to advise on yet.</p>`
      : `<div class="ov-clean"><span class="ok-i"></span><p><b>Nothing flagged.</b> No advisory warnings across the catalog.</p></div>`;

  const act = state.recentActivity || { available: false, commits: [] };
  // A sweeping commit touches every card in the catalog, and dumping all 71 ids inline
  // buried the message that says what the commit actually did. The message is the row;
  // the ids are a short, expandable tail beneath it.
  // Four commits, message only. The per-commit id chips are gone from the dashboard: a
  // sweeping commit lists every card in the catalog, and the id you want is reachable
  // from the entry's own History section anyway. Four is what fits a 1440x900 laptop
  // without scrolling, which is the point of the whole screen.
  const activityRows = act.available && act.commits.length
    ? act.commits.slice(0, 4).map(c => `<div class="ov-activity-row">
        <div class="ov-activity-line">
          <span class="ov-activity-msg">${esc(c.message)}</span>
          <span class="ov-activity-meta">${esc(c.author)} · ${esc((c.date || "").slice(0, 10))} · ${(c.entities || []).length} ${(c.entities || []).length === 1 ? "entry" : "entries"}</span>
        </div>
      </div>`).join("")
    : `<p class="placeholder">${act.available ? "No recent changes." : "Git history unavailable."}</p>`;

  // Two columns of equal weight. Assessed systems sit on the left because assessment is
  // the frequent act and authoring the model is the occasional one — the left column is
  // what the eye reads first. Nothing here is a document; each block is a signal, and
  // the detail behind it lives on the screen that owns it.
  const facts = [
    `${stats.threats ?? "—"} threats`,
    `${stats.mitigations ?? "—"} mitigations`,
    `${stats.threat_mitigation_links ?? "—"} links`,
    `${ins.systems || 0} ${ins.systems === 1 ? "system" : "systems"} assessed`,
    ins.latest_date ? `latest ${ins.latest_date}` : null,
  ].filter(Boolean).join(" · ");

  const blk = (label, meta, body) => `<div class="ov-block">
    <p class="k">${esc(label)}${meta ? `<span class="n">${esc(meta)}</span>` : ""}</p>${body}</div>`;

  // A record that fails its schema is refused at load, so the catalog on disk and the
  // catalog in the app have diverged. Anything reported as broken has to be fixable
  // where it is reported, so the file name is the action: a record that loaded opens in
  // its normal editor, and one that did not opens as raw text right here, because there
  // is no form to build for something that would not parse. Errors are grouped by file
  // — three bad fields in one record are one thing to go and fix, not three.
  const repo = (state.config && state.config.repo_url || "").replace(/\/+$/, "");
  // A load failure carries the file it came from. A rule finding carries the record it
  // is about instead, so the path is derived — without this every rule finding grouped
  // under `undefined`, and the band read "1 file is not valid" above hundreds of lines.
  const DIRS = { mitigation: "mitigations", threat: "threats", coverage: "coverage" };
  const fileOf = e => e.file
    || (DIRS[e.entity_type] && e.entity_id ? `${DIRS[e.entity_type]}/${e.entity_id}.yaml` : "(unknown)");
  const errFiles = [];
  for (const e of (h.errors || [])) {
    const file = fileOf(e);
    let g = errFiles.find(x => x.file === file);
    if (!g) errFiles.push(g = { file, dropped: false, items: [] });
    g.dropped = g.dropped || e.dropped;
    g.items.push(e);
  }
  errFiles.sort((a, b) => (b.dropped - a.dropped) || a.file.localeCompare(b.file));
  const errRow = g => {
    const e0 = g.items[0];
    const onGithub = repo
      ? `<a class="ov-err-gh" href="${esc(repo)}/edit/main/catalog/${esc(g.file)}" target="_blank" rel="noopener">on GitHub</a>`
      : "";
    const lines = g.items.map(e =>
      `<p class="ov-err-msg">${e.field ? `<span class="ov-err-field">${esc(e.field)}</span>` : ""}${esc(e.message)}</p>`
    ).join("");
    return `<div class="ov-err-row" data-err-file="${esc(g.file)}">
      <div class="ov-err-head">
        <button type="button" class="ov-err-loc" data-err-open="${esc(g.file)}"
          data-err-dropped="${g.dropped ? "1" : ""}" data-err-entity="${esc(e0.entity_type || "")}"
          data-err-id="${esc(e0.entity_id || "")}">${esc(g.file)}</button>
        ${g.dropped ? `<span class="ov-err-drop">not loaded</span>` : ""}
        ${onGithub}
      </div>
      ${lines}
      <div class="ov-repair"></div></div>`;
  };
  const errorBand = errFiles.length
    ? `<div class="ov-errors">
        <p class="k">${errFiles.length} ${errFiles.length === 1 ? "file is" : "files are"} not valid<span class="n">${errFiles.filter(g => g.dropped).length} not being served</span></p>
        ${errFiles.map(errRow).join("")}
      </div>`
    : "";

  return `<div class="detail">
    <div class="ov-head">
      <h2>Library overview</h2>
      <p class="ov-facts">${esc(facts)}</p>
    </div>
    ${errorBand}
    <div class="ov-grid2">
      <section>
        <h3 class="slabel">Assessed systems</h3>
        <div class="ov-col">${estateBlocks(blk)}</div>
      </section>
      <section>
        <h3 class="slabel">The library</h3>
        <div class="ov-col">
          ${blk("Authoring", null, libraryLines)}
          ${blk("Gaps to review", (h.errors || []).length ? `${h.errors.length} across the library` : null, gaps)}
          ${blk("Catalog warnings", warningCount ? `${warningCount} across the library` : null, warningsSection)}
          ${blk("Recent activity", null, activityRows)}
        </div>
      </section>
    </div>
  </div>`;
}

function wireOverview() {
  document.querySelectorAll(".ov-chip[data-threat]").forEach(c => c.onclick = () => overviewOpenThreat(c.dataset.threat));
  document.querySelectorAll(".ov-chip[data-warn-entity]").forEach(c => c.onclick = () => overviewOpenEntity(c.dataset.warnEntity, c.dataset.warnId));
  document.querySelectorAll("[data-err-open]").forEach(el => el.onclick = () => openRepair(el));
  document.querySelectorAll("[data-ov-filter]").forEach(el => el.onclick = () => overviewOpenMitigationsFiltered(el.dataset.ovFilter, el.dataset.ovValue));
  document.querySelectorAll("[data-goto]").forEach(el => el.onclick = () => switchScreen(el.dataset.goto));
  // Reveal a capped chip list in place; the button has done its job and goes away.
  document.querySelectorAll("[data-ov-more]").forEach(b => b.onclick = () => {
    const rest = b.parentElement.querySelector(".ov-rest");
    if (rest) rest.classList.remove("hide");
    b.remove();
  });
  wireJumpLinks(document.getElementById("main"));
  document.querySelectorAll("[data-report-sys]").forEach(c => c.onclick = () => {
    switchScreen("reports");
    openReportSystem(c.dataset.reportSys, c.dataset.reportDate);
  });
}

// Anything that names an entity in the model is a way into it — shared by every screen
// that renders such a name.
function wireJumpLinks(root) {
  if (!root) return;
  root.querySelectorAll("[data-jump-threat]").forEach(b =>
    b.onclick = () => jumpToThreat(b.dataset.jumpThreat));
  root.querySelectorAll("[data-jump-mit]").forEach(b =>
    b.onclick = () => jumpToMit(b.dataset.jumpMit));
}

// Act on a file the loader rejected. A record that still loaded (one bad link, the rest
// intact) has a real entry, so its own editor is the right tool. A record that did not
// load has no entry and no parseable shape, so the only honest editor is its text.
async function openRepair(el) {
  const file = el.dataset.errOpen;
  if (!el.dataset.errDropped) {
    overviewOpenEntity(el.dataset.errEntity, el.dataset.errId);
    return;
  }
  const panel = el.closest(".ov-err-row").querySelector(".ov-repair");
  if (panel.firstChild) { panel.innerHTML = ""; return; }   // second click closes it

  let data;
  try { data = await j("/catalog/file?path=" + encodeURIComponent(file)); }
  catch (e) { toast(e.message, true); return; }

  panel.innerHTML = `<textarea spellcheck="false"></textarea>
    <div class="ov-repair-actions">
      <button type="button" class="btn primary sm" data-repair-save>Save</button>
      <button type="button" class="btn ghost sm" data-repair-cancel>Cancel</button>
    </div>
    <p class="ov-repair-err" hidden></p>`;
  const ta = panel.querySelector("textarea");
  ta.value = data.text;
  ta.focus();

  panel.querySelector("[data-repair-cancel]").onclick = () => { panel.innerHTML = ""; };
  panel.querySelector("[data-repair-save]").onclick = async () => {
    const msg = panel.querySelector(".ov-repair-err");
    let res;
    try { res = await api("PUT", "/catalog/file", { path: file, text: ta.value }); }
    catch (e) { toast(e.message, true); return; }
    if (res.success) { toast("Saved " + file); loadOverview(); return; }
    // Refused, not written: the same gate the loader applies, reported the same way.
    msg.hidden = false;
    msg.innerHTML = res.errors
      .map(e => (e.field ? `<span class="ov-err-field">${esc(e.field)}</span>` : "") + esc(e.message))
      .join("<br>");
  };
}

// Open a threat from an overview gap chip: cross to the Threats screen, then select it.
function overviewOpenThreat(id) {
  switchScreen("threats");
  select(id);
}

// Open either a threat or a mitigation from a Catalog-warnings/Recent-activity chip.
function overviewOpenEntity(entityType, id) {
  if (entityType === "mitigations" || entityType === "mitigation") { switchScreen("mitigations"); selectMit(id); return; }
  overviewOpenThreat(id);
}

// Jump to Mitigations with one facet value pre-selected (a Draft/verified or
// Implementation-coverage legend entry). switchScreen("mitigations") already
// re-renders the facet panel + rail from current state, so setting the facet first
// is all this needs.
function overviewOpenMitigationsFiltered(facetKey, value) {
  const sel = state.mitFacets[facetKey];
  if (!sel) return;
  sel.clear();
  sel.add(value);
  switchScreen("mitigations");
}

// ===================================================================== //
// Reports screen — a read-only archive of assessment runs. Reports are    //
// written to disk by the assessment skill, never edited here, so this     //
// screen has no draft/save flow: load, render, copy.                      //
// ===================================================================== //
// Three bands, matching keel/schemas/report.py. Findings are one ranked list rather
// than an "important" / "lower severity" split: with three levels the split put a
// single band on one side of a heading and two on the other, and it made the same card
// render under two different framings — the spine already carries the ranking.
const SEVERITY_RANK = ["high", "medium", "low"];

async function loadReports() {
  try {
    state.reportsList = (await j("/reports")).reports;
  } catch (e) {
    toast(e.message, true);
    state.reportsList = [];
  }
  if (state.screen === "reports") { renderReportsRail(); renderReportsMain(); }
}

// The filter reaches past the system name into the latest assessment's ids (see
// list_reports' `keywords`), so "CTRL-HACT-CRITICAL" finds every system that still owes
// that control. Matching a handful of names would not be worth a search box.
function reportMatches(s) {
  const q = (state.reportFilter || "").trim().toLowerCase();
  if (!q) return true;
  return (s.system_id + " " + s.system_name + " " + (s.keywords || "")).toLowerCase().includes(q);
}

// ===================================================================== //
// Coverage. Keel's claim about the lists it says it keeps up with, and  //
// the only screen whose value is in the rows that are NOT green.        //
// ===================================================================== //
async function loadCoverage() {
  if (state.coverageMatrix) return;
  try {
    const [m, cites] = await Promise.all([j("/coverage"), j("/coverage/citations")]);
    state.coverageMatrix = m;
    state.coverageCites = cites || {};
    if (!state.coverageSel && m.sources.length) state.coverageSel = m.sources[0].source.id;
  } catch (e) {
    state.coverageMatrix = { sources: [], warnings: [] };
    toast(e.message, true);
  }
  renderRail(); renderMain();
}

function selectCoverage(id) {
  state.coverageSel = id;
  renderRail(); renderMain(); writeRoute();
}

// A gap is work not yet done, not a fault — amber, the advice colour. Out of scope is a
// boundary Keel drew, so it is navy like any other piece of structure. Crimson appears
// nowhere on this screen: none of these three states is an error.
const COV_STATE = {
  covered: { label: "covered", cls: "cov-yes" },
  out_of_scope: { label: "out of scope", cls: "cov-no" },
  gap: { label: "gap", cls: "cov-gap" },
};

function renderCoverageRail() {
  const el = document.getElementById("list");
  const srcs = (state.coverageMatrix && state.coverageMatrix.sources) || [];
  el.innerHTML = srcs.length ? srcs.map(s => {
    const c = s.counts, total = s.imported || 1;
    const seg = (n, cls) => n ? `<span class="hbar-f ${cls}" style="width:${(n / total) * 100}%"></span>` : "";
    return `<div class="row ${s.source.id === state.coverageSel ? "active" : ""}" data-cov="${esc(s.source.id)}">
      <span class="rtitle">${esc(s.source.title)}</span>
      <span class="rid">${esc(s.source.version)}</span>
      <div class="hbar-t stack cov-rail-bar">${seg(c.covered, "c-hi")}${seg(c.out_of_scope, "cov-seg-no")}${seg(c.gap, "c-mid")}</div>
      <div class="badges"><span class="badge soft">${c.covered} covered</span>
        ${c.out_of_scope ? `<span class="badge soft">${c.out_of_scope} out of scope</span>` : ""}
        ${c.gap ? `<span class="badge cov c-mid">${c.gap} gap</span>` : ""}</div>
    </div>`;
  }).join("") : `<div class="empty" style="margin-top:40px">No sources tracked.</div>`;
  document.getElementById("count").textContent = srcs.length ? String(srcs.length) : "";
  el.querySelectorAll(".row").forEach(r => r.onclick = () => selectCoverage(r.dataset.cov));
}

function renderCoverageMain() {
  const m = document.getElementById("main");
  const data = state.coverageMatrix;
  if (!data) return m.innerHTML = `<div class="empty">Loading…</div>`;
  const s = data.sources.find(x => x.source.id === state.coverageSel);
  if (!s) return m.innerHTML = `<div class="empty">Select a source.</div>`;

  const src = s.source, c = s.counts;
  const q = (state.coverageFilter || "").toLowerCase();
  const rows = s.entries.filter(e =>
    (!state.coverageState || e.state === state.coverageState) &&
    (!q || e.ref.toLowerCase().includes(q) || e.title.toLowerCase().includes(q)
      || (e.group || "").toLowerCase().includes(q)));

  // Grouped where the source groups its own entries (an ATLAS tactic); one flat run of
  // a hundred rows is a list nobody reads to the end of.
  const groups = [];
  for (const e of rows) {
    const key = e.group || "";
    let g = groups.find(x => x.key === key);
    if (!g) groups.push(g = { key, items: [] });
    g.items.push(e);
  }

  const entryRow = e => {
    const st = COV_STATE[e.state];
    const ids = [...e.threats, ...e.mitigations];
    const links = ids.map(id => id.startsWith("CTRL-")
      ? `<button type="button" class="reflink" data-jump-mit="${esc(id)}">${esc(id)}</button>`
      : `<button type="button" class="reflink" data-jump-threat="${esc(id)}">${esc(id)}</button>`).join(" · ");
    return `<div class="cov-row">
      <span class="cov-ref">${esc(e.ref)}</span>
      <span class="cov-title">${esc(e.title)}</span>
      <span class="badge ${st.cls}">${st.label}</span>
      ${links ? `<p class="cov-ids">${links}</p>` : ""}
      ${e.note ? `<p class="cov-note">${esc(e.note)}</p>` : ""}
    </div>`;
  };

  const filters = ["", "covered", "out_of_scope", "gap"].map(v => {
    const label = v ? COV_STATE[v].label : "all";
    const n = v ? c[v] : s.imported;
    return `<button type="button" class="ov-chip ${state.coverageState === v ? "on" : ""}" data-cov-state="${v}">${label} ${n}</button>`;
  }).join("");

  const partial = s.imported !== src.entry_count;
  m.innerHTML = `<div class="detail">
    <div class="dhead">
      <div><h2>${esc(src.title)}</h2>
        <p class="dsub">${esc(src.version)}${src.released ? " · released " + esc(src.released) : ""} · read against the source on ${esc(src.checked)}</p></div>
      <a class="reflink" href="${esc(src.url)}" target="_blank" rel="noopener">the source</a>
    </div>
    ${src.note ? `<p class="cov-lede">${esc(src.note)}</p>` : ""}
    <div class="readsec">
      <div class="ov-block">
        <p class="k">Where Keel stands<span class="n">${s.imported} of ${src.entry_count} entries${partial ? " — the rest are not yet read in" : ""}</span></p>
        <div class="chiprow">${filters}</div>
      </div>
    </div>
    ${groups.map(g => `<div class="readsec cov-group">
      ${g.key ? `<h3 class="slabel">${esc(g.key)}</h3>` : ""}
      ${g.items.map(entryRow).join("")}
    </div>`).join("") || `<div class="empty">Nothing matches that.</div>`}
  </div>`;

  m.querySelectorAll("[data-cov-state]").forEach(btn => btn.onclick = () => {
    state.coverageState = btn.dataset.covState;
    renderCoverageMain();
  });
  wireJumpLinks(m);
}

function renderReportsRail() {
  const el = document.getElementById("list");
  const all = state.reportsList || [];
  const items = all.filter(reportMatches);
  el.innerHTML = items.length ? items.map(s => {
    const sel = state.reportSelected && state.reportSelected.system_id === s.system_id;
    const plural = s.report_count === 1 ? "report" : "reports";
    return `<div class="row ${sel ? "active" : ""}" data-system="${esc(s.system_id)}">
      <span class="rid">${esc(s.system_id)}</span>
      <span class="rtitle">${esc(s.system_name)}</span>
      <div class="badges"><span class="badge soft">${s.report_count} ${plural}</span>
        ${s.status === "draft" ? '<span class="badge cov c-mid">draft</span>' : ""}
        ${s.has_delta ? '<span class="badge type">delta</span>' : ""}</div>
    </div>`;
  }).join("")
    : `<div class="empty" style="margin-top:40px">${all.length ? "No system matches that." : "No reports yet."}</div>`;
  document.getElementById("count").textContent = all.length
    ? (items.length === all.length ? String(all.length) : `${items.length}/${all.length}`) : "";
  el.querySelectorAll(".row").forEach(r => r.onclick = () => openReportSystem(r.dataset.system));
}

function renderReportsMain() {
  const m = document.getElementById("main");
  if (state.reportNew) {
    m.innerHTML = newReportHtml();
    wireNewReport();
    return;
  }
  if (!state.currentReport) {
    m.innerHTML = `<div class="empty">Select a system from the list, or
      <button type="button" class="reflink" id="emptyNewReport">assess a new one</button>.</div>`;
    const b = document.getElementById("emptyNewReport");
    if (b) b.onclick = () => newReport();
    return;
  }
  m.innerHTML = reportDetailHtml(state.currentReport);
  wireReportDetail();
  if (state.reportTab === "handoff") wireHandoff();
}

// Assessments normally arrive from the assessment skill, which writes the file. This is
// the by-hand path: the empty draft you fill in yourself. It exists because "how do I
// even start one" had no answer in the UI at all.
function newReport() {
  state.reportNew = { system_id: "", system_name: "", touchedId: false };
  state.currentReport = null;
  state.reportSelected = null;
  renderReportsRail(); renderReportsMain(); renderRight();
}

function newReportHtml() {
  const n = state.reportNew;
  return `<div class="detail">
    <div class="dhead">
      <div class="dicon">R</div>
      <div class="dtitle">
        <h2>Assess a system</h2>
        <div class="dsub">Creates an empty draft dated today, which you then fill in. Most
          assessments come from the assessment skill instead — it writes this file for you.</div>
      </div>
    </div>
    ${readsec("The system", `
      <div class="nr-field">
        <label for="nrName">Name</label>
        <input class="f" id="nrName" value="${esc(n.system_name)}" placeholder="Checkout Agent">
      </div>
      <div class="nr-field">
        <label for="nrId">Id</label>
        <input class="f" id="nrId" value="${esc(n.system_id)}" placeholder="checkout-agent">
        <p class="hint">Lowercase, hyphenated. It becomes the folder under <code>reports/</code>, so it stays with the system for good.</p>
      </div>
      <div class="nr-field">
        <label for="nrDesc">What it does</label>
        <textarea class="f" id="nrDesc" rows="3" placeholder="Answers storefront checkout questions and issues refunds under a value cap.">${esc(n.system_description || "")}</textarea>
        <p class="hint">This is what a later assessment matches against to recognise the same system.</p>
      </div>
      <div class="link-row">
        <button class="btn primary" id="nrCreate">Create draft</button>
        <button class="btn ghost" id="nrCancel">Cancel</button>
      </div>`)}
  </div>`;
}

function wireNewReport() {
  const n = state.reportNew;
  const id = document.getElementById("nrId");
  const name = document.getElementById("nrName");
  const desc = document.getElementById("nrDesc");
  // The id is derived from the name until you touch it yourself — nobody wants to type
  // the same words twice in two shapes.
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  name.oninput = () => {
    n.system_name = name.value;
    if (!n.touchedId) { n.system_id = slug(name.value); id.value = n.system_id; }
  };
  id.oninput = () => { n.touchedId = true; n.system_id = id.value; };
  desc.oninput = () => { n.system_description = desc.value; };
  document.getElementById("nrCancel").onclick = () => {
    state.reportNew = null;
    renderReportsRail(); renderReportsMain(); renderRight();
  };
  document.getElementById("nrCreate").onclick = async () => {
    if (!n.system_id || !n.system_name) { toast("A name and an id are needed", true); return; }
    let created;
    try {
      created = await api("POST", "/reports", {
        system_id: n.system_id, system_name: n.system_name,
        system_description: n.system_description || "",
      });
    } catch (e) { toast(e.message, true); return; }
    state.reportNew = null;
    state.reportSeries[created.system_id] = null;
    await loadReports();
    await openReportSystem(created.system_id, created.date);
    toast("Draft created — add findings as you go");
  };
  name.focus();
}

// Open a system's most recent report (or a specific date). The series is fetched once
// per system and cached, since an archive never changes under us mid-session.
async function openReportSystem(systemId, date) {
  try {
    if (!state.reportSeries[systemId]) {
      state.reportSeries[systemId] = (await j("/reports/" + encodeURIComponent(systemId))).series;
    }
    const series = state.reportSeries[systemId];
    const pick = date || (series[0] && series[0].date);
    if (!pick) { state.currentReport = null; state.reportSelected = null; renderReportsMain(); return; }
    state.currentReport = await j(
      "/reports/" + encodeURIComponent(systemId) + "/" + encodeURIComponent(pick)
    );
    if (!state.reportSelected || state.reportSelected.system_id !== systemId) {
      state.reportExport = null;   // hand-off options are remembered per system
    }
    state.reportSelected = { system_id: systemId, date: pick };
    state.reportSave = "";
    state.reportNew = null;   // opening a report leaves the "assess a system" form
    state.reportTab = "report";   // you read an assessment before deciding what to send
  } catch (e) {
    toast(e.message, true);
    return;
  }
  // Names and owners for the referenced controls, resolved once per opened report.
  // Best-effort: if the mitigations call fails the report still renders, just with ids.
  try {
    state.reportMitInfo = await resolveMitigationsForReport(state.currentReport);
  } catch (e) {
    state.reportMitInfo = {};
  }
  renderReportsRail(); renderReportsMain(); writeRoute();
}

// -------------------------------------------------- report draft editing --- //
// A draft is edited in place: no Edit button, no mode switch. Every control carries a
// dot-path into state.currentReport (data-rp) and a change schedules one debounced PUT
// of the whole report. Going final swaps every control back to plain text.
// Every report is editable. This used to gate on status, which meant a specialist who
// spotted a wrong grade in a final report had to first decide whether their edit was a
// "correction" or a "re-assessment" and press a different button for each. Nobody wants
// to classify their own typo. Editing is now always allowed and drops the report back to
// draft, so the signature is the thing that has to be renewed, not the text that has to
// be locked.
const reportEditable = () => !!state.currentReport;

// Fixed by keel/schemas/report.py, which is not served through /schema (that endpoint
// covers catalog entities). Keep these in step with the Literals there.
const REPORT_LEVELS = ["low", "medium", "high"];

function setByPath(obj, path, value) {
  const parts = path.split(".");
  let node = obj;
  for (const p of parts.slice(0, -1)) node = node[p];
  node[parts[parts.length - 1]] = value;
}

// A prose field. Editable draft -> a textarea wearing the surrounding type; final -> text.
function rProse(path, value, cls, hint) {
  const v = value == null ? "" : value;
  if (!reportEditable()) {
    return v ? `<div class="${cls}">${esc(v)}</div>` : `<div class="${cls} rep-empty">not recorded</div>`;
  }
  return `<textarea class="ie ${cls}" rows="1" data-rp="${esc(path)}"
    placeholder="${esc(hint || "not recorded")}">${esc(v)}</textarea>`;
}

function rSelect(path, value, options, cls) {
  if (!reportEditable()) return `<span class="${cls}">${esc(value)}</span>`;
  const opts = options.map(o =>
    `<option value="${esc(o)}" ${o === value ? "selected" : ""}>${esc(o)}</option>`).join("");
  return `<select class="${cls}" data-rp="${esc(path)}">${opts}</select>`;
}

// A textarea that is exactly as tall as its content — an inline editor that scrolls
// internally would hide the sentence being corrected.
function autosize(ta) {
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}

let reportSaveTimer = null;
function scheduleReportSave() {
  state.reportSave = "saving";
  paintSaveState();
  clearTimeout(reportSaveTimer);
  reportSaveTimer = setTimeout(saveReport, 500);
}

async function saveReport() {
  const sel = state.reportSelected;
  if (!sel || !state.currentReport) return;
  let saved;
  try {
    // The body is deliberately not swapped back into state.currentReport: replacing it
    // mid-typing would change the object the focused control is bound to.
    saved = await api("PUT", `/reports/${encodeURIComponent(sel.system_id)}/${encodeURIComponent(sel.date)}`,
      state.currentReport);
    state.reportSave = "ok";
  } catch (e) {
    state.reportSave = "err";
    toast(e.message, true);
    paintSaveState();
    return;
  }
  paintSaveState();

  // Status is the one thing the server decides, and editing a final report sends it back
  // to draft. Without this the header keeps saying "final" over a document that is not,
  // which is exactly the claim the status exists to make honestly.
  if (saved && saved.status !== state.currentReport.status) {
    state.currentReport.status = saved.status;
    state.reportSeries[sel.system_id] = null;   // the rail badge is stale too
    renderReportsMain();
    await loadReports();
    toast("Back to draft \u2014 finalize again when you are done");
  }
}

function paintSaveState() {
  const el = document.getElementById("repSave");
  if (!el) return;
  const text = { saving: "saving…", ok: "saved", err: "not saved" };
  el.textContent = text[state.reportSave] || "";
  el.className = "savestate " + (state.reportSave === "ok" ? "ok" : state.reportSave === "err" ? "err" : "");
}

// One finding card. `included` on each requirement is a stored decision, not copy-time
// UI, so the specialist's judgment about what ships survives a reload.
function reportFindingHtml(f, fi) {
  // The card id alone ("CTRL-HACT-CRITICAL") is not a requirement anyone outside this
  // repo can read, and it is what the product team is being handed. Name and owner are
  // resolved once when the report opens (state.reportMitInfo) and shown here.
  const reqs = (f.requirements || []).map((r, ri) => {
    const info = r.mitigation_id ? (state.reportMitInfo || {})[r.mitigation_id] : null;
    const label = info ? info.name : (r.description || r.mitigation_id || "(unnamed requirement)");
    const statusBadge = r.coverage_status !== "needs_implementation"
      ? `<span class="badge soft">${esc(r.coverage_status.replace(/_/g, " "))}</span>` : "";
    // The id link sits OUTSIDE the label — inside it, clicking through to the mitigation
    // would also toggle the checkbox it is nested in.
    const idLink = r.mitigation_id
      ? `<button type="button" class="reflink" data-jump-mit="${esc(r.mitigation_id)}">${esc(r.mitigation_id)}</button>`
      : "";
    const owner = info && info.owner ? esc(" · owner: " + info.owner) : "";
    const box = reportEditable()
      ? `<input type="checkbox" data-rp="findings.${fi}.requirements.${ri}.included" ${r.included ? "checked" : ""}>`
      : `<input type="checkbox" ${r.included ? "checked" : ""} disabled>`;
    return `<div class="req-row"><label>${box}<span>${esc(label)} ${statusBadge}</span></label></div>`
      + ((idLink || owner) ? `<div class="req-meta" style="margin-left:24px">${idLink}${owner}</div>` : "")
      + (r.coverage_note ? `<div class="req-note">${esc(r.coverage_note)}</div>` : "");
  }).join("");
  const ignored = (f.ignored_mitigations || []).map(im =>
    `<div class="req-ignored">Not applied: <button type="button" class="reflink" data-jump-mit="${esc(im.mitigation_id)}">${esc(im.mitigation_id)}</button> — ${esc(im.reason)}</div>`).join("");
  // Severity and likelihood are grades, so they carry the weight ramp. Harm, surface and
  // exploitation cost are facts ABOUT the finding, not grades of it — neutral badges, so
  // nothing on the card competes with the ranking. They also read without being named,
  // which is why they are badges and the chain rows below are labelled.
  const fact = (path, value, options) => reportEditable()
    ? `<span class="badge type">${rSelect(path, value, options, "ie")}</span>`
    : `<span class="badge type">${esc(value)}</span>`;
  const facts = fact(`findings.${fi}.harm`, f.harm, harmEnum())
    + fact(`findings.${fi}.attack_surface`, f.attack_surface, surfaceEnum())
    + `<span class="badge type">exploitation ${rSelect(`findings.${fi}.exploitation_complexity`,
        f.exploitation_complexity, REPORT_LEVELS, "ie")}</span>`;
  const grade = (kind, path, level, quiet) => {
    const inner = reportEditable()
      ? `<select class="ie-grade" data-rp="${esc(path)}" data-grade="${kind}">${REPORT_LEVELS.map(o =>
          `<option value="${o}" ${o === level ? "selected" : ""}>${o}</option>`).join("")}</select>`
      : esc(level);
    return `<span class="sev ${quiet ? "quiet " : ""}sev-${esc(level)}"><span class="p">${kind}</span>${inner}</span>`;
  };
  // The chain the grades rest on. asset / vulnerability / delta and the source's motive
  // and access are all in the report and none of them used to reach the screen, so a
  // reader had a severity with nothing behind it.
  const row = (k, path, v) => (reportEditable() || (v || "").toString().trim())
    ? `<dt>${k}</dt><dd>${rProse(path, v, "")}</dd>` : "";
  const chain = row("Asset", `findings.${fi}.asset`, f.asset)
    + row("Weakness", `findings.${fi}.vulnerability`, f.vulnerability)
    // A source without an attacker has no goal: `motive` then holds what triggers it
    // here, and `access` the permissions it acts with (method step 3).
    + row("Goal or trigger", `findings.${fi}.source.motive`, f.source.motive)
    + row("Access or permissions", `findings.${fi}.source.access`, f.source.access)
    + row("Since last time", `findings.${fi}.delta`, f.delta);
  // A finding names a threat. If it came from the catalog, that name is a way into it.
  const title = f.from_catalog
    ? `<button type="button" class="ctitle reflink" data-jump-threat="${esc(f.id)}">${esc(f.id)}</button>`
    : `<span class="ctitle">${esc(f.id)}</span>`;
  return `<div class="card finding sev-${esc(f.risk.severity)}" data-fi="${fi}">
    <div class="chead">
      ${title}
      <span class="badge soft">${f.from_catalog ? "from catalog" : "not in catalog"}</span>
      ${fact(`findings.${fi}.source.who`, f.source.who, sourceEnum())}
      <span class="grades">
        ${grade("severity", `findings.${fi}.risk.severity`, f.risk.severity)}
        ${grade("likelihood", `findings.${fi}.risk.likelihood`, f.risk.likelihood, true)}
        ${reportEditable() ? `<button type="button" class="fdrop" data-drop-finding="${fi}" title="Remove this finding">&times;</button>` : ""}
      </span>
    </div>
    ${rProse(`findings.${fi}.scenario`, f.scenario, "fscenario")}
    <div class="fwhy"><span class="k">Why these grades</span>${rProse(`findings.${fi}.risk.reasoning`,
      f.risk.reasoning, "", "A full sentence — this label is not carried into the hand-off")}</div>
    ${chain ? `<dl class="fchain">${chain}</dl>` : ""}
    <div class="badges">${facts}</div>
    ${(reqs || ignored) ? `<div class="freqs"><span class="freqs-k">Requirements</span>${reqs}${ignored}</div>` : ""}
  </div>`;
}

function reportDetailHtml(rep) {
  const sel = state.reportSelected || {};
  const series = state.reportSeries[sel.system_id] || [];
  // Switching between dates is navigation, not content, so it sits under the header
  // where you look for it — as a strip, not a section band at the foot of the page.
  const dateChips = series.length > 1
    ? `<div class="rep-dates"><span class="k">Other assessments</span>${series.map(s =>
        `<span class="ov-chip ${s.date === sel.date ? "on" : ""}" data-date="${esc(s.date)}" title="Open ${esc(s.date)}">${esc(s.date)}${s.status === "draft" ? " · draft" : ""}</span>`
      ).join("")}</div>`
    : "";

  // One ranked list, high → low. The spine carries the ranking, so grouping the same
  // card under two different headings only added a second way to render one thing.
  // Sorted as (finding, original index) pairs — the index is the write path, and a
  // sorted copy's index would point every edit at the wrong finding.
  const findings = (rep.findings || []).map((f, i) => [f, i])
    .sort((a, b) => SEVERITY_RANK.indexOf(a[0].risk.severity) - SEVERITY_RANK.indexOf(b[0].risk.severity));
  const findingsHtml = findings.length
    ? findings.map(([f, i]) => reportFindingHtml(f, i)).join("")
    : '<p class="placeholder">No findings.</p>';

  // A ruled-out candidate names a catalog threat, so it links like anything else does.
  const discarded = (rep.discarded || []).length
    ? rep.discarded.map(d => `<div class="req-ignored">
        <button type="button" class="reflink" data-jump-threat="${esc(d.id)}">${esc(d.id)}</button> — ${esc(d.reason)}</div>`).join("")
    : '<p class="placeholder">Nothing ruled out.</p>';

  // How the run went, kept to improve the ASSESSOR rather than to describe the system.
  // `volunteered` is the sharpest of the three: a question the agent asked is one the
  // skill already knows to ask, while a fact the specialist had to supply unprompted is
  // a hole in the skill with its edges drawn.
  const meta = rep.meta || {};
  const mBlock = (label, sub, body) => body
    ? `<div class="ov-block"><p class="k">${esc(label)}${sub ? `<span class="n">${esc(sub)}</span>` : ""}</p>${body}</div>`
    : "";
  const qaHtml = (meta.questions || []).map(d => `<div class="card">
      <div class="rep-qa"><span class="meta">Q</span>${esc(d.question)}</div>
      <div class="rep-qa"><span class="meta">A</span>${esc(d.answer)}</div>
      <div class="rationale">${esc(d.impact)}</div>
    </div>`).join("");
  const listHtml = xs => (xs || []).length
    ? `<ul class="plain">${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const took = (() => {
    const ms = Date.parse(meta.finished_at || "") - Date.parse(meta.started_at || "");
    if (!(ms > 0)) return "";
    const m = Math.round(ms / 60000);
    return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
  })();
  const metaCount = (meta.questions || []).length + (meta.volunteered || []).length
    + (meta.critique || []).length;
  const runMeta = (metaCount || took)
    ? `${took ? `<p class="ov-gap-desc">Took ${esc(took)}, from starting the skill to writing this report.</p>` : ""}
       ${mBlock("Questions the agent asked", `${(meta.questions || []).length}`, qaHtml)}
       ${mBlock("Context the specialist volunteered", "never asked for", listHtml(meta.volunteered))}
       ${mBlock("Where the specialist pushed back", "", listHtml(meta.critique))}`
    : '<p class="placeholder">Nothing recorded about how this assessment ran.</p>';

  // Folded and side by side at the foot: both are a trace of how the assessment ran,
  // useful when debugging the assessor, not part of reviewing the system.
  const fold = (key, label, count, body) => `<section class="readsec">
    <details class="fold" data-fold="${key}" ${state.reportAside[key] ? "open" : ""}>
      <summary><h3 class="slabel">${label} <span class="sub">— ${count}</span></h3></summary>
      <div class="fold-body">${body}</div>
    </details></section>`;

  const draft = rep.status === "draft";
  // One verb. There used to be three — save, correct, reopen — and between them they
  // asked the reader to classify their own edit before making it, which nobody wants to
  // do before fixing a typo. Editing is always allowed; editing a final report drops it
  // back to draft, because a document that changed after sign-off is not signed off.
  const actions = `<span class="savestate" id="repSave"></span>
    ${draft
      ? `<button class="btn primary" id="repFinalize" title="Sign this report off as a dated record">Finalize</button>`
      : `<span class="badge soft">final</span>`}`;

  // A tab, not a third column. The hand-off was stealing 360px of every report's width
  // permanently to serve the last thing anyone does with one; as a tab it costs nothing
  // until asked for, and then gets the whole pane.
  const tabs = `<nav class="subtabs">
    <button data-rtab="report" class="${state.reportTab === "report" ? "on" : ""}">Report</button>
    <button data-rtab="handoff" class="${state.reportTab === "handoff" ? "on" : ""}">Hand-off</button>
  </nav>`;

  return `<div class="detail">
    <div class="dhead">
      <div class="dicon">R</div>
      <div class="dtitle">
        <h2>${esc(rep.system_name)}</h2>
        <div class="dsub">Assessed ${esc(rep.date)} by ${esc(rep.assessor)}
          <span class="rep-status ${esc(rep.status)}">${esc(rep.status)}</span></div>
      </div>
      <div class="hactions">${actions}</div>
    </div>
    ${dateChips}
    ${tabs}
    ${state.reportTab === "handoff" ? handoffHtml() : `
    ${draft ? "" : `<section class="readsec rep-final"><p>This report is final. Editing it is allowed and drops it back to draft, so finalize again when you are done. To assess the system again rather than fix this record, start a new report — it gets today's date and leaves this one standing.</p></section>`}
    <section class="readsec">
      <div class="ov-block"><p class="k">System</p>${rProse("system_description", rep.system_description, "prose")}</div>
      <div class="ov-block"><p class="k">What changed since the last assessment</p>
        ${rProse("delta_summary", rep.delta_summary, "prose")}</div>
    </section>
    ${readsec("Findings", findingsHtml
      + '<button class="btn ghost" id="addFinding" style="margin-top:10px">Add a finding</button>',
      `— ${findings.length}, worst first`)}
    <div class="rep-aside">
      ${fold("discarded", "Ruled out", (rep.discarded || []).length, discarded)}
      ${fold("meta", "How this assessment ran", metaCount, runMeta)}
    </div>`}
  </div>`;
}

// Resolve each referenced mitigation's display name and the owner accountable for it
// HERE — owner lives on the implementation (a real deployment), not on the card, so
// prefer a shared implementation's owner, else the first one recorded.
async function resolveMitigationsForReport(rep) {
  const ids = [...new Set((rep.findings || [])
    .flatMap(f => (f.requirements || []).map(r => r.mitigation_id).filter(Boolean)))];
  if (!ids.length) return {};
  const all = (await j("/mitigations?brief=false&include=implementations")).mitigations;
  const byId = Object.fromEntries(all.map(m => [m.id, m]));
  const out = {};
  for (const id of ids) {
    const m = byId[id];
    if (!m) continue;
    const impls = m.implementations || [];
    const pick = impls.find(i => i.coverage === "shared") || impls[0] || {};
    out[id] = { name: m.name || id, owner: (pick.owner || "").trim() || null };
  }
  return out;
}

// ------------------------------------------------------- report hand-off --- //
// What goes to the product team, and what it looks like before it goes. The options
// run most-useful-first for THAT reader: the asks, then the evidence behind them, then
// the framing. Nothing is mandatory, but turning the asks off leaves an empty document.
// The run record is deliberately absent: it is meta ABOUT this assessment — what the
// agent asked, what it failed to ask, where it was corrected — and there is nowhere in
// a product team's backlog to put it. It stays on screen, folded, to improve the skill.
const REPORT_EXPORT_GROUPS = [
  { key: "requirements", label: "Requirements", opts: [
    { key: "reqs", label: "Include them" },
    { key: "owner", label: "Who owns each", sub: "reqs" },
    // "Already covered" said nothing about WHERE: covered last time, covered by some
    // policy elsewhere, or present in this deployment? It is the last one.
    { key: "covered", label: "Ones this system already has", sub: "reqs" },
  ] },
  { key: "evidence", label: "Evidence", opts: [
    { key: "scenario", label: "The scenario behind each" },
    { key: "reasoning", label: "Why the risk is what it is" },
    { key: "grades", label: "Severity and likelihood" },
    { key: "chain", label: "Asset, weakness, attacker" },
  ] },
  { key: "context", label: "Context", opts: [
    { key: "header", label: "System and date" },
    { key: "delta", label: "What changed since last time" },
    { key: "discarded", label: "Ruled out" },
  ] },
];
const REPORT_EXPORT_DEFAULTS = {
  reqs: true, owner: true, covered: false,
  scenario: true, reasoning: true, grades: false, chain: false,
  header: false, delta: false, discarded: false,
};
// Versioned: bumping the prefix retires anyone's saved set when the defaults change,
// which is the only way a changed default reaches someone who already used the panel.
const LS_REPORT_EXPORT = "keel.reportExport.v2.";

function reportExportSettings() {
  if (state.reportExport) return state.reportExport;
  const sys = (state.reportSelected || {}).system_id || "";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(LS_REPORT_EXPORT + sys) || "{}"); } catch (e) { saved = {}; }
  state.reportExport = { ...REPORT_EXPORT_DEFAULTS, ...saved };
  return state.reportExport;
}

function saveReportExportSettings() {
  const sys = (state.reportSelected || {}).system_id || "";
  try { localStorage.setItem(LS_REPORT_EXPORT + sys, JSON.stringify(state.reportExport)); } catch (e) { /* private mode */ }
}

// The hand-off as markdown. Requirements are grouped under the finding that produced
// them, so the prose leading to a set of asks is stated once rather than repeated under
// every one of them.
function buildReportMarkdown(rep, mitInfo, s) {
  if (!rep) return "";
  const lines = [];
  if (s.header) {
    lines.push(`# Security requirements — ${rep.system_name}`, "");
    lines.push(`Assessed ${rep.date} by ${rep.assessor}.`, "");
  }
  // NOT nested under `header`: the delta is its own option, and hiding it whenever the
  // title line was switched off made the checkbox look broken.
  if (s.delta && rep.delta_summary) lines.push(rep.delta_summary, "");

  const reqLine = r => {
    const info = r.mitigation_id ? mitInfo[r.mitigation_id] : null;
    const label = info ? info.name : (r.description || r.mitigation_id);
    const owner = s.owner && info && info.owner ? ` (owner: ${info.owner})` : "";
    const note = r.coverage_status === "already_covered" ? " — already in place in this system" : "";
    return `- ${label}${owner}${note}`;
  };

  let any = false;
  for (const f of rep.findings || []) {
    const reqs = s.reqs
      ? (f.requirements || []).filter(r => r.included || (s.covered && r.coverage_status === "already_covered"))
      : [];
    const wantsBody = s.scenario || s.reasoning || s.grades || s.chain;
    if (!reqs.length && !wantsBody) continue;
    any = true;
    // The id line, then the story, with no blank line between them: the id names the
    // finding and the sentences under it ARE the finding, not a separate section.
    if (s.grades) lines.push(`**${f.id}** — severity ${f.risk.severity}, likelihood ${f.risk.likelihood}`);
    else if (wantsBody) lines.push(`**${f.id}**`);
    // Scenario and reasoning are one paragraph. No "Why:" lead-in either — reasoning is
    // authored as a sentence that stands on its own, so it reads as the next thing said
    // about the finding rather than as a labelled fragment.
    const story = [s.scenario ? f.scenario : "", s.reasoning ? f.risk.reasoning : ""]
      .filter(t => (t || "").trim()).join(" ");
    if (story) lines.push(story, "");
    else if (s.grades || wantsBody) lines.push("");
    if (s.chain) {
      lines.push(`- Asset: ${f.asset}`);
      lines.push(`- Weakness: ${f.vulnerability}`);
      lines.push(`- Source: ${f.source.who} — ${f.source.motive}, via ${f.source.access}`);
      lines.push("");
    }
    if (reqs.length) { lines.push(...reqs.map(reqLine), ""); }
  }
  if (!any) lines.push("_Nothing selected._", "");

  if (s.discarded && (rep.discarded || []).length) {
    lines.push("## Ruled out", "");
    lines.push(...rep.discarded.map(d => `- ${d.id} — ${d.reason}`), "");
  }
  return lines.join("\n").trimEnd();
}

// The hand-off tab, full width: what to include on the left, the exact text that will
// leave on the right. It used to be a 360px rail, where the preview was a column of
// wrapped mono fragments and every report was permanently 360px narrower for it.
function handoffHtml() {
  const s = reportExportSettings();
  const groups = REPORT_EXPORT_GROUPS.map(g => `<div class="exp-group">
      <p class="exp-k">${esc(g.label)}</p>
      ${g.opts.map(o => {
        const off = o.sub && !s[o.sub];
        return `<label class="exp-opt ${o.sub ? "sub" : ""} ${off ? "off" : ""}">
          <input type="checkbox" data-exp="${esc(o.key)}" ${s[o.key] ? "checked" : ""} ${off ? "disabled" : ""}>
          ${esc(o.label)}</label>`;
      }).join("")}
    </div>`).join("");
  const md = buildReportMarkdown(state.currentReport, state.reportMitInfo || {}, s);
  return `<div class="handoff">
    <div>
      <p class="exp-note">Only what is ticked here leaves this screen. Unticking a requirement here does not change the report — untick it on the finding for that.</p>
      ${groups}
      <div class="exp-actions">
        <button class="btn primary" id="expCopy">Copy</button>
        <button class="btn ghost" id="expDownload">Download</button>
      </div>
    </div>
    <div>
      <p class="exp-k">What leaves this screen</p>
      <div class="exp-preview" id="expPreview">${esc(md)}</div>
    </div>
  </div>`;
}

function wireHandoff() {
  const main = document.getElementById("main");
  main.querySelectorAll("[data-exp]").forEach(cb => cb.onchange = () => {
    state.reportExport[cb.dataset.exp] = cb.checked;
    saveReportExportSettings();
    renderReportsMain();
  });
  const md = () => buildReportMarkdown(state.currentReport, state.reportMitInfo || {}, reportExportSettings());
  const copy = document.getElementById("expCopy");
  if (copy) copy.onclick = async () => {
    try { await copyText(md()); toast("Copied to clipboard"); }
    catch (e) { toast(e.message, true); }
  };
  const dl = document.getElementById("expDownload");
  if (dl) dl.onclick = () => {
    const rep = state.currentReport;
    const url = URL.createObjectURL(new Blob([md()], { type: "text/markdown" }));
    const a = document.createElement("a");
    a.href = url; a.download = `${rep.system_id}-${rep.date}-requirements.md`; a.click();
    URL.revokeObjectURL(url);
  };
}

// navigator.clipboard only exists in a secure context, so it is absent when someone
// serves Keel to their team over plain http on a LAN address. Fall back to the old
// execCommand path there rather than losing the feature.
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  document.body.removeChild(ta);
  if (!ok) throw new Error("Copy failed — select the text and copy it manually");
}

function wireReportDetail() {
  const main = document.getElementById("main");
  main.querySelectorAll(".ov-chip[data-date]").forEach(chip =>
    chip.onclick = () => openReportSystem(state.reportSelected.system_id, chip.dataset.date));

  wireJumpLinks(main);

  // Remember which folded footer sections the reader opened, across re-renders.
  main.querySelectorAll("details[data-fold]").forEach(d =>
    d.ontoggle = () => { state.reportAside[d.dataset.fold] = d.open; });

  main.querySelectorAll("textarea.ie").forEach(ta => autosize(ta));

  // One handler for every editable control: write the value at its dot-path into the
  // open report, then schedule the save. Nothing re-renders on a keystroke.
  main.querySelectorAll("[data-rp]").forEach(el => {
    const commit = () => {
      setByPath(state.currentReport, el.dataset.rp, el.type === "checkbox" ? el.checked : el.value);
      scheduleReportSave();
    };
    if (el.tagName === "TEXTAREA") {
      el.oninput = () => { autosize(el); commit(); };
    } else {
      el.onchange = () => {
        commit();
        // A grade repaints its own badge and spine in place. Re-rendering here would
        // re-sort the list under the cursor and move the card that was just changed.
        if (el.dataset.grade) {
          el.parentElement.className = "sev " + (el.dataset.grade === "likelihood" ? "quiet " : "") + "sev-" + el.value;
          if (el.dataset.grade === "severity") {
            const card = el.closest(".finding");
            if (card) card.className = "card finding sev-" + el.value;
          }
        }
      };
    }
  });

  main.querySelectorAll("[data-drop-finding]").forEach(b => b.onclick = () => {
    const fi = Number(b.dataset.dropFinding);
    const f = state.currentReport.findings[fi];
    if (!confirm(`Remove ${f.id} from this report?`)) return;
    state.currentReport.findings.splice(fi, 1);
    scheduleReportSave();
    renderReportsMain();
  });

  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on("repFinalize", () => finalizeReport());
  main.querySelectorAll("[data-rtab]").forEach(b => b.onclick = () => {
    state.reportTab = b.dataset.rtab;
    renderReportsMain();
    main.scrollTop = 0;
  });
  on("addFinding", () => addFinding());
  paintSaveState();
}

// A finding skeleton. Every required field gets a value the schema accepts, so the
// report still validates the instant it is added and the save that follows succeeds.
function addFinding() {
  const rep = state.currentReport;
  if (!rep) return;
  rep.findings.push({
    id: "T-NEW", from_catalog: false, scenario: "",
    source: { who: sourceEnum()[0] || "external-attacker", motive: "", access: "" },
    asset: "", attack_surface: surfaceEnum()[0] || "user-input", vulnerability: "",
    exploitation_complexity: "medium", harm: harmEnum()[0] || "data-exposed",
    risk: { likelihood: "medium", severity: "medium", reasoning: "" },
    delta: "", requirements: [], ignored_mitigations: [],
  });
  scheduleReportSave();
  renderReportsMain();
  const cards = document.querySelectorAll(".finding");
  if (cards.length) cards[cards.length - 1].scrollIntoView({ block: "center" });
}

// Freezing is the one irreversible step on this screen, so it asks first.
async function finalizeReport() {
  const sel = state.reportSelected;
  if (!sel) return;
  if (!confirm("Finalize this report? It becomes a dated record. You can still edit it, "
    + "but editing drops it back to draft and it will need finalizing again.")) return;
  clearTimeout(reportSaveTimer);
  await saveReport();
  try {
    state.currentReport = await api("POST",
      `/reports/${encodeURIComponent(sel.system_id)}/${encodeURIComponent(sel.date)}/finalize`);
    state.reportSeries[sel.system_id] = null;   // its status changed
    toast("Report finalized");
  } catch (e) { toast(e.message, true); return; }
  await openReportSystem(sel.system_id, sel.date);
}

// ------------------------------------------------------- style-guide screen -- //
// Coverage completeness for a field, matched by entity_type + field_name.
// Orphans are excluded from the coverage report, so this returns null for them.
function coverageFor(entity, field) {
  const ents = (state.coverage && state.coverage.entities) || [];
  const ent = ents.find(e => e.entity_type === entity);
  if (!ent) return null;
  const f = (ent.fields || []).find(x => x.field_name === field);
  return f ? f.completeness : null;
}
function covClass(pct) { return pct >= 67 ? "c-hi" : pct >= 34 ? "c-mid" : "c-lo"; }

// Text search: match the field name and its entity.
function styleFieldMatchesText(entity, fname) {
  const q = state.styleFilter.toLowerCase();
  if (!q) return true;
  return (fname + " " + entity).toLowerCase().includes(q);
}
// Facet-match a field: entity chips, coverage band, orphans-only. Orphan fields are
// excluded from the coverage report (coverageFor → null), so they count as empty.
function styleFieldMatchesFacets(entity, fname, f) {
  const F = state.styleFacets;
  if (F.entity.size && !F.entity.has(entity)) return false;
  if (F.coverage.size) {
    const pct = f.is_orphan ? 0 : (coverageFor(entity, fname) ?? 0);
    const band = pct >= 100 ? "complete" : pct > 0 ? "partial" : "empty";
    if (!F.coverage.has(band)) return false;
  }
  if (F.orphan.size && !f.is_orphan) return false;
  return true;
}

// Left rail: entity → field tree built from state.style.entities (schema-derived,
// so it can never drift from the model). Text + facets filter which fields render;
// an entity group with no matching fields is hidden entirely.
function renderStyleRail() {
  const el = document.getElementById("list");
  const ents = (state.style && state.style.entities) || {};
  let html = "";
  let total = 0, shown = 0;
  for (const [etype, ent] of Object.entries(ents)) {
    const fnames = Object.keys(ent.fields || {});
    const matched = fnames.filter(fname => {
      total++;
      const f = ent.fields[fname];
      return styleFieldMatchesText(etype, fname) && styleFieldMatchesFacets(etype, fname, f);
    });
    if (!matched.length) continue;                 // hide empty entity groups
    html += `<div class="sg-group">${esc(etype)}</div>`;
    if (!styleFacetsNarrowToFields()) {
      const recActive = state.styleSel && state.styleSel.entity === etype && !state.styleSel.field;
      const authored = !!(ent.entity && (ent.entity.purpose || (ent.entity.instructions || []).length
                          || (ent.entity.avoid || []).length));
      html += `<div class="row sg-frow ${recActive ? "active" : ""}" data-entity="${esc(etype)}" data-field="">
        <span class="fname">the record</span>
        <span class="badge ${authored ? "soft" : "cov empty"}">${authored ? "authored" : "empty"}</span>
      </div>`;
    }
    for (const fname of matched) {
      shown++;
      const f = ent.fields[fname];
      const active = state.styleSel && state.styleSel.entity === etype && state.styleSel.field === fname;
      let badge;
      if (f.is_orphan) {
        badge = '<span class="badge orphan" title="Schema removed this field">orphan</span>';
      } else {
        const pct = coverageFor(etype, fname);
        const n = pct == null ? 0 : pct;
        badge = `<span class="badge cov ${covClass(n)}">${n}%</span>`;
      }
      html += `<div class="row sg-frow ${active ? "active" : ""}" data-entity="${esc(etype)}" data-field="${esc(fname)}">
        <span class="fname">${esc(fname)}</span>${badge}
      </div>`;
    }
  }
  el.innerHTML = html || '<div class="empty" style="margin-top:40px">No matches.</div>';
  document.getElementById("count").textContent = shown + " / " + total;
  el.querySelectorAll(".sg-frow").forEach(r => r.onclick = () => selectStyleField(r.dataset.entity, r.dataset.field));
}

// The record has no completeness percentage and cannot be an orphan, so it drops out
// when a facet that only fields can answer is active.
function styleFacetsNarrowToFields() {
  const f = state.styleFacets || {};
  return !!((f.coverage && f.coverage.size) || (f.orphan && f.orphan.size));
}

// Style-guide facet panel — Entity / Coverage / Orphan, same builder as the other rails.
function styleFacetDefs() {
  const ents = Object.keys((state.style && state.style.entities) || {});
  return [
    { key: "entity", label: "Entity", opts: ents.map(e => [e, e]) },
    { key: "coverage", label: "Coverage", opts: [["complete", "complete"], ["partial", "partial"], ["empty", "empty"]] },
    { key: "orphan", label: "Orphan", opts: [["orphan", "orphans only"]] },
  ];
}
function renderStyleFacets() {
  renderFacetPanel({
    open: state.styleFacetsOpen,
    facets: state.styleFacets,
    defs: styleFacetDefs(),
    onopen: on => { state.styleFacetsOpen = on; renderStyleFacets(); },
    onclear: () => { for (const s of Object.values(state.styleFacets)) s.clear(); renderStyleFacets(); renderStyleRail(); },
    ontoggle: (key, val) => {
      const s = state.styleFacets[key];
      s.has(val) ? s.delete(val) : s.add(val);
      renderStyleFacets(); renderStyleRail();
    },
  });
}

// Select a field → seed the editor draft from the saved style entry (a working copy,
// so the right-pane preview can reflect edits before they are saved).
function selectStyleField(entity, field) {
  state.styleSel = { entity, field };
  const sf = styleField(entity, field) || {};
  state.styleDraft = {
    purpose: sf.purpose || "",
    content_requirements: [...(sf.content_requirements || [])],
    avoid: [...(sf.avoid || [])],
    examples: [...(sf.examples || [])],
    instructions: [...(sf.instructions || [])],
  };
  renderStyleRail(); renderStyleDetail(); renderStylePreview(); writeRoute();
}

// The live draft as a style-field-like object (what sgHint/sgPanel consume).
function styleDraftAsField() {
  const d = state.styleDraft || {};
  return {
    purpose: d.purpose || "",
    content_requirements: d.content_requirements || [],
    avoid: d.avoid || [],
    examples: d.examples || [],
    instructions: d.instructions || [],
  };
}

// Slots that count toward the coverage percentage (mirrors TRACKED_SLOTS server-side).
const STYLE_SLOTS = ["purpose", "content_requirements", "instructions", "avoid", "examples"];
function filledSlotCount(d) {
  return STYLE_SLOTS.filter(s => {
    const v = d[s];
    return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim());
  }).length;
}

    </div>
    <section class="field">

        record ? "what one record of this entity is"
               : "the one-line hint shown above the input"}</span></h3>
      <textarea class="f" id="sg_purpose" rows="2" placeholder="${
        record ? "what one record of this entity is" : "what this field is for"}">${esc(d.purpose)}</textarea>

    ${slotListSection("avoid", "Avoid", record

// A list-of-strings slot editor (add/remove rows) — same grammar as screen 1's
// repeatable cards: edit in place, add/remove re-renders.
function slotListSection(slot, label, sub) {
  const items = state.styleDraft[slot] || [];
  const rows = items.map((v, i) => `<li>
    <input class="f sg-item" data-slot="${esc(slot)}" data-i="${i}" value="${esc(v)}">

  return `<section class="field">
    <h3 class="slabel">${esc(label)}${sub ? ` <span class="sub">— ${sub}</span>` : ""}</h3>

    <button class="btn ghost sm sg-item-add" data-slot="${esc(slot)}">+ Add</button>
  </section>`;
}

// Right pane: a LIVE preview of exactly what an author sees when they focus this
// field on the Threats screen — same sgHint/sgPanel markup, fed from the in-progress

    const list = (items, label) => (items || []).filter(x => String(x).trim()).length
      ? `<h3 class="slabel">${label}</h3><ul class="plain">${

    el.innerHTML = `<p class="ptitle">Author preview</p>

    return;
  }
  const hint = sgHintFrom(sf) || '<div class="sg-hint" style="opacity:.55">No purpose yet.</div>';
  const panel = sgPanelFrom(sf, null, { show: true });
  el.innerHTML = `<p class="ptitle">Author preview <span class="slotcount">${n} / ${STYLE_SLOTS.length} slots</span></p>
    <p class="hint" style="margin:0 0 12px">What an author sees when they focus <b>${esc(field)}</b> on the Threats screen.</p>
    <div class="sg-fieldwrap field">

// PATCH the changed slots, then refresh the guide + coverage so the tree badges move.
async function saveStyleField() {
  if (!state.styleSel) return;
  const { entity, field } = state.styleSel;
  const d = state.styleDraft;
  const record = isRecordBar(state.styleSel);
  const body = record
    ? { purpose: d.purpose, instructions: d.instructions, avoid: d.avoid }
    : {
        purpose: d.purpose,
        content_requirements: d.content_requirements,
        avoid: d.avoid,
        examples: d.examples,
        instructions: d.instructions,
      };
  const url = "/style-guide/" + encodeURIComponent(entity)
    + (record ? "" : "/" + encodeURIComponent(field));
  try {
    await api("PATCH", url, body);
    state.style = await j("/style-guide");
    state.coverage = await j("/style-guide/coverage");
    renderStyleRail(); renderStyleFacets(); renderStyleDetail(); renderStylePreview();
    toast("Style guide saved");
    showSavedDialog("catalog/style_guide/" + entity + ".yaml");
