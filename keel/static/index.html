}

// ===================================================================== //
// Mitigations screen — reuses the three-pane grammar, the fieldset/legend //
// section tiers, the .ecard cards, the one-line hints, and the right-rail //
// Preview/Guidance modes from the threat editor.                          //
// ===================================================================== //

// Enum values off the mitigation schema. status/mitigation_class are Optional /
// required Literals, so the enum can sit directly on the prop or inside an anyOf.
function mitProp(name) { return (state.schema.mitigation && state.schema.mitigation.properties || {})[name]; }
function mitEnum(name) {
  const p = mitProp(name);
  if (!p) return [];
  if (Array.isArray(p.enum)) return p.enum;
  if (Array.isArray(p.anyOf)) { for (const a of p.anyOf) if (Array.isArray(a.enum)) return a.enum; }
  return [];
}

// Which threats currently link a given mitigation (reverse index over state.threatMits).
function threatsAddressing(mid) {
  return (state.threatMits || []).filter(t => (t.mitigations || []).some(l => l.id === mid));
}

// --------------------------------------------------------- mitigations rail - //
// Text search across id + name + purpose.
function mitMatchesText(m, f) {
  if (!f) return true;
  return [m.id, m.name, m.purpose].join(" ").toLowerCase().includes(f);
}
// A mitigation's facet-values for a group (orphan = addresses 0 threats).
function mitFacetValues(m, key) {
  switch (key) {
    case "class": return m.mitigation_class ? [m.mitigation_class] : [];
    case "status": return m.status ? [m.status] : [];
    case "implementations": {
      const impls = m.implementations || [];
      if (!impls.length) return ["none"];
      return impls.some(i => i.coverage === "shared") ? ["has", "shared"] : ["has"];
    }
    case "linkage": return threatsAddressing(m.id).length ? ["linked"] : ["orphan"];
  }
  return [];
}
function mitMatchesFacets(m) {
  const F = state.mitFacets;
  for (const key of Object.keys(F)) {
    const sel = F[key];
    if (!sel || !sel.size) continue;
    const vals = mitFacetValues(m, key);
    if (!vals.some(v => sel.has(v))) return false;   // AND across groups, OR within
  }
  return true;
}

function renderMitRail() {
  const el = document.getElementById("list");
  const f = state.mitFilter.toLowerCase();
  const items = state.mitRich.filter(m => mitMatchesText(m, f) && mitMatchesFacets(m));
  el.innerHTML = items.length ? items.map(m => `
    <div class="row ${state.mitSelected === m.id ? "active" : ""}" data-id="${esc(m.id)}">
      <span class="rid">${esc(m.id)}</span>
      <span class="rtitle">${esc(m.name)}</span>
    </div>`).join("") : '<div class="empty" style="margin-top:40px">No matches.</div>';
  document.getElementById("count").textContent = items.length + " / " + state.mitRich.length;
  el.querySelectorAll(".row").forEach(r => r.onclick = () => selectMit(r.dataset.id));
}

// Mitigations facet panel — a lighter set: class, status, implementations, linkage.
function mitFacetDefs() {
  return [
    { key: "class", label: "Class", opts: mitEnum("mitigation_class").map(v => [v, v]) },
    { key: "status", label: "Status", opts: mitEnum("status").map(v => [v, v]) },
    { key: "implementations", label: "Implementations", opts: [["has", "has"], ["shared", "shared"], ["none", "none"]] },
    { key: "linkage", label: "Linkage", opts: [["linked", "linked"], ["orphan", "orphan"]] },
  ];
}
function renderMitFacets() {
  renderFacetPanel({
    open: state.mitFacetsOpen,
    facets: state.mitFacets,
    defs: mitFacetDefs(),
    onopen: on => { state.mitFacetsOpen = on; renderMitFacets(); },
    onclear: () => { for (const s of Object.values(state.mitFacets)) s.clear(); renderMitFacets(); renderMitRail(); },
    ontoggle: (key, val) => {
      const s = state.mitFacets[key];
      s.has(val) ? s.delete(val) : s.add(val);
      renderMitFacets(); renderMitRail();
    },
  });
}

async function selectMit(id) {
  state.mitSelected = id; state.mitEditing = false; state.mitDraft = null;
  state.railMode = "preview"; state.guidance = null;
  state.mitValidation = { errors: [], advice: [] };
  // History is per-entry: clear it on select; loadHistory refetches and re-renders.
  state.mitHistory = null; state.mitHistoryExpanded = false;

  renderMitRail();
  try {
    state.currentMit = await j("/mitigations/" + encodeURIComponent(id));
  } catch (e) { state.currentMit = null; toast(e.message, true); }
  // Reverse index for "addresses threats" — one cheap call, kept fresh per select.
  try { const d = await j("/threats?brief=false&include=mitigations"); state.threatMits = d.threats || []; }
  catch (e) { /* leave whatever we had */ }
  renderMitDetail(); renderMitPreview();

// Read view — the mitigation card grouped into readable sections.
// Empty optional sections are omitted (no wall of dashes) and summarized in one muted
// line; Implementations stays visible with its intentional "orgs add these" empty state.
function readMitigation(mt) {
  const badge = (cls, v) => `<span class="badge ${cls}">${esc(v)}</span>`;
  const omitted = [];
  const parts = [];
  // Optional prose: rendered only when it has content; else recorded as a gap (with the
  // edit-form field to jump to when its chip is clicked).
  const optProse = (label, field, v, sub) => {
    if (v && String(v).trim()) parts.push(readsec(label, `<div class="prose">${md(v)}</div>`, sub));
    else omitted.push({ label, field });
  };
  // Optional block (list/cards): rendered only when non-empty; else recorded as a gap.
  // `count` (when given) is shown in the header of a populated block but kept out of the
  // gap chip, so an empty one reads "Validation", not "Validation (0)".
  const optBlock = (label, field, has, inner, sub, count) => {
    if (has) parts.push(readsec(count === undefined ? label : `${label} (${count})`, inner, sub));
    else omitted.push({ label, field });
  };

  // A decision is a value plus its reasoning: the value leads, in its own weight, and
  // the note follows as prose. Written as one paragraph, the value that a reader came to
  // filter on is buried in the middle of a sentence.
  const optDecision = (label, field, d, sub) => {
    if (d && d.value) {
      parts.push(readsec(label,
        `<p class="decision"><span class="dv">${esc(String(d.value).replace(/_/g, " "))}</span></p>`
        + `<div class="prose">${md(d.note || "")}</div>`, sub));
    } else omitted.push({ label, field });
  };

  optProse("Purpose", "purpose", mt.purpose);
  optProse("Scope", "scope", mt.scope, "— when this control applies");
  // Next to scope, because the two are one rule seen from both sides.
  optProse("Out of scope", "out_of_scope", mt.out_of_scope, "— and what is handled elsewhere");
  optDecision("Locus", "locus", mt.locus, "— which layer this belongs to");
  optProse("Control mechanism", "control_mechanism", mt.control_mechanism);
  optDecision("Failure behavior", "failure_behavior", mt.failure_behavior,
    "— when the control itself fails");
  optProse("Risk of formal implementation", "formal_implementation_risk", mt.formal_implementation_risk,
    "— what gets done half-heartedly, and what gets underestimated");
  optProse("Review", "review", mt.review);

  // Telemetry is a table because it is a list of events with the same columns; as prose
  // nobody checks their own event stream against it line by line.
  const tel = mt.telemetry || {};
  optBlock("Telemetry", "telemetry", (tel.events || []).length,
    `<table class="md"><thead><tr><th>Event</th><th>What it establishes</th>
       <th>Must carry</th></tr></thead><tbody>${(tel.events || []).map(e => `<tr>
       <td><code>${esc(e.name)}</code></td><td>${esc(e.records)}</td>
       <td>${(e.attributes || []).map(a => esc(a)).join(", ")}</td></tr>`).join("")}</tbody></table>`
    + (tel.evidence ? `<div class="prose">${md(tel.evidence)}</div>` : ""),
    "— what this control leaves behind");

  optBlock("Anti-patterns", "anti_patterns", (mt.anti_patterns || []).length,
    `<ul class="plain">${(mt.anti_patterns || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`);

  // Acceptance criteria are a table: the same three columns every time, read down rather
  // than across, which is how somebody actually works through an acceptance pass.
  const vlen = (mt.validation || []).length;
  optBlock("Validation", "validation", vlen,
    `<table class="md"><thead><tr><th>What is checked</th><th>How</th>
       <th>Passes when</th></tr></thead><tbody>${(mt.validation || []).map(v => `<tr>
       <td>${esc(v.criterion || "")}${v.base === false
         ? ' <span class="badge soft" title="Applies to some contours, not to every adoption">situational</span>' : ""}</td>
       <td>${esc(v.test_scenario || "")}</td>
       <td>${esc(v.expected_result || "")}</td></tr>`).join("")}</tbody></table>`,
    "— the bar for adopting it; situational rows apply to some contours only", vlen);

  // Folded: the FAQ is for a reader who has already hit the confusion, and unfolded it
  // sits between them and the fields they came for.
  const flen = (mt.faq || []).length;
  optBlock("FAQ", "faq", flen,
    `<details class="fold"><summary>${flen} question${flen === 1 ? "" : "s"}</summary>
      <div class="fold-body">${(mt.faq || []).map(q => `<div class="card">
        <div class="chead"><span class="ctitle">${esc(q.question || "(question)")}</span></div>
        ${q.answer ? `<div class="cdesc">${esc(q.answer)}</div>` : ""}
      </div>`).join("")}</div></details>`, null, flen);

  // Implementations — ALWAYS shown; its empty state is intentional and discoverable.
  const impl = (mt.implementations || []).length
    ? (mt.implementations || []).map(im => `<div class="card">
        <div class="chead"><span class="ctitle">${esc(im.title || "(untitled)")}</span>${im.coverage === "shared" ? `<span class="badge shared">shared</span>` : ""}</div>
        ${im.description ? `<div class="cdesc">${esc(im.description)}</div>` : ""}
        ${im.coverage === "shared" && im.covers ? `<div class="cdesc">Covers: ${esc(im.covers)}</div>` : ""}
        ${im.owner ? `<div class="cdesc">Owner: ${esc(im.owner)}</div>` : ""}
        ${im.reference ? `<div class="cdesc"><a href="${esc(im.reference)}" target="_blank" rel="noopener">${esc(im.reference)}</a></div>` : ""}
      </div>`).join("")
    : '<p class="placeholder">None yet — orgs add these after forking.</p>';
  parts.push(readsec(`Implementations (${(mt.implementations || []).length})`, impl, "— how orgs realize this control"));

  // Addresses threats — ALWAYS shown; each card jumps to that threat.
  const addressing = threatsAddressing(mt.id);
  // The id, the title and the grade were one line at three type sizes, and the rationale
  // - the only thing that says why the link exists - was not shown at all. A link without
  // its reasoning is just an arrow.
  const addressed = addressing.length
    ? addressing.map(t => {
        const link = (t.mitigations || []).find(l => l.id === mt.id) || {};
        return `<div class="card jrow" data-jthreat="${esc(t.id)}" title="Open ${esc(t.id)}">
          <div class="linkhead">
            <span class="cid">${esc(t.id)}</span>
            ${link.strength ? `<span class="badge ${link.strength === "gating" ? "gating" : "soft"}">${esc(link.strength)}</span>` : ""}
          </div>
          <div class="linktitle">${esc(t.title)}</div>
          ${link.rationale ? `<p class="linkwhy">${esc(link.rationale)}</p>` : ""}
          ${link.exception ? `<p class="linkwhy"><b>Except:</b> ${esc(link.exception)}</p>` : ""}
        </div>`;
      }).join("")
    : '<p class="placeholder">No threats link this mitigation.</p>';
  parts.push(readsec(`Addresses threats (${addressing.length})`, addressed));

  return `<div class="detail">
    ${crumb("Mitigations", mt.id)}
    ${lastChangedLine(state.mitHistory)}
    <div class="dhead">
      <div class="dicon">C</div>
      <div class="dtitle">
        <h2>${esc(mt.name)}</h2>
        <div class="did">${esc(mt.id)}</div>
        <div class="hbadges badges">
          ${mt.mitigation_class ? badge("type", mt.mitigation_class) : ""}
          ${mt.maintainer ? `<span class="maintainer">kept by ${esc(mt.maintainer)}</span>` : ""}
        </div>
        ${citationsHtml(mt.id, mt.positioning)}
      </div>
      ${mitHeadActions()}
    </div>
    ${parts.join("")}
    ${gapsBar(omitted)}
    ${historySection(mitHistoryCfg())}
  </div>`;
}

// Wire the mitigation detail pane (read + edit).
function wireMitDetail() {
  const editBtn = document.getElementById("mitEditBtn");
  if (editBtn) editBtn.onclick = enterMitEdit;
  const delBtn = document.getElementById("mitDeleteBtn");
  if (delBtn) delBtn.onclick = deleteMitigation;
  // Read view only: breadcrumb clears the selection; "Addresses threats" cards jump across.
  const crumbBtn = document.querySelector("#main .crumb-type");
  if (crumbBtn) crumbBtn.onclick = clearMitSelection;
  document.querySelectorAll("#main [data-jthreat]").forEach(el =>
    el.onclick = () => jumpToThreat(el.dataset.jthreat));
  // Read view only: a gap chip enters the editor and jumps to that field.
  document.querySelectorAll("#main .gap-chip").forEach(chip =>
    chip.onclick = () => { state.focusField = chip.dataset.gapField; enterMitEdit(); });
  // Read view only: the Git history section (selectors miss in edit mode).
  wireHistory(mitHistoryCfg());
  const cancelBtn = document.getElementById("mitCancelBtn");
  if (cancelBtn) cancelBtn.onclick = () => {
    const wasNew = state.mitDraft && state.mitDraft.isNew;
    state.mitEditing = false; state.mitDraft = null;
    state.railMode = "preview"; state.guidance = null;
    if (wasNew) { state.mitSelected = null; state.currentMit = null; renderMitRail(); }
    renderMitDetail(); renderMitPreview();
  };
  const saveBtn = document.getElementById("mitSaveBtn");
  if (saveBtn) saveBtn.onclick = saveMitigation;
  if (state.mitEditing) { wireMitEdit(); wireInlineGuidance(); applyMitValidation(); }
}

// One input builder shared by standalone sections and grouped subfields.
function mitInput(name, kind, rows) {
  const d = state.mitDraft;
  if (kind === "select") {
    const vals = mitEnum(name);
    const cur = d[name] || "";
    const blank = name === "status" ? `<option value="" ${cur ? "" : "selected"}>— none —</option>` : "";
    return `<select class="f" id="mit_${name}">${blank}${
      vals.map(v => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
  }
  if (kind === "textarea") {
    return `<textarea class="f" id="mit_${name}" rows="${rows || 3}">${esc(d[name] || "")}</textarea>`;
  }
  return `<input class="f" id="mit_${name}" value="${esc(d[name] || "")}">`;
}

        <button type="button" class="card-toggle impl-toggle" data-idx="${i}" aria-expanded="${isOpen}" title="${isOpen ? "Collapse" : "Expand"}">${isOpen ? "▾" : "▸"}</button>
        <span class="ecard-sum">${isOpen ? "Implementation " + (i + 1) : summary}</span>
        <button type="button" class="cardx impl-remove" data-idx="${i}" title="Remove implementation">×</button>
      </div>`;
    if (!isOpen) return `<div class="ecard implementation-card collapsed" data-idx="${i}">${head}</div>`;
    return `<div class="ecard implementation-card open" data-idx="${i}">${head}
      <div class="ecard-body">
      <div class="field" data-entity="implementation" data-field="title">
        <h3 class="slabel">Title</h3>
        ${hintRow("implementation", "title")}
        <input class="f impl-title" data-idx="${i}" value="${esc(im.title || "")}" placeholder="short name for this implementation">
      </div>
      <div class="field" data-entity="implementation" data-field="description">
        <h3 class="slabel">Description</h3>
        ${hintRow("implementation", "description")}
        <textarea class="f impl-description" data-idx="${i}" rows="3" placeholder="how the org realizes this control">${esc(im.description || "")}</textarea>
      </div>
      <div class="field" data-entity="implementation" data-field="reference">
        <h3 class="slabel">Reference <span class="sub">— optional URL</span></h3>
        ${hintRow("implementation", "reference")}
        <input class="f impl-reference" data-idx="${i}" value="${esc(im.reference || "")}" placeholder="https://…">
      </div>
      <div class="field" data-entity="implementation" data-field="coverage">
        <h3 class="slabel">Coverage</h3>
        ${hintRow("implementation", "coverage")}
        <select class="f impl-coverage" data-idx="${i}">
          <option value="local" ${(im.coverage || "local") === "local" ? "selected" : ""}>local — covers only what's described above</option>
          <option value="shared" ${im.coverage === "shared" ? "selected" : ""}>shared — covers everything within a stated boundary</option>
        </select>
      </div>
      ${im.coverage === "shared" ? `<div class="field" data-entity="implementation" data-field="covers">
        <h3 class="slabel">Covers <span class="sub">— the boundary this instance covers</span></h3>
        ${hintRow("implementation", "covers")}
        <input class="f impl-covers" data-idx="${i}" value="${esc(im.covers || "")}" placeholder="e.g. all agents on the Agent Platform">
      </div>` : ""}
      <div class="field" data-entity="implementation" data-field="owner">
        <h3 class="slabel">Owner <span class="sub">— optional</span></h3>
        ${hintRow("implementation", "owner")}
        <input class="f impl-owner" data-idx="${i}" value="${esc(im.owner || "")}" placeholder="accountable role for this deployment">
      </div>
      </div>
    </div>`;
  }).join("");
  return `<fieldset class="field section" data-entity="implementation" data-field="title">
    <legend class="slabel">Implementations <span class="sub">— how orgs realize this control</span></legend>
    ${cards}
    <button class="btn ghost" id="addImplementation">+ Add implementation</button></fieldset>`;
}

// A blank draft for a new mitigation (id + name prompted; class defaults to the first enum).
function newMitigation() {
  const id = (window.prompt("New mitigation id (e.g. CTRL-NEW-CONTROL):") || "").trim();
  if (!id) return;
  if (state.mitList.some(([mid]) => mid === id)) { toast("A mitigation with that id already exists", true); return; }
  const name = (window.prompt("Name (you can edit it below):") || "").trim();
  const class0 = mitEnum("mitigation_class")[0] || "";
  const blank = {
    id, name, status: "draft", mitigation_class: class0, purpose: "", scope: "",
    control_mechanism: "", failure_behavior: "", formal_implementation_risk: "", review: "",
    maintainer: "", locus: "", telemetry: "", anti_patterns: [], validation: [], faq: [],
    implementations: [],
  };
  state.mitSelected = id;
  state.currentMit = { ...blank };
  state.mitDraft = { ...blank, isNew: true };
  state.mitApOpen = new Set(); state.mitValOpen = new Set(); state.mitFaqOpen = new Set();
  state.mitImplOpen = new Set();
  state.mitEditing = true; state.railMode = "preview"; state.guidance = null;
  state.mitValidation = { errors: [], advice: [] };
  renderMitRail(); renderMitDetail(); renderMitPreview();
}

async function deleteMitigation() {
  const id = state.mitSelected;
  if (!id || (state.mitDraft && state.mitDraft.isNew)) return;
  if (!window.confirm(`Delete ${id}? It will be unlinked from any threats that reference it.`)) return;
  try { await api("DELETE", "/mitigations/" + encodeURIComponent(id)); }
  catch (e) { toast(e.message, true); return; }
  await refreshMitList();
  try { const d = await j("/threats?brief=false&include=mitigations"); state.threatMits = d.threats || []; } catch (e) { /* keep */ }
  state.mitSelected = null; state.currentMit = null; state.mitDraft = null;
  state.mitEditing = false; state.railMode = "preview"; state.guidance = null;
  state.mitValidation = { errors: [], advice: [] };
  renderMitRail(); renderMitFacets(); renderMitDetail(); renderMitPreview();
  toast("Mitigation deleted");
}

async function refreshMitList() {
  const mi = await j(MITS_RICH_URL);
  setMitData(mi.mitigations || []);
}

// Wire the edit form: scalar fields, the three card lists, add/remove/collapse.
const MIT_SCALARS = ["name", "status", "mitigation_class", "purpose", "scope", "control_mechanism",
  "failure_behavior", "formal_implementation_risk", "review", "maintainer", "locus", "telemetry"];
function shiftOpenSet(set, removed) {
  const next = new Set();
  (set || new Set()).forEach(x => { if (x < removed) next.add(x); else if (x > removed) next.add(x - 1); });
  return next;
}
function wireMitEdit() {
  const d = state.mitDraft;
  MIT_SCALARS.forEach(n => {
    const el = document.getElementById("mit_" + n);
    if (!el) return;
    const ev = el.tagName === "SELECT" ? "onchange" : "oninput";
    el[ev] = () => { d[n] = el.value; };
  });
  // Anti-pattern cards
  document.querySelectorAll(".ap-card").forEach(card => {
    const i = +card.dataset.idx;
    const text = card.querySelector(".ap-text");
    if (text) text.oninput = () => d.anti_patterns[i] = text.value;
    const rm = card.querySelector(".ap-remove");
    if (rm) rm.onclick = e => { e.stopPropagation(); d.anti_patterns.splice(i, 1); state.mitApOpen = shiftOpenSet(state.mitApOpen, i); renderMitDetail(); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => { if (e.target.closest(".ap-remove")) return; toggleSet(state.mitApOpen, i); renderMitDetail(); };
  });
  const addAp = document.getElementById("addAntiPattern");
  if (addAp) addAp.onclick = () => { d.anti_patterns.push(""); (state.mitApOpen || (state.mitApOpen = new Set())).add(d.anti_patterns.length - 1); renderMitDetail(); };
  // Validation cards
  document.querySelectorAll(".validation-card").forEach(card => {
    const i = +card.dataset.idx;
    const cr = card.querySelector(".val-criterion");
    const ts = card.querySelector(".val-test");
    const ex = card.querySelector(".val-expected");
    if (cr) cr.oninput = () => d.validation[i].criterion = cr.value;
    if (ts) ts.oninput = () => d.validation[i].test_scenario = ts.value;
    if (ex) ex.oninput = () => d.validation[i].expected_result = ex.value;
    const rm = card.querySelector(".val-remove");
    if (rm) rm.onclick = e => { e.stopPropagation(); d.validation.splice(i, 1); state.mitValOpen = shiftOpenSet(state.mitValOpen, i); renderMitDetail(); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => { if (e.target.closest(".val-remove")) return; toggleSet(state.mitValOpen, i); renderMitDetail(); };
  });
  const addVal = document.getElementById("addValidation");
  if (addVal) addVal.onclick = () => { d.validation.push({ criterion: "", test_scenario: "", expected_result: "" }); (state.mitValOpen || (state.mitValOpen = new Set())).add(d.validation.length - 1); renderMitDetail(); };
  // FAQ cards
  document.querySelectorAll(".faq-card").forEach(card => {
    const i = +card.dataset.idx;
    const q = card.querySelector(".faq-question");
    const a = card.querySelector(".faq-answer");
    if (q) q.oninput = () => d.faq[i].question = q.value;
    if (a) a.oninput = () => d.faq[i].answer = a.value;
    const rm = card.querySelector(".faq-remove");
    if (rm) rm.onclick = e => { e.stopPropagation(); d.faq.splice(i, 1); state.mitFaqOpen = shiftOpenSet(state.mitFaqOpen, i); renderMitDetail(); };
    const head = card.querySelector(".ecard-head");
    if (head) head.onclick = e => { if (e.target.closest(".faq-remove")) return; toggleSet(state.mitFaqOpen, i); renderMitDetail(); };
  });
  const addFaq = document.getElementById("addFaq");
  if (addFaq) addFaq.onclick = () => { d.faq.push({ question: "", answer: "" }); (state.mitFaqOpen || (state.mitFaqOpen = new Set())).add(d.faq.length - 1); renderMitDetail(); };
  // Implementation cards
  document.querySelectorAll(".implementation-card").forEach(card => {
    const i = +card.dataset.idx;
    const ti = card.querySelector(".impl-title");
    const de = card.querySelector(".impl-description");
    const re = card.querySelector(".impl-reference");
    const cv = card.querySelector(".impl-coverage");
    const cvs = card.querySelector(".impl-covers");
    const ow = card.querySelector(".impl-owner");
    if (ti) ti.oninput = () => d.implementations[i].title = ti.value;
    if (de) de.oninput = () => d.implementations[i].description = de.value;
    if (re) re.oninput = () => d.implementations[i].reference = re.value;
    if (cv) cv.onchange = () => { d.implementations[i].coverage = cv.value; if (cv.value === "local") d.implementations[i].covers = ""; renderMitDetail(); };
    if (cvs) cvs.oninput = () => d.implementations[i].covers = cvs.value;
    if (ow) ow.oninput = () => d.implementations[i].owner = ow.value;
    const rm = card.querySelector(".impl-remove");
    if (rm) rm.onclick = e => { e.stopPropagation(); d.implementations.splice(i, 1); state.mitImplOpen = shiftOpenSet(state.mitImplOpen, i); renderMitDetail(); };
    const head = card.querySelector(".ecard-head");

  if (addImpl) addImpl.onclick = () => { d.implementations.push({ title: "", description: "", reference: "", coverage: "local", covers: "", owner: "" }); (state.mitImplOpen || (state.mitImplOpen = new Set())).add(d.implementations.length - 1); renderMitDetail(); };
}

// Map a failed PATCH/POST error path to its .field wrapper (no live validate endpoint).
function fieldElMit(path) {
  if (!path) return null;
  const parts = path.split(".");
  if ((parts[0] === "validation" || parts[0] === "faq") && parts.length === 3) {
    return document.querySelector(`.${parts[0]}-card[data-idx="${CSS.escape(parts[1])}"] .field[data-field="${CSS.escape(parts[2])}"]`)
      || document.querySelector(`.field[data-entity="mitigation"][data-field="${CSS.escape(parts[0])}"]`);
  }
  if (parts[0] === "implementations" && parts.length === 3) {
    return document.querySelector(`.implementation-card[data-idx="${CSS.escape(parts[1])}"] .field[data-field="${CSS.escape(parts[2])}"]`)
      || document.querySelector('.field[data-entity="implementation"]');
  }
  if (parts[0] === "anti_patterns") {
    return document.querySelector('.field[data-entity="mitigation"][data-field="anti_patterns"]');
  }
  if (parts.length === 1) {
    return document.querySelector(`.field[data-entity="mitigation"][data-field="${CSS.escape(parts[0])}"]`);
  }
  return null;
}
function renderMitErrorSummary(errors) {
  const el = document.getElementById("mitErrSummary");
  if (!el) return;
  if (!errors.length) { el.style.display = "none"; el.innerHTML = ""; return; }
  el.style.display = "block";
  el.innerHTML = `<strong>Fix these before saving:</strong><ul>${errors.map(e =>
    `<li>${e.field ? `<code>${esc(e.field)}</code> — ` : ""}${esc(e.msg)}</li>`).join("")}</ul>`;
}
// Same red channel the threat editor uses — mapped from the server's Pydantic errors.
function applyMitValidation() {
  const errors = (state.mitValidation && state.mitValidation.errors) || [];
  document.querySelectorAll("#main .fld-msg").forEach(e => e.remove());
  document.querySelectorAll("#main .field").forEach(f => f.classList.remove("has-err", "has-adv"));
  renderMitErrorSummary(errors);
  errors.forEach(item => {
    const el = fieldElMit(item.field);
    if (!el) return;
    el.classList.add("has-err");
    const msg = document.createElement("div");
    msg.className = "fld-msg err";
    msg.textContent = item.msg;
    el.appendChild(msg);
  });
  markCollapsedCards(errors);   // surface errors hidden inside collapsed cards
}

// Save: PATCH an existing mitigation, POST a new one. A failed request maps the
// server's Pydantic error response into the RED channel (dup id on create → 409).
async function saveMitigation() {
  const d = state.mitDraft;
  const isNew = !!d.isNew;
  const body = {
    name: d.name,
    status: d.status || null,
    mitigation_class: d.mitigation_class,
    purpose: d.purpose, scope: d.scope, control_mechanism: d.control_mechanism,
    failure_behavior: d.failure_behavior, formal_implementation_risk: d.formal_implementation_risk,
    review: d.review, maintainer: d.maintainer, locus: d.locus, telemetry: d.telemetry,
    anti_patterns: (d.anti_patterns || []).map(s => (s || "").trim()).filter(Boolean),
    validation: (d.validation || []).filter(v => (v.criterion || "").trim()).map(v => ({
      criterion: v.criterion, test_scenario: v.test_scenario || null, expected_result: v.expected_result || null,
    })),
    faq: (d.faq || []).filter(q => (q.question || "").trim() || (q.answer || "").trim())
      .map(q => ({ question: q.question, answer: q.answer })),
    implementations: (d.implementations || []).filter(im => (im.title || "").trim() || (im.description || "").trim())
      .map(im => ({
        title: im.title, description: im.description, reference: (im.reference || "").trim() || null,
        coverage: im.coverage || "local",
        covers: im.coverage === "shared" ? (im.covers || "").trim() || null : null,
        owner: (im.owner || "").trim() || null,
      })),
  };
  const url = isNew ? "/mitigations" : "/mitigations/" + encodeURIComponent(state.mitSelected);
  if (isNew) body.id = state.mitSelected;
  const r = await fetch(API + url, {
    method: isNew ? "POST" : "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const data = await r.json().catch(() => ({}));
    let errs;
    if (Array.isArray(data.detail)) {
      errs = data.detail.map(e => ({
        field: (e.loc || []).filter(x => x !== "body").join("."),
        msg: e.msg || "invalid",
      }));
    } else {
      errs = [{ field: "", msg: data.detail || ((isNew ? "POST " : "PATCH ") + url + " → " + r.status) }];
    }
    state.mitValidation = { errors: errs, advice: [] };
    applyMitValidation();
    toast("Save blocked — fix the errors", true);
    return;
  }
  state.currentMit = await j("/mitigations/" + encodeURIComponent(state.mitSelected));
  state.mitEditing = false; state.mitDraft = null;
  state.railMode = "preview"; state.guidance = null;
  await refreshMitList();
  state.mitValidation = { errors: [], advice: [] };
  renderMitRail(); renderMitFacets(); renderMitDetail(); renderMitPreview();
  showSavedDialog("catalog/mitigations/" + state.mitSelected + ".yaml");
}

// Left rail collapses to a thin strip (list/search/filters hidden, only the expand
// affordance visible); the right rail is drag-resizable on the main|preview seam.
// Both persist to localStorage and re-apply on load. No library.
const LS_RAIL = "keel.railCollapsed";
const LS_PREVIEW = "keel.previewW";
const PREVIEW_MIN = 280, PREVIEW_MAX = 640;

function initRailToggle() {
  const btn = document.getElementById("railToggle");
  const apply = on => {
    document.body.classList.toggle("rail-collapsed", on);
    if (btn) { btn.textContent = on ? "»" : "«"; btn.title = on ? "Expand" : "Collapse"; }
  };
  apply(localStorage.getItem(LS_RAIL) === "1");
  if (btn) btn.onclick = () => {
    const on = !document.body.classList.contains("rail-collapsed");
    localStorage.setItem(LS_RAIL, on ? "1" : "0");
    apply(on);
  };
}

function initPreviewResizer() {
  const setW = px => document.documentElement.style.setProperty("--preview-w", px + "px");
  const clamp = px => Math.max(PREVIEW_MIN, Math.min(PREVIEW_MAX, px));
  const saved = parseInt(localStorage.getItem(LS_PREVIEW), 10);
  if (saved >= PREVIEW_MIN && saved <= PREVIEW_MAX) setW(saved);
  const handle = document.getElementById("preview-resizer");
  if (!handle) return;
  handle.addEventListener("mousedown", e => {
    e.preventDefault();
    document.body.classList.add("resizing");
    let last = clamp(window.innerWidth - e.clientX);
    const move = ev => { last = clamp(window.innerWidth - ev.clientX); setW(last); };
    const up = () => {
      document.body.classList.remove("resizing");
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      localStorage.setItem(LS_PREVIEW, String(last));
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
}

initRailToggle();
initPreviewResizer();

// Land wherever the path points — the Overview when there is none. A pasted or edited
// URL re-routes in place; the app's own navigation uses replaceState, so popstate only
// fires for navigation that came from outside it.
window.addEventListener("popstate", applyRoute);
boot().then(applyRoute).catch(e =>
  document.getElementById("main").innerHTML = '<div class="empty">Load error: ' + esc(e.message) + '</div>');
