<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel · GenAI threat model</title>
<style>
  /* Design tokens — mirrors .claude/skills/keel-design-system/tokens/*.css.
     Inlined rather than linked: the app is one static file with zero external
     requests, which the design system states as a non-negotiable. Keep the two
     in step; author against the semantic aliases at the foot, not the raw ramps. */
  :root {
    /* type */
    --font-sans: -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", monospace;
    --fs-10: 10px; --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-14: 14px;
    --fs-15: 15px; --fs-19: 19px; --fs-20: 20px; --fs-24: 24px; --fs-28: 28px;
    /* Five line heights, and the stylesheet references these rather than numbers, the
       same way it references --fs-*. Before this the app used eight values (1, 1.1,
       1.35, 1.4, 1.5, 1.55, 1.6, 1.65) and declared a ninth nobody used: a ramp that
       exists only in :root is not a ramp, it is a suggestion. */
    --lh-1: 1;              /* a control whose box sets its own height */
    --lh-tight: 1.35;       /* headings, row titles, one-line labels */
    --lh-base: 1.55;        /* UI text */
    --lh-prose: 1.65;       /* running text meant to be read */
    --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
    --ls-title: -.01em; --ls-number: -.02em; --ls-eyebrow: .08em; --ls-key: .06em; --ls-meta: .05em;
    --numeric: tabular-nums;
    /* colour ramps */
    --navy-900: #17203a; --navy-800: #232d4a; --navy-700: #38415f; --navy-600: #4a5570;
    /* navy-500 darkened from #6b7690: at the old value the quiet text tier measured
       4.20:1 on the app background and 4.28:1 on the section tint, so most of the meta,
       hints and provenance lines in the app failed WCAG AA. #636e88 clears 4.5:1 on all
       four surfaces (app, tint, panel, navy-100) and is visually the same grey-blue. */
    --navy-500: #636e88; --navy-400: #97a0b5; --navy-200: #d7dce8; --navy-100: #eef1f7;
    --crimson-700: #b81f42; --crimson-600: #d6294e; --crimson-200: #f6c9d3; --crimson-50: #fdeef1;
    --amber: #e0a021; --amber-50: #fdf3e0; --amber-700: #8f6410;
    /* --green-700 is the text-only step, the same arrangement --amber-700 already had:
       --green on green-50 measures 3.10:1. Green stays a fill on dots and bar segments. */
    --green: #1f9d57; --green-50: #eaf4ee; --green-200: #bfe3cd; --green-700: #136c3a;
    /* Three surfaces, and they have to be TELLABLE APART. The page used to be #f4f6fb
       against a #f6f8fc band: a luminance ratio of 1.017, which is no difference at all
       — every band read as text floating on the page with a hairline somewhere near it.
       Dropping the page to navy-100 makes the two steps even (1.064 page→band, 1.063
       band→card) and ascending, so lighter reads as nearer, the way it should. This
       diverges from the design kit's --surface-app; the kit's own value is the bug. */
    --bg: var(--navy-100); --panel: #ffffff; --tint: #f6f8fc; --white: #ffffff;
    --border: #dfe3ec; --border2: #eef1f7;
    /* diff palette — deliberately GitHub's, not Keel's, so a reviewer reads it instantly */
    --diff-add-bg: #e6ffec; --diff-add-gutter: #cdffd8; --diff-add-gutter-fg: #2b7d47; --diff-add-fg: #17683a;
    --diff-del-bg: #ffeef0; --diff-del-gutter: #ffdce0; --diff-del-gutter-fg: #b0374f; --diff-del-fg: #9e1c3a;
    --diff-hunk-bg: #eef1f7;
    /* one spacing scale (multiples of 4/8) */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
    --field-gap: 24px; --section-gap: 44px; --input-h: 38px;
    --pad-rail-row: 10px 15px; --pad-main: 30px 40px;
    /* ---- block rhythm — change how the app breathes HERE, not in 40 rules ----
       These encode one rule: the space ABOVE a heading is larger than the space below
       it, so a heading binds to its own content instead of floating between two things.
       Keep --gap-label smaller than the top of --pad-section, or that inverts. */
    /* Split so the horizontal half can be reused in a calc. A shorthand cannot: the
       whole declaration is dropped as invalid, silently, and the band goes back to
       running the width of the display. */
    --pad-section-x: 18px;
    --pad-section: 16px var(--pad-section-x);   /* inside a band: .readsec, an editor fieldset, .ov-col */
    --pad-card: 15px 17px;      /* inside a card sitting on a band */
    --gap-band: 16px;           /* between bands */
    --gap-card: 10px;           /* between cards inside a band */
    --gap-label: 9px;           /* a heading -> its own content */
    --gap-hint: 9px;            /* a one-line hint -> the control it describes */
    /* radii */
    --r-4: 4px; --r-5: 5px; --r-6: 6px; --r-8: 8px; --r-9: 9px; --r-10: 10px; --r-pill: 20px; --r-round: 50%;
    /* elevation — only genuinely floating layers cast a shadow */
    --shadow-toast: 0 8px 24px rgba(20, 30, 60, .2);
    --shadow-dialog: 0 10px 30px rgba(20, 30, 60, .18);
    --focus-ring: 0 0 0 3px var(--crimson-50);
    --selected-rail-accent: inset 3px 0 0 var(--crimson-600);
    /* motion — browser default easing throughout, no custom curves */
    --dur-hover: .12s; --dur-layer: .2s; --ease: ease; --toast-rise: 8px;
    /* grid track widths — driven by the rail collapse toggle + the preview resizer */
    --rail-w: 320px; --rail-w-collapsed: 44px; --preview-w: 360px; --resizer-w: 9px; --app-h: 100vh;
    --topbar-h: 46px;
    /* Prose measure. The editor pane is 1fr and goes very wide on a large display;
       14px running text at 1600px is unreadable. Body copy caps at a normal line. */
    --measure: 74ch;
    /* ---- semantic aliases ---- */
    --text-strong: var(--navy-900); --text-body: var(--navy-700); --text-body-read: var(--navy-800);
    /* navy-400 is NOT a text step — it measures 2.62:1 on white and cannot carry type
       on any Keel surface. It stays in the ramp for rules, dots and the low spine. */
    --text-muted: var(--navy-500); --text-faint: var(--navy-500); --text-inverse: #ffffff;
    --text-link: var(--navy-800); --text-link-hover: var(--navy-900);
    --line-link: var(--navy-200); --line-link-hover: var(--navy-500);
    --surface-app: var(--bg); --surface-panel: var(--panel); --surface-section: var(--tint);
    --surface-card: var(--white); --surface-inset: var(--tint);
    --surface-selected: var(--crimson-50); --surface-hover: var(--navy-100);
    --line-panel: var(--border); --line-inner: var(--border2); --line-control: var(--navy-200);
    --line-focus: var(--crimson-600); --line-danger: var(--crimson-200);
    --accent: var(--crimson-600); --accent-hover: var(--crimson-700);
    --accent-wash: var(--crimson-50); --accent-line: var(--crimson-200);
    --status-error: var(--crimson-700); --status-error-bg: var(--crimson-50); --status-error-line: var(--crimson-200);
    --status-advice: var(--amber); --status-advice-bg: var(--amber-50);
    --status-ok: var(--green); --status-ok-bg: var(--green-50); --status-ok-line: var(--green-200);
    --status-ok-fg: var(--green-700);
    /* Severity escalates by weight, not hue — only the top band takes a solid fill.
       THREE bands, not the design system's four: an organisation's risk policy is
       written against three, and a fourth level only ever meant "high, but really".
       See keel/schemas/report.py, which is the scale these mirror. Low is navy, never
       green: green means covered/closed, a different axis — a low finding is still open. */
    --sev-high-bg: var(--crimson-700); --sev-high-fg: #ffffff;
    --sev-high-line: var(--crimson-700); --sev-high-spine: var(--crimson-700);
    --sev-medium-bg: var(--amber-50); --sev-medium-fg: var(--amber-700);
    --sev-medium-line: #f0dcb0; --sev-medium-spine: var(--amber);
    --sev-low-bg: var(--navy-100); --sev-low-fg: var(--navy-600);
    --sev-low-line: var(--border); --sev-low-spine: var(--navy-400);
    /* classification is neutral — harm/surface/source are facts about a finding, not grades of it */
    --classify-bg: var(--navy-200); --classify-fg: var(--navy-700);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--navy-900);
    font: var(--fs-14)/var(--lh-base) var(--font-sans);
    display: grid; grid-template-columns: var(--rail-w) 1fr var(--preview-w);
    grid-template-rows: var(--topbar-h) 1fr; height: 100vh;
  }
  body.resizing { cursor: col-resize; user-select: none; }
  /* Form controls do not inherit type from the page by default, so any control without
     an explicit size fell through to the browser's 13.333px — a value not on the ramp
     and not reachable from it. Inherit, and let the component rules override. */
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; }

  /* ------ top bar ------ */
  /* Primary navigation belongs to the app, not to the 320px rail. Five text tabs
     stretched across the rail read as a cramped segmented control, and they pushed the
     rail's own title, count and ＋New into a second squeezed row directly beneath.
     Up here the tabs sit at their natural width and the rail serves only its list. */
  .topbar { grid-column: 1 / -1; display: flex; align-items: stretch;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  .topbar .brand { display: flex; align-items: center; padding: 0 20px;
    font-size: var(--fs-15); font-weight: 700; letter-spacing: -.01em; color: var(--navy-900); }

  /* ------ left rail ------ */
  /* Columns are pinned rather than auto-placed: a pane that hides itself (the rail on
     the Overview, the preview everywhere but Style guide and Reports) would otherwise
     pull every pane after it one column to the left. */
  aside { grid-column: 1; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  main { grid-column: 2; }
  #preview { grid-column: 3; }
  header {
    padding: 10px 15px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  /* The tab above already names the screen; this names the LIST — "Systems" under the
     Reports tab, "Fields" under Style guide — so it is an eyebrow, not a second title. */
  header h1 { font-size: var(--fs-10); margin: 0; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--navy-500); }
  header .count { color: var(--navy-500); font-size: var(--fs-12); margin-left: auto; font-variant-numeric: tabular-nums; }
  .rail-toggle { border: none; background: none; color: var(--navy-500); font-size: var(--fs-15); line-height: var(--lh-1); padding: 3px 6px; border-radius: 6px; flex-shrink: 0; }
  .rail-toggle:hover { background: var(--navy-100); color: var(--navy-800); }
  /* Collapsed left rail — a 44px strip that opens on hover and slides back when the
     pointer leaves. Clicking to peek at a list you are about to click again is two
     actions for one intent, so hover does it; the toggle now means "keep it open".
     The rail leaves the flow (position: fixed) while collapsed, so opening it floats
     OVER the content instead of shoving the whole page sideways under the cursor. */
  body.rail-collapsed { --rail-w: 44px; }
  body.rail-collapsed aside {
    position: fixed; top: var(--topbar-h); bottom: 0; left: 0; z-index: 30;
    width: var(--rail-w-collapsed); overflow: hidden;
    transition: width var(--dur-layer) var(--ease), box-shadow var(--dur-layer) var(--ease);
  }
  body.rail-collapsed aside:hover { width: 320px; box-shadow: var(--shadow-dialog); }
  /* Faded rather than display:none — a hidden child cannot animate back into view, and
     at 44px the aside clips them anyway. */
  body.rail-collapsed .search,
  body.rail-collapsed .facets,
  body.rail-collapsed .list,
  body.rail-collapsed header h1,
  body.rail-collapsed header .count,
  body.rail-collapsed #newThreatBtn {
    opacity: 0; pointer-events: none; transition: opacity var(--dur-hover) var(--ease);
  }
  body.rail-collapsed aside:hover .search,
  body.rail-collapsed aside:hover .facets,
  body.rail-collapsed aside:hover .list,
  body.rail-collapsed aside:hover header h1,
  body.rail-collapsed aside:hover header .count,
  body.rail-collapsed aside:hover #newThreatBtn { opacity: 1; pointer-events: auto; }
  body.rail-collapsed header { padding: 10px 12px; }
  /* The Overview has no list to rail. It used to hold one static paragraph explaining
     the screen you were already looking at, so the dashboard now takes the full width —
     which is also what lets its two columns stay short enough to read without scrolling.
     Declared AFTER .rail-collapsed: both set --rail-w, and this one must win. */
  body.no-rail { --rail-w: 0px; }
  body.no-rail aside { display: none; }
  .search { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .search input {
    width: 100%; padding: 9px 11px; background: var(--tint); color: var(--navy-900);
    border: 1px solid var(--border); border-radius: 9px; outline: none; font-size: var(--fs-13);
  }
  .search input:focus { border-color: var(--line-focus); background: var(--surface-card); }
  /* ------ faceted filter panel (Threats + Mitigations rails) ------ */
  /* A collapsed "Filters (N)" expander under the search; open it for grouped,
     multi-select chip facets. Fits a ~320px rail — chips wrap, panel scrolls if tall. */
  .facets { border-bottom: 1px solid var(--border); }
  .facets-bar { display: flex; align-items: center; gap: 7px; padding: 8px 14px; cursor: pointer; user-select: none; }
  .facets-bar:hover { background: var(--navy-100); }
  .fx-caret { color: var(--navy-500); font-size: var(--fs-10); width: 10px; flex-shrink: 0; }
  .fx-label { font-size: var(--fs-12); font-weight: 600; color: var(--navy-700); }
  .fx-badge { font-size: var(--fs-10); font-weight: 700; padding: 1px 7px; border-radius: 10px;
    background: var(--accent); color: var(--text-inverse); font-variant-numeric: var(--numeric); }
  .fx-clear { margin-left: auto; border: none; background: none; color: var(--navy-500);
    font-size: var(--fs-11); font-weight: 600; padding: 2px 4px; border-radius: 6px; }
  .fx-clear:hover { color: var(--crimson-700); text-decoration: underline; }
  .facets-body { display: none; padding: 2px 14px 10px; max-height: 46vh; overflow-y: auto; }
  .facets.open .facets-body { display: block; }
  .fx-group { margin-top: 9px; }
  .fx-group:first-child { margin-top: 4px; }
  .fx-gk { font-size: var(--fs-10); text-transform: uppercase; letter-spacing: .06em; color: var(--navy-500);
    font-weight: 700; margin: 0 0 5px; }
  .fx-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .fx-chip { font-size: var(--fs-11); padding: 2px 9px; border-radius: 20px; background: var(--tint);
    color: var(--navy-600); border: 1px solid var(--border); font-weight: 500; white-space: nowrap; }
  .fx-chip:hover { border-color: var(--crimson-200); color: var(--crimson-700); }
  .fx-chip.on { background: var(--accent); color: var(--text-inverse); border-color: var(--accent); }
  .fx-chip.on:hover { background: var(--accent-hover); color: var(--text-inverse); }
  .list { overflow-y: auto; flex: 1; min-height: 0; }
  /* Scannable rows: title is the primary line, id a readable mono secondary. */
  .row { padding: 10px 15px; border-bottom: 1px solid var(--border2); display: flex; flex-direction: column; gap: 2px; }
  .row:hover { background: var(--navy-100); }
  .row.active { background: var(--surface-selected); box-shadow: var(--selected-rail-accent); }
  .row.active:hover { background: var(--crimson-50); }
  .row .rid { font-size: var(--fs-11); color: var(--navy-500); font-family: ui-monospace, "SFMono-Regular", monospace; letter-spacing: .01em; }
  .row .rtitle { font-size: var(--fs-14); color: var(--navy-900); font-weight: 500; line-height: var(--lh-tight); }

  /* ------ badges ------ */
  .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  /* 11px, not 10 — a badge carries a real word (a harm class, a link strength) that a
     reader has to take in, and at 10px those were the smallest type on a laptop screen. */
  .badge { font-size: var(--fs-11); padding: 2px 8px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .badge.soft { background: var(--navy-100); color: var(--navy-600); font-weight: 500; border-radius: 10px; }
  .badge.type { background: var(--navy-200); color: var(--navy-700); }
  /* Classification is neutral. harm/surface/source/mitigation_class are facts ABOUT an
     entry, not grades OF it — a crimson fill here made every rail row shout and left
     nothing louder for the accent to mean. */
  .badge.harm { background: var(--classify-bg); color: var(--classify-fg); }
  .badge.tag { background: var(--status-ok-bg); color: var(--status-ok-fg); }
  .badge.shared { background: var(--status-ok-bg); color: var(--status-ok-fg); margin-left: 6px; }

  /* ------ center editor ------ */
  main { overflow-y: auto; padding: 30px 40px; min-width: 0; }
  .empty { color: var(--navy-500); margin-top: 22vh; text-align: center; }
  .detail { max-width: none; }

  /* ------ editor section tiers (fieldset/legend) ------ */
  /* SECTION = fieldset + legend. The top-level edit sections wear the SAME surface as
     the read view's .readsec (tint fill, hairline border, radius, padding, spacing) so
     toggling Edit ↔ read keeps the block framing and the eye doesn't lose its place. */
  /* Identical to .readsec, so toggling Edit ↔ read keeps the block framing. */
  .detail fieldset {
    background: var(--tint); border: 1px solid var(--line-inner); border-radius: var(--r-10);
    padding: var(--pad-section); margin: var(--gap-band) 0 0; min-width: 0;
  }
  /* A <legend> is laid out on the fieldset's border and ignores its padding-top, so the
     heading sat flush against the top edge with 22px of air under it — attached to
     nothing above and adrift from its own content. It carries the inset itself. */
  .detail fieldset > legend.slabel { padding-top: 16px; margin-bottom: 4px; }
  /* The legend is the same tier as the read view's section header — see h3.slabel. */
  .detail fieldset > legend.slabel { display: block; width: 100%; float: none; padding: 0; }
  .ecard .field + .field { margin-top: var(--field-gap); }
  input.f, select.f { min-height: var(--input-h); }
  .dhead { display: flex; align-items: flex-start; gap: 14px; padding-bottom: 20px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  /* Navy, not the accent. Every entity header carries one of these; in crimson there was
     a solid accent block on every single screen, which is the one fill the severity ramp
     needs to keep for its top band. The Overview already overrode it to navy inline. */
  .dicon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; color: var(--text-inverse); flex-shrink: 0; font-size: var(--fs-19);
    font-weight: 700; background: var(--navy-700); }
  .dhead .dtitle { flex: 1; min-width: 0; }
  .dhead h2 { margin: 0; font-size: var(--fs-20); font-weight: 700; letter-spacing: -.01em; }
  .dhead .did { font-family: ui-monospace, monospace; color: var(--navy-500); font-size: var(--fs-12); margin-top: 4px; }
  /* .did is for an identifier. A screen whose subtitle is a sentence uses this instead —
     a wrapped sentence set in the mono face reads as code the reader has to decode. */
  .dhead .dsub { color: var(--navy-500); font-size: var(--fs-13); margin-top: 5px; line-height: var(--lh-base); max-width: var(--measure); }
  .dhead .hbadges { margin-top: 8px; }
  .hactions { display: flex; gap: 8px; flex-shrink: 0; }
  section { margin-top: 28px; }

  /* ------ heading tiers ------
     20 / 700   entity title (.dhead h2)
     15 / 600   SECTION heading — h3.slabel and the editor's fieldset legend
     14 / 500-600  card and row titles
     14 / 400   body prose
     12 / 400   meta, hints, counts
     10 / 700   eyebrow, uppercase

     The section heading used to BE the eyebrow: 11px uppercase under 14px prose, so
     every heading sat a step below the text it introduced and the page had no
     hierarchy to read by. The eyebrow is now reserved for labels that name a single
     field or group — facet keys, sub-labels inside a repeatable card, the rail list. */
  h3.slabel, .detail fieldset > legend.slabel {
    font-size: var(--fs-15); font-weight: 600; text-transform: none; letter-spacing: -.01em;
    color: var(--navy-900); margin: 0 0 var(--gap-label);
  }
  .slabel .sub { font-size: var(--fs-13); font-weight: 400; text-transform: none;
    color: var(--navy-500); letter-spacing: 0; }
  /* Inside a repeatable card a label names one field, not a section — eyebrow tier. */
  .ecard h3.slabel, .ecard .field > .slabel, .ecard .field > legend.slabel {
    font-size: var(--fs-10); font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--navy-500); margin: 0 0 5px; border: 0; padding: 0;
  }
  /* Markdown output supplies its own blocks, so the pre-wrap that made raw newlines
     visible would now add a blank line after every one of them. */
  .prose > p { margin: 0 0 var(--gap-hint); }
  .prose > p:last-child { margin-bottom: 0; }
  .prose ul.md, .prose ol.md { margin: 0 0 var(--gap-hint); padding-left: 20px; }
  .prose ul.md li, .prose ol.md li { margin-bottom: 4px; }
  .prose code { font-family: var(--font-mono); font-size: var(--fs-12);
    background: var(--navy-100); border-radius: var(--r-4); padding: 1px 4px; }
  .prose a { color: var(--text-link); text-decoration: underline;
    text-decoration-color: var(--line-link); text-underline-offset: 2px; }
  /* A table is the readable form of a set of yes/no tests, which is what a control's
     applicability actually is. Hairlines only, like every other surface here. */
  table.md { border-collapse: collapse; margin: 0 0 var(--gap-hint); width: 100%;
    max-width: none; font-size: var(--fs-13); }
  table.md th, table.md td { border: 1px solid var(--line-inner); padding: 6px 10px;
    text-align: left; vertical-align: top; line-height: var(--lh-base); }
  table.md th { background: var(--surface-card); font-weight: 600; color: var(--navy-900);
    font-size: var(--fs-12); }
  table.md td { color: var(--navy-800); }
  .prose:has(table.md) { max-width: none; }

  .prose { color: var(--navy-700); font-size: var(--fs-14); line-height: var(--lh-prose); max-width: var(--measure); }
  .warn { background: var(--crimson-50); border: 1px solid var(--crimson-200); color: var(--crimson-700); border-radius: 8px; padding: 9px 12px; font-size: var(--fs-13); }
  .placeholder { color: var(--navy-500); font-style: italic; }
  .card { border: 1px solid var(--line-panel); border-radius: var(--r-10); padding: var(--pad-card);
    margin-bottom: var(--gap-card); background: var(--surface-card); }
  .card .chead { display: flex; align-items: center; gap: 8px; }
  .card .cid { font-family: ui-monospace, monospace; font-size: var(--fs-11); color: var(--navy-500); }
  .card .ctitle { font-weight: 600; color: var(--navy-900); font-size: var(--fs-14); }
  .card .rationale { margin-top: 8px; color: var(--navy-500); font-size: var(--fs-13); font-style: italic;
    white-space: pre-wrap; line-height: var(--lh-prose); max-width: var(--measure); }
  /* A card's body copy is body copy — it was 13px, half a step under the surrounding
     prose for no reason, which is most of why the screens read as inconsistent. */
  .card .cdesc { margin-top: 8px; color: var(--navy-700); font-size: var(--fs-14); line-height: var(--lh-prose);
    white-space: pre-wrap; max-width: var(--measure); }
  ul.plain { margin: 6px 0 0; padding-left: 0; list-style: none; }
  ul.plain li { border-left: 2px solid var(--navy-200); padding: 3px 0 3px 10px; margin-bottom: 7px; color: var(--navy-700); }
  ul.plain li .meta { font-size: var(--fs-11); color: var(--navy-500); text-transform: uppercase; letter-spacing: .05em; }
  /* A reference is a title, a note saying what it supports, and a link to go check.
     Setting the title and the URL both in full body weight made every entry read as two
     headings, and buried the note - which is the part that says why the entry is here. */
  .ref-title { display: block; font-size: var(--fs-14); color: var(--navy-900); }
  .ref-note { display: block; font-size: var(--fs-13); color: var(--navy-700);
    line-height: var(--lh-base); margin-top: 2px; max-width: var(--measure); }
  .ref-url { display: block; margin-top: 3px; font-size: var(--fs-12); color: var(--navy-500);
    text-decoration: underline; text-decoration-color: var(--line-link);
    text-underline-offset: 2px; word-break: break-all; }
  .ref-url:hover { color: var(--text-link-hover); text-decoration-color: var(--line-link-hover); }

  /* ------ read view (per-section surfaces, breadcrumb, omit-empty) ------ */
  /* A read/document view, so each populated section sits on its own subtle surface,
     unlike the edit form (whose only heavy container is the repeatable-card border). */
  /* A band that runs to the edge of a wide display while its text stops at 74ch leaves
     the reader with a long empty right half and no way to tell whether anything is
     there. The band follows the measure it was already keeping. */
  .readsec { background: var(--tint); border: 1px solid var(--line-inner); border-radius: var(--r-10);
    padding: var(--pad-section); margin-top: var(--gap-band);
    max-width: calc(var(--measure) + 2 * var(--pad-section-x)); }
  /* Tables and repeatable cards carry their own columns and are allowed the full pane. */
  .readsec:has(table.md), .readsec:has(.ecard), .readsec:has(.hbars) { max-width: none; }
  .readsec .prose { color: var(--navy-800); }
  .readsec .card { background: var(--surface-card); }
  .notauthored { color: var(--navy-500); font-size: var(--fs-12); font-style: italic; margin: 16px 0 0; }
  /* ------ gaps bar (read view) — empty fields as clickable, jump-to-edit chips ------ */
  .gaps-bar { margin-top: var(--section-gap); border-top: 1px dashed var(--border); padding-top: 14px; }
  .gaps-k { display: block; font-size: var(--fs-11); text-transform: uppercase; letter-spacing: .07em;
    color: var(--navy-500); font-weight: 700; margin: 0 0 9px; }
  .gaps-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .gap-chip { font-size: var(--fs-12); padding: 4px 11px; border-radius: 20px; background: var(--navy-100);
    color: var(--navy-600); border: 1px solid var(--border); font-weight: 500; }
  .gap-chip:hover { background: var(--crimson-50); color: var(--crimson-700); border-color: var(--crimson-200); }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: var(--fs-12); color: var(--navy-500); margin-bottom: 12px; }
  .crumb-type { border: none; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--navy-500); }
  .crumb-type:hover { color: var(--text-link-hover); text-decoration: underline; }
  .crumb-sep { color: var(--navy-500); }
  .crumb-id { font-family: ui-monospace, "SFMono-Regular", monospace; color: var(--navy-500); }
  /* A card that jumps to a linked entity on click. */
  .card.jrow { cursor: pointer; transition: background .12s, border-color .12s; }
  .card.jrow:hover { background: var(--crimson-50); border-color: var(--crimson-200); }

  /* ------ read-view Git history (read-only) ------ */
  /* A quiet provenance line under the breadcrumb, plus a collapsed History .readsec
     at the foot of the read view: commit rows that expand an inline diff (accordion). */
  .last-changed { font-size: var(--fs-12); color: var(--navy-500); margin: -4px 0 12px; }
  .history-sec .history-head { display: flex; align-items: center; gap: 6px; margin: 0; cursor: pointer; user-select: none; }
  .history-sec .history-head:hover { color: var(--crimson-700); }
  .history-sec .history-head .fx-caret { color: var(--navy-500); font-size: var(--fs-10); width: 10px; flex-shrink: 0; }
  .history-list { margin-top: 2px; }
  /* commit list — GitHub-style: message is the primary line, a muted submeta row below */
  .commit { border-top: 1px solid var(--border2); }
  .commit:first-child { border-top: none; }
  .commit-row { padding: 9px 8px; border-radius: 6px; cursor: pointer; }
  .commit-row:hover { background: var(--navy-100); }
  .commit.open > .commit-row { background: var(--navy-100); }
  .commit-msg { font-size: var(--fs-13); color: var(--navy-900); font-weight: 500; line-height: var(--lh-tight);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit-meta { font-size: var(--fs-11); color: var(--navy-500); margin-top: 3px;
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .commit-meta .sep { color: var(--navy-200); }
  .commit-sha { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: var(--fs-10);
    background: var(--navy-100); color: var(--navy-600); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 5px; letter-spacing: .01em; }
  .commit-diff { margin: 4px 2px 10px; }

  /* ------ unified Git diff (native GitHub look: line-number gutters + full-row tints) ------ */
  /* Parsed from the unified-diff text into rows: two gutters (old #, new #) driven by the
     @@ hunk headers, a content cell that keeps the +/-/space sign and preserves whitespace,
     and a horizontally-scrolling body for long lines. File-header noise is folded into one
     tiny caption; hunk headers render as a muted separator row that resets the counters. */
  .diffwrap { border: 1px solid var(--line-panel); border-radius: var(--r-8); overflow: hidden; background: var(--surface-card); }
  .diff-cap { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: var(--fs-11); color: var(--navy-500);
    padding: 6px 12px; background: var(--tint); border-bottom: 1px solid var(--border2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .diff-scroll { overflow-x: auto; }
  .difftbl { border-collapse: collapse; width: 100%; font-family: ui-monospace, "SFMono-Regular", monospace;
    font-size: var(--fs-12); line-height: var(--lh-base); }
  .difftbl td { padding: 0; vertical-align: top; }
  .difftbl .dg { width: 1%; min-width: 42px; text-align: right; padding: 0 10px;
    color: var(--navy-500); background: var(--tint); border-right: 1px solid var(--border2);
    user-select: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .difftbl .dc { padding: 0 10px; white-space: pre; color: var(--navy-800); }
  .dr-ctx .dc { color: var(--navy-700); }
  /* additions — light green row, greener gutter, green left accent */
  .dr-add { background: var(--diff-add-bg); }
  .dr-add .dg { background: var(--diff-add-gutter); color: var(--diff-add-gutter-fg); }
  .dr-add .dg-o { border-left: 2px solid var(--status-ok); }
  .dr-add .dc { color: var(--diff-add-fg); }
  /* deletions — light red row, redder gutter, crimson left accent */
  .dr-del { background: var(--diff-del-bg); }
  .dr-del .dg { background: var(--diff-del-gutter); color: var(--diff-del-gutter-fg); }
  .dr-del .dg-o { border-left: 2px solid var(--accent); }
  .dr-del .dc { color: var(--diff-del-fg); }
  /* hunk header — a muted separator row spanning the width, resets the counters */
  .dr-hunk td { background: var(--diff-hunk-bg); }
  .dr-hunk .dg { color: var(--navy-500); border-right-color: var(--border); }
  .dr-hunk .dc { color: var(--navy-500); }
  .dr-meta .dc { color: var(--navy-500); }
  .diff-loading { padding: 10px 12px; background: var(--surface-card); border: 1px solid var(--line-panel);
    border-radius: 8px; font-family: ui-monospace, "SFMono-Regular", monospace; font-size: var(--fs-12);
    color: var(--navy-500); font-style: italic; }

  /* ------ buttons ------ */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 8px; font-size: var(--fs-13); font-weight: 600; border: 1px solid transparent; background: none; }
  .btn.primary { background: var(--accent); color: var(--text-inverse); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.primary:disabled { opacity: .5; }
  .btn.ghost { background: var(--surface-hover); color: var(--text-body); }
  .btn.ghost:hover { background: var(--navy-200); }
  .btn.sm { padding: 4px 9px; font-size: var(--fs-12); }

  /* ------ inputs ------ */
  input.f, textarea.f, select.f {
    width: 100%; border: 1px solid var(--navy-200); border-radius: 8px; padding: 8px 10px;
    font: inherit; font-size: var(--fs-14); color: var(--text-strong); background: var(--surface-card); outline: none;
  }
  input.f:focus, textarea.f:focus, select.f:focus { border-color: var(--line-focus); box-shadow: var(--focus-ring); }
  textarea.f { resize: vertical; line-height: var(--lh-base); }
  .titlein { font-size: var(--fs-19); font-weight: 700; }
  .checkset { display: flex; flex-wrap: wrap; gap: 8px; }
  .checkset label {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
    border: 1px solid var(--line-control); border-radius: var(--r-8); font-size: var(--fs-13); cursor: pointer; background: var(--surface-card);
  }
  .checkset label:hover { border-color: var(--crimson-200); }
  .checkset input { accent-color: var(--crimson-600); }
  .hint { color: var(--navy-500); font-size: var(--fs-12); margin-top: 4px; }

  /* ------ repeatable editor cards (weaknesses, mitigation links) ------ */
  /* The card border is the ONLY heavy container: surface fill + border + radius + padding. */
  .ecard { position: relative; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--tint); }
  .ecard-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; user-select: none; }
  .ecard.collapsed .ecard-head { padding: 9px 12px; }
  .ecard-body { padding: 14px 14px 16px; }
  .ecard-sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-13); color: var(--navy-700); font-weight: 600; font-family: ui-monospace, "SFMono-Regular", monospace; }
  .card-toggle { border: none; background: none; color: var(--navy-500); font-size: var(--fs-11); line-height: var(--lh-1); padding: 2px 3px; }
  .card-toggle:hover { color: var(--navy-800); }
  .ecard .field + .field { margin-top: var(--field-gap); }
  .cardx { border: none; background: none; color: var(--navy-500); font-size: var(--fs-15); line-height: var(--lh-1); padding: 2px 6px; border-radius: 6px; }
  .cardx:hover { background: var(--crimson-50); color: var(--crimson-600); }
  .link-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .link-row select { flex: 1; }

  /* ------ inline style-guide bar ------ */
  .field { position: relative; }
  /* one muted ~12px single-line hint under each label; row height reserved so fields align */
  /* The hint belongs to the label, not to the input: tight above, roomy below, so the
     two read as one unit and the control below is clearly the thing they describe. */
  .sg-hint { color: var(--navy-500); font-size: var(--fs-12); line-height: var(--lh-tight); margin: 0 0 var(--gap-hint); min-height: 17px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sg-panel { display: none; margin-top: 8px; padding: 10px 12px; background: var(--surface-card); border: 1px solid var(--line-control); border-radius: var(--r-8); font-size: var(--fs-12); }
  .sg-panel.show { display: block; }
  .sg-sec { margin-bottom: 8px; }
  .sg-sec:last-child { margin-bottom: 0; }
  .sg-k { display: block; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: var(--fs-10); color: var(--navy-600); margin-bottom: 3px; }
  .sg-panel ul { margin: 0; padding-left: 16px; color: var(--navy-600); }
  .sg-panel ul li { margin-bottom: 2px; }
  .sg-ex { color: var(--navy-700); font-style: italic; margin: 0 0 5px; }
  /* inline per-field guidance — a compact <details> that replaces the old rail mode */
  /* Guidance opens on hover, with no click and no jump. It PUSHES rather than covers:
     a popover floating over a form field hides the very thing the guidance is about.
     The height animates (grid 0fr → 1fr, which needs no known height), so the page
     settles instead of snapping. :focus-within keeps it reachable from the keyboard. */
  .fguide { margin-top: 8px; }
  .fguide-k { display: inline-flex; align-items: center; gap: 5px; padding: 2px 0;
    font-size: var(--fs-11); font-weight: 600; color: var(--navy-500); user-select: none; }
  .fguide-k::before { content: "\24D8"; color: var(--navy-500); font-size: var(--fs-13); }
  .fguide:hover .fguide-k, .fguide:focus-within .fguide-k { color: var(--navy-700); }
  .fguide-wrap { display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows var(--dur-layer) var(--ease); }
  .fguide-inner { overflow: hidden; min-height: 0; }
  .fguide:hover .fguide-wrap, .fguide:focus-within .fguide-wrap { grid-template-rows: 1fr; }
  .fguide .sg-panel { display: block; margin-top: 6px; }
  /* "view change" affordance on the read-view provenance line — reveals the latest diff inline */
  .lc-diff { border: none; background: none; color: var(--text-link); font-weight: 600; font-size: var(--fs-12);
    padding: 0 0 0 4px; cursor: pointer;
    text-decoration: underline; text-decoration-color: var(--line-link); text-underline-offset: 2px; }
  .lc-diff:hover { color: var(--text-link-hover); text-decoration-color: var(--line-link-hover); }

  /* ------ coverage ------ */
  /* None of the three states is an error, so none of them is crimson. Covered is the
     pass green, a gap is the amber advice colour because it is work not yet done, and a
     decline is navy: it is a decision, and decisions are structure. */
  .badge.cov-yes { background: var(--green-50); color: var(--green-700); border-color: var(--green-200); }
  .badge.cov-no { background: var(--navy-100); color: var(--navy-700); border-color: var(--border); }
  .badge.cov-gap { background: var(--amber-50); color: var(--amber-700); border-color: var(--sev-medium-line); }
  .cov-rail-bar { margin: 6px 0 2px; height: 6px; }
  .hbar-f.cov-seg-no { background: var(--navy-400); }
  .cov-lede { font-size: var(--fs-14); line-height: var(--lh-prose); color: var(--navy-700);
    max-width: var(--measure); margin: 0 0 var(--gap-band); }
  .cov-group { margin-bottom: var(--gap-band); }
  .cov-group > .slabel { margin-bottom: var(--gap-label); }
  .cov-row { display: grid; grid-template-columns: minmax(90px, auto) 1fr auto; gap: 2px 12px;
    align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border2); }
  .cov-row:first-of-type { border-top: none; padding-top: 0; }
  .cov-ref { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--navy-500); }
  .cov-title { font-size: var(--fs-14); color: var(--navy-900); }
  .cov-ids, .cov-note { grid-column: 2 / -1; margin: 2px 0 0; font-size: var(--fs-13);
    line-height: var(--lh-base); color: var(--navy-600); max-width: var(--measure); }
  /* The reasoning on a row is the most valuable text on this screen: it is what turns
     "they missed it" into "they considered it, and here is where the line falls". */
  .cov-note { color: var(--navy-700); }

  .cites { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
    margin: 6px 0 0; font-size: var(--fs-12); }
  .cites .k { font-size: var(--fs-10); font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--navy-500); }
  a.cite { font-family: var(--font-mono); color: var(--text-link);
    text-decoration: underline; text-decoration-color: var(--line-link);
    text-underline-offset: 2px; }
  a.cite:hover { color: var(--text-link-hover); text-decoration-color: var(--line-link-hover); }
  .cite-none { color: var(--navy-500); }
  /* A decision leads with its value; the reasoning follows as ordinary prose. */
  .decision { margin: 0 0 var(--gap-hint); }
  .decision .dv { font-size: var(--fs-15); font-weight: 600; color: var(--navy-900); }
  .maintainer { font-size: var(--fs-11); color: var(--navy-500); }
  /* One line per tier instead of three type sizes fighting on one row. */
  .linkhead { display: flex; align-items: center; gap: 8px; }
  .linktitle { font-size: var(--fs-14); color: var(--navy-900); margin-top: 2px; }
  .linkwhy { margin: 4px 0 0; font-size: var(--fs-13); line-height: var(--lh-base);
    color: var(--navy-700); max-width: var(--measure); }
  .fold > summary { cursor: pointer; font-size: var(--fs-13); color: var(--text-link);
    list-style: none; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before { content: "b8 "; color: var(--navy-500); }
  .fold[open] > summary::before { content: "be "; }
  .fold-body { margin-top: var(--gap-hint); }

  .cite-note { margin: 4px 0 0; font-size: var(--fs-13); line-height: var(--lh-base);
    color: var(--navy-600); max-width: var(--measure); }

  /* ------ right preview ------ */
  #preview { background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; }
  /* The right rail earns its column only on the Style-guide screen (the live author
     preview — a genuinely different artifact). Everywhere else it collapses: the third
     grid track goes to 0 and the rail + its resizer hide. Threats and mitigations read
     and edit on one surface, so there is no rail to duplicate the card. The user's saved
     --preview-w is kept on <html> and restored when the Style screen brings the rail back. */
  body.no-preview { --preview-w: 0px; }
  body.no-preview #preview, body.no-preview #preview-resizer { display: none; }
  /* draggable divider on the main|preview border; sits fixed over the seam */
  /* Starts below the top bar so the seam handle never overlays the tabs. */
  #preview-resizer { position: fixed; top: var(--topbar-h); height: calc(100vh - var(--topbar-h));
    width: 9px; right: var(--preview-w); margin-right: -4px; cursor: col-resize; z-index: 40; }
  #preview-resizer::after { content: ""; position: absolute; top: 0; left: 4px; width: 1px; height: 100%; background: transparent; transition: background .12s; }
  #preview-resizer:hover::after, body.resizing #preview-resizer::after { background: var(--crimson-600); left: 3px; width: 3px; }
  #preview .ptitle { font-size: var(--fs-11); text-transform: uppercase; letter-spacing: .08em; color: var(--navy-500); font-weight: 700; margin: 0 0 12px; }

  /* ------ toast ------ */
  .toast { position: fixed; bottom: 20px; right: 22px; background: var(--navy-900); color: var(--text-inverse); padding: 10px 16px; border-radius: var(--r-10); font-size: var(--fs-13); box-shadow: var(--shadow-toast); opacity: 0; transition: opacity .2s, transform .2s; transform: translateY(8px); pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: var(--crimson-700); }

  /* ------ validation channels ------ */
  .err-summary { background: var(--crimson-50); border: 1px solid var(--crimson-200); color: var(--crimson-700); border-radius: 8px; padding: 10px 14px; margin: 16px 0 4px; font-size: var(--fs-13); }
  .err-summary strong { display: block; margin-bottom: 5px; }
  .err-summary ul { margin: 0; padding-left: 18px; }
  .err-summary code { font-family: ui-monospace, monospace; font-size: var(--fs-12); }
  .fld-msg { font-size: var(--fs-12); margin-top: 5px; line-height: var(--lh-tight); }
  .fld-msg.err { color: var(--crimson-700); }
  /* --amber on a light surface fails contrast; --amber-700 is the text-only step.
     Amber stays a fill only on dots and bar segments, never on type. */
  .fld-msg.adv { color: var(--amber-700); }
  .field .slabel, .dtitle .did { position: relative; }
  .field.has-err > .slabel::after, .field.has-adv > .slabel::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 8px; vertical-align: middle;
  }
  .field.has-err > .slabel::after { background: var(--crimson-600); }
  .field.has-adv > .slabel::after { background: var(--amber); }
  /* The title/name field has no .slabel — hang its dot off the .did line instead. */
  .dtitle.field.has-err .did::after, .dtitle.field.has-adv .did::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 8px; vertical-align: middle;
  }
  .dtitle.field.has-err .did::after { background: var(--crimson-600); }
  .dtitle.field.has-adv .did::after { background: var(--amber); }
  /* A collapsed repeatable card hiding an errored field still shows an error marker. */
  .ecard.collapsed.has-err { border-color: var(--crimson-200); }
  .ecard.collapsed.has-err .ecard-sum::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--crimson-600); margin-left: 8px; vertical-align: middle;
  }

  /* ------ saved dialog ------ */
  .saved-dialog { position: fixed; bottom: 20px; right: 22px; max-width: 340px; background: var(--surface-card); border: 1px solid var(--line-panel); border-left: 4px solid var(--status-ok); color: var(--text-body-read); padding: 13px 16px; border-radius: var(--r-10); font-size: var(--fs-13); box-shadow: var(--shadow-dialog); z-index: 60; display: none; }
  .saved-dialog.show { display: block; }
  .saved-dialog code { font-family: ui-monospace, monospace; font-size: var(--fs-12); color: var(--navy-900); }
  .saved-dialog .sd-actions { margin-top: 10px; display: flex; gap: 12px; align-items: center; }
  .saved-dialog a { color: var(--text-link); font-weight: 600;
    text-decoration: underline; text-decoration-color: var(--line-link); text-underline-offset: 2px; }
  .saved-dialog a:hover { color: var(--text-link-hover); text-decoration-color: var(--line-link-hover); }
  .saved-dialog .sd-close { margin-left: auto; border: none; background: none; color: var(--navy-500); font-size: var(--fs-12); }

  /* ------ screen switcher (lives in the top bar) ------ */
  .screens { display: flex; }
  .screens button { border: none; background: none; color: var(--navy-500); font-size: var(--fs-13);
    font-weight: 600; padding: 0 15px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .screens button:hover { color: var(--navy-800); }
  .screens button.on { color: var(--navy-900); border-bottom-color: var(--crimson-600); }

  /* ------ style-guide field tree ------ */
  .sg-group { padding: 9px 15px 5px; font-size: var(--fs-10); text-transform: uppercase; letter-spacing: .07em; color: var(--navy-500); font-weight: 700; background: var(--tint); border-top: 1px solid var(--border2); border-bottom: 1px solid var(--border2); }
  .sg-frow { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; }
  .sg-frow .fname { font-size: var(--fs-13); color: var(--navy-800); font-family: ui-monospace, "SFMono-Regular", monospace; }
  .badge.cov { font-variant-numeric: tabular-nums; }
  .badge.cov.c-hi { background: var(--status-ok-bg); color: var(--status-ok-fg); }
  .badge.cov.c-mid { background: var(--status-advice-bg); color: var(--amber-700); }
  .badge.cov.c-lo { background: var(--status-error-bg); color: var(--status-error); }
  .badge.orphan { background: var(--navy-200); color: var(--navy-600); }

  /* ------ style-guide bar editor ------ */
  .slot-list { list-style: none; margin: 6px 0 0; padding: 0; }
  .slot-list li { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
  .slot-list li input { flex: 1; }
  .slotcount { color: var(--navy-500); font-size: var(--fs-11); font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 8px; }
  #preview .sg-fieldwrap { border: 1px solid var(--border); border-radius: 10px; padding: 14px 15px; background: var(--tint); }
  #preview .sg-fieldwrap .f { background: var(--surface-card); }

  /* ------ overview screen ------ */
  /* A dashboard of signals, not a page of documents. The entity header, three big
     counter cards and two legended bars used to fill the first screen with figures that
     answer "is the catalog tidy" — which is not why anyone opens Keel. They are one
     line of facts and three clickable lines now, and the detail lives on the screen
     that owns it. Assessed systems sit LEFT: assessment is the frequent act, authoring
     the model the occasional one, and the left column is read first. */
  .ov-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding-bottom: 12px; margin-bottom: 2px; border-bottom: 1px solid var(--border); }
  .ov-head h2 { margin: 0; font-size: var(--fs-20); font-weight: 700; letter-spacing: -.01em; }
  .ov-facts { margin: 0; font-size: var(--fs-13); color: var(--navy-500); }
  .ov-col { background: var(--tint); border: 1px solid var(--border2); border-radius: var(--r-10);
    padding: 2px 16px 12px; }
  /* A labelled block inside a band — the shared primitive for "several short things
     that belong together": the dashboard's columns, and a report's system + delta,
     which were two full bands and two 15px headings for two sentences. */
  .ov-block { padding: 14px 0; border-top: 1px solid var(--border); }
  .ov-block:first-child { border-top: none; }
  .readsec > .ov-block:first-child { padding-top: 0; }
  .readsec > .ov-block:last-child { padding-bottom: 0; }
  .ov-block > .k { display: flex; align-items: baseline; gap: 8px; margin: 0 0 var(--gap-label);
    font-size: var(--fs-10); font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--navy-600); }
  .ov-block > .k .n { margin-left: auto; font-size: var(--fs-12); font-weight: 500; letter-spacing: 0;
    text-transform: none; color: var(--navy-500); }
  .ov-block .card { margin-bottom: 8px; padding: 11px 13px; }
  .ov-block .card:last-child { margin-bottom: 0; }
  /* An all-clear is the least valuable thing on a dashboard — it earns one line. */
  .ov-block .ov-clean { padding: 9px 12px; gap: 9px; }
  .ov-block .ov-clean p { font-size: var(--fs-13); }
  .ov-block .ov-clean .ok-i { margin-top: 5px; }
  /* One figure, one sentence, one click through to the screen that can act on it. */
  .ov-line { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
    border: none; background: none; padding: 5px 7px; margin: 0 -7px; border-radius: var(--r-6);
    font: inherit; font-size: var(--fs-13); color: var(--navy-700); }
  .ov-line:hover { background: var(--surface-hover); color: var(--navy-900); }
  .ov-line-n { font-size: var(--fs-15); font-weight: 700; color: var(--navy-900);
    font-variant-numeric: tabular-nums; min-width: 38px; }
  .ov-fold > summary { list-style: none; display: flex; align-items: baseline; gap: 10px;
    cursor: pointer; padding: 5px 7px; margin: 0 -7px; border-radius: var(--r-6);
    font-size: var(--fs-13); color: var(--navy-700); user-select: none; }
  .ov-fold > summary::-webkit-details-marker { display: none; }
  .ov-fold > summary:hover { background: var(--surface-hover); color: var(--navy-900); }
  .ov-fold[open] > summary { color: var(--navy-900); font-weight: 600; }
  .ov-fold-b { padding: 2px 0 10px 48px; }
  .ov-fold-b .ov-gap-desc { margin: 0 0 8px; }
  .ov-gap-group { margin-bottom: 10px; }
  .ov-gap-head { display: flex; align-items: center; gap: 8px; }
  .ov-gap-head .gname { font-weight: 600; color: var(--navy-900); font-size: var(--fs-14); }
  .ov-gap-desc { color: var(--navy-600); font-size: var(--fs-13); line-height: var(--lh-base); margin: 5px 0 10px; max-width: var(--measure); }
  .ov-chips { display: flex; flex-wrap: wrap; align-items: center; }
  /* A warning that names no entity (a whole-catalog observation) has nothing to put in
     a chip. It used to render an empty chip row under a bare label and a count, which
     is why "Unused vocabulary 1" said nothing at all. Show the message instead. */
  .ov-warn-msg { color: var(--navy-700); font-size: var(--fs-14); line-height: var(--lh-base); margin: 5px 0 0; max-width: var(--measure); }
  /* Hard errors, above both columns and full width. Advisory warnings sit inside a
     block as chips because they are nudges about quality; these are not. A record here
     failed to load, so the app is serving less than the catalog claims — that belongs
     where it cannot be scrolled past. The band is absent entirely when there are none. */
  /* Colour is graded to importance, not to the band's subject. A crimson wash on the
     whole thing shouted before the reader knew what was wrong, and put the file path,
     the message and the marker at one loudness. So: the spine says "danger" once, and
     the only other crimson is the marker naming which records are actually missing
     from the app. Everything else is the same navy structure every block wears. */
  .ov-errors { background: var(--surface-card); border: 1px solid var(--border);
    border-left: 2px solid var(--sev-high-spine); border-radius: var(--r-10);
    padding: var(--pad-card); margin-bottom: var(--gap-band); }
  .ov-errors > .k { display: flex; align-items: baseline; gap: 8px; margin: 0 0 var(--gap-label);
    font-size: var(--fs-10); font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--navy-600); }
  .ov-errors > .k .n { margin-left: auto; font-size: var(--fs-12); font-weight: 500;
    letter-spacing: 0; text-transform: none; color: var(--navy-500); }
  /* Two parts, always in this shape: a metadata line, then the message. Laid out as one
     wrapping row, a long message pushed the marker onto a third line and it read as its
     own entry — the same defect twice looked like two different defects. */
  .ov-err-row { padding: 7px 0; border-top: 1px solid var(--border2); }
  .ov-err-row:first-of-type { border-top: 0; padding-top: 0; }
  .ov-err-head { display: flex; align-items: baseline; gap: 10px; }
  .ov-err-loc { border: none; background: none; padding: 0; cursor: pointer;
    font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-link);
    text-decoration: underline; text-decoration-color: var(--line-link);
    text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .ov-err-loc:hover { color: var(--text-link-hover); text-decoration-color: var(--line-link-hover); }
  .ov-err-msg { color: var(--navy-800); font-size: var(--fs-14); line-height: var(--lh-base);
    max-width: var(--measure); margin: 2px 0 0; }
  .ov-err-field { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--navy-500);
    margin-right: 8px; }
  .ov-err-gh { margin-left: auto; font-size: var(--fs-12); color: var(--navy-500);
    text-decoration: underline; text-decoration-color: var(--line-link); text-underline-offset: 2px; }
  .ov-err-gh:hover { color: var(--text-link-hover); text-decoration-color: var(--line-link-hover); }
  /* Repair opens in place. A record that would not parse has no form to render, so the
     honest editor for it is its own text — and it is refused on save if it still would
     not load, which is the same gate the loader applies. */
  .ov-repair:empty { display: none; }
  .ov-repair { margin-top: 10px; }
  .ov-repair textarea { width: 100%; box-sizing: border-box; min-height: 220px; resize: vertical;
    font-family: var(--font-mono); font-size: var(--fs-12); line-height: var(--lh-base);
    color: var(--navy-900); background: var(--tint); border: 1px solid var(--border);
    border-radius: var(--r-6); padding: 10px 12px; }
  .ov-repair textarea:focus { outline: none; border-color: var(--line-focus); box-shadow: var(--focus-ring); }
  .ov-repair-actions { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .ov-repair-err { color: var(--status-error); font-size: var(--fs-13); line-height: var(--lh-base);
    margin: 9px 0 0; max-width: var(--measure); }
  .ov-err-drop { font-size: var(--fs-11); font-weight: 600; color: var(--status-error); }
  .ov-errors .ov-err-fix { font-size: var(--fs-13); color: var(--navy-600); margin: var(--gap-label) 0 0; max-width: var(--measure); }
  /* Long id lists get cut to a readable run; the rest is one click away. */
  .ov-more { border: none; background: none; color: var(--text-link); font-size: var(--fs-12);
    font-weight: 600; padding: 3px 6px; margin: 0 0 6px; border-radius: 6px;
    text-decoration: underline; text-decoration-color: var(--line-link); text-underline-offset: 2px; }
  .ov-more:hover { background: var(--navy-100); text-decoration-color: var(--line-link-hover); }
  /* Cross-system rows: what it is, what state it is in, who is asking. */
  .ins-row { display: flex; align-items: baseline; gap: 9px; padding: 8px 0;
    border-bottom: 1px solid var(--border2); flex-wrap: wrap; }
  .ins-row:last-child { border-bottom: none; }
  .ins-name { font-size: var(--fs-14); color: var(--navy-900); font-weight: 500; }
  .ins-meta { font-size: var(--fs-12); color: var(--navy-500); margin-left: auto; }
  /* Charts are CSS bars, not a library: the app is one static file with no build step,
     and a ranked horizontal bar answers "which is worst" better than a pie ever does. */
  .hbars { display: grid; grid-template-columns: minmax(90px, auto) 1fr auto; gap: 7px 12px; align-items: center; }
  .hbar-k { font-size: var(--fs-13); color: var(--navy-700); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-k .reflink { font: inherit; }
  .hbar-t { height: 12px; border-radius: var(--r-4); background: var(--navy-100); overflow: hidden; }
  .hbar-f { height: 100%; border-radius: var(--r-4); background: var(--navy-500); }
  .hbar-f.sev-high { background: var(--sev-high-spine); }
  .hbar-f.sev-medium { background: var(--sev-medium-spine); }
  .hbar-f.sev-low { background: var(--sev-low-spine); }
  /* Coverage bars reuse the badge's own thresholds, so a bar and its badge never
     disagree about whether a field group is in good shape. */
  .hbar-f.c-hi { background: var(--status-ok); }
  .hbar-f.c-mid { background: var(--amber); }
  .hbar-f.c-lo { background: var(--accent); }
  .hbar-k.ent { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: var(--fs-13); }
  /* Stacked: the segments of one row are parts of that row's total, so they butt up
     against each other and only the ends of the run are rounded. */
  .hbar-t.stack { display: flex; }
  .hbar-t.stack .hbar-f { border-radius: 0; }
  .hbar-t.stack .hbar-f:first-child { border-radius: var(--r-4) 0 0 var(--r-4); }
  .hbar-t.stack .hbar-f:last-child { border-radius: 0 var(--r-4) var(--r-4) 0; }
  .ov-bar-legend .dot.sev-high { background: var(--sev-high-spine); }
  .ov-bar-legend .dot.sev-medium { background: var(--sev-medium-spine); }
  .ov-bar-legend .dot.sev-low { background: var(--sev-low-spine); }
  .ov-block .ov-bar-legend { margin-top: 9px; font-size: var(--fs-12); }
  .hbar-v { font-size: var(--fs-13); color: var(--navy-700); font-variant-numeric: tabular-nums; }
  .hbar-v .u { color: var(--navy-500); font-size: var(--fs-12); }
  /* `display: contents` so the parked chips rejoin the same wrapping flex row. */
  .ov-rest { display: contents; }
  .ov-rest.hide { display: none; }
  .ov-chip { display: inline-flex; align-items: center; font-family: ui-monospace, "SFMono-Regular", monospace; font-size: var(--fs-12);
    padding: 3px 9px; border-radius: 6px; background: var(--navy-100); color: var(--navy-700); border: 1px solid var(--border);
    cursor: pointer; margin: 0 6px 6px 0; }
  .ov-chip:hover { background: var(--crimson-50); color: var(--crimson-700); border-color: var(--crimson-200); }
  .ov-chip.on { background: var(--crimson-50); color: var(--crimson-700); border-color: var(--crimson-200); font-weight: 600; }
  .ov-clean { display: flex; align-items: flex-start; gap: 10px; background: var(--status-ok-bg); border: 1px solid var(--status-ok-line);
    color: var(--status-ok-fg); border-radius: 10px; padding: 14px 16px; }
  /* Status is a CSS dot, not a glyph — Keel has no icon set and says the word instead. */
  .ov-clean .ok-i { width: 8px; height: 8px; border-radius: var(--r-round); background: var(--status-ok);
    flex-shrink: 0; margin-top: 6px; }
  .ov-clean p { margin: 0; color: var(--navy-700); font-size: var(--fs-14); line-height: var(--lh-base); max-width: var(--measure); }
  .ov-clean p b { color: var(--status-ok-fg); }
  .ov-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .ov-grid2 > section { margin-top: 14px; }
  .ov-grid2 > div > .readsec:first-child { margin-top: 0; }
  @media (max-width: 900px) { .ov-grid2 { grid-template-columns: 1fr; } }
  .ov-bar-legend { display: flex; gap: 16px; font-size: var(--fs-13); color: var(--navy-500); flex-wrap: wrap; }
  .ov-bar-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .ov-activity-row { padding: 11px 0; border-bottom: 1px solid var(--border2); font-size: var(--fs-14); }
  .ov-activity-row:last-child { border-bottom: none; }
  .ov-activity-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ov-activity-msg { color: var(--navy-900); font-weight: 500; }
  .ov-activity-meta { color: var(--navy-500); font-size: var(--fs-12); }
  .ov-activity-row .ov-chips { margin-top: 7px; }

  /* ------ reports screen ------ */
  /* Severity escalates by WEIGHT, not hue, and only the top band takes a solid fill — if
     the Edit button is as loud as the worst finding, nothing reads as worst. The 4px spine
     carries the ranking so the list is legible before a word is read. Low is navy, never
     green: green means covered/closed, a different axis — a low finding is still open. */
  .finding { border-left: 4px solid var(--sev-low-spine); padding: var(--pad-card); }
  .finding.sev-high { border-left-color: var(--sev-high-spine); }
  .finding.sev-medium { border-left-color: var(--sev-medium-spine); }
  .finding.sev-low { border-left-color: var(--sev-low-spine); }
  .finding .chead { flex-wrap: wrap; }
  .grades { margin-left: auto; display: flex; gap: 6px; }
  .sev { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-11);
    padding: 2px 9px; border-radius: var(--r-4); white-space: nowrap; border: 1px solid transparent; }
  .sev .p { opacity: .7; font-weight: var(--fw-medium); }
  .sev.sev-high { background: var(--sev-high-bg); color: var(--sev-high-fg);
    border-color: var(--sev-high-line); font-weight: var(--fw-bold); }
  .sev.sev-medium { background: var(--sev-medium-bg); color: var(--sev-medium-fg);
    border-color: var(--sev-medium-line); font-weight: var(--fw-semibold); }
  .sev.sev-low { background: var(--sev-low-bg); color: var(--sev-low-fg);
    border-color: var(--sev-low-line); font-weight: var(--fw-medium); }
  /* Severity owns the solid fill; likelihood is graded on the same three bands but drawn
     as an outline. Otherwise a single card shows two solid crimson blocks side by side
     and neither of them reads as the thing to look at. */
  .sev.quiet.sev-high { background: var(--crimson-50); color: var(--crimson-700);
    border-color: var(--crimson-200); font-weight: var(--fw-semibold); }
  .fscenario { margin: 10px 0 0; font-size: var(--fs-14); line-height: var(--lh-prose); color: var(--navy-800); max-width: var(--measure); }
  /* Why the grade is what it is. This is the first question a reader asks of a graded
     finding, so it sits directly under the scenario on its own surface — it used to be
     12px muted type at the foot of the card, below the requirements it justifies. */
  .fwhy { margin-top: 12px; padding: 10px 12px; background: var(--tint); border: 1px solid var(--border2);
    border-radius: var(--r-8); font-size: var(--fs-13); line-height: var(--lh-prose); color: var(--navy-700); max-width: var(--measure); }
  .fwhy .k, .freqs-k { display: block; font-size: var(--fs-10); font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--navy-600); margin-bottom: 5px; }
  /* The chain the grade rests on: asset, weakness, attacker, what moved since last time.
     Facts that need naming to be understood get a label here; the ones that read on their
     own (harm, surface, exploitation cost) stay unlabelled badges below. */
  .fchain { display: grid; grid-template-columns: 116px 1fr; gap: 8px 14px; margin: 13px 0 0; }
  .fchain dt { font-size: var(--fs-10); font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--navy-600); padding-top: 3px; }
  .fchain dd { margin: 0; font-size: var(--fs-14); line-height: var(--lh-base); color: var(--navy-700); max-width: var(--measure); }
  .finding .badges { margin-top: 13px; }
  .freqs { margin-top: 15px; border-top: 1px solid var(--border2); padding-top: 12px; }
  /* Requirement rows: checkbox and text on one line. A dedicated class, not .cdesc,
     because that carries white-space: pre-wrap and would keep the template's newlines. */
  .req-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; font-size: var(--fs-14); color: var(--navy-700); }
  .req-row input { margin: 4px 0 0; flex-shrink: 0; accent-color: var(--crimson-600); }
  .req-row label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; line-height: var(--lh-base); }
  .req-meta { display: block; font-family: ui-monospace, "SFMono-Regular", monospace;
    font-size: var(--fs-11); color: var(--navy-500); margin-top: 2px; }
  .req-note { margin: 4px 0 0 24px; color: var(--navy-500); font-size: var(--fs-13); font-style: italic;
    line-height: var(--lh-base); max-width: var(--measure); }
  .req-ignored { margin-top: 9px; color: var(--navy-500); font-size: var(--fs-13); font-style: italic;
    line-height: var(--lh-base); max-width: var(--measure); }
  .rep-qa { margin-top: 6px; font-size: var(--fs-14); line-height: var(--lh-prose); color: var(--navy-700); max-width: var(--measure); }
  .rep-qa .meta { display: inline-block; min-width: 18px; font-weight: 700; color: var(--navy-500); }
  /* Anything that names an entity in the model is a way into it. */
  .reflink { border: none; background: none; padding: 0; font: inherit; font-weight: inherit;
    color: var(--text-link); cursor: pointer; text-align: left;
    text-decoration: underline; text-decoration-color: var(--line-link);
    text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .reflink:hover { color: var(--text-link-hover); text-decoration-color: var(--line-link-hover); }

  /* ------ report: a draft is edited where it is read ------ */
  /* No Edit button and no mode switch. The read view IS the document being checked, so
     a separate form would mean checking one thing and correcting another. Controls wear
     the surrounding type and only show a box on hover or focus; every change saves. */
  .rep-status { font-size: var(--fs-11); padding: 2px 9px; border-radius: var(--r-4); font-weight: 700;
    text-transform: lowercase; }
  .rep-status.draft { background: var(--amber-50); color: var(--amber-700); }
  .rep-status.final { background: var(--navy-200); color: var(--navy-700); }
  .savestate { font-size: var(--fs-12); color: var(--navy-500); white-space: nowrap; align-self: center; }
  .savestate.ok { color: var(--status-ok-fg); }
  .savestate.err { color: var(--status-error); }
  .ie { display: block; width: 100%; max-width: var(--measure); font: inherit; color: inherit;
    background: transparent; border: 1px solid transparent; border-radius: var(--r-6);
    padding: 4px 7px; margin: -4px -7px; resize: none; overflow: hidden; outline: none; }
  .ie:hover { border-color: var(--line-control); background: var(--surface-card); }
  .ie:focus { border-color: var(--line-focus); background: var(--surface-card); box-shadow: var(--focus-ring); }
  /* A grade stays a badge and becomes a picker — the thing you disagree with is the
     thing you click, with no hunt for the field that controls it. */
  .sev select.ie-grade { appearance: none; -webkit-appearance: none; background: transparent;
    border: none; color: inherit; font: inherit; font-weight: inherit; padding: 0; margin: 0;
    cursor: pointer; outline: none; }
  .sev select.ie-grade:focus { text-decoration: underline; }
  .fchain select.ie, .badges select.ie { display: inline-block; width: auto; max-width: none; }
  .finding .fdrop { margin-left: 4px; border: none; background: none; color: var(--navy-500);
    font-size: var(--fs-15); line-height: var(--lh-1); padding: 2px 6px; border-radius: var(--r-6); }
  .finding .fdrop:hover { background: var(--crimson-50); color: var(--accent); }
  .rep-empty { color: var(--navy-500); font-style: italic; }
  /* Body copy, and in a band. At 13px on the bare page background it was the only prose
     on the screen without a container and half a step off the prose under it — which is
     exactly the pair of tells that makes a page feel arbitrary. */
  .rep-final p { margin: 0; font-size: var(--fs-14); line-height: var(--lh-prose); color: var(--navy-700);
    max-width: var(--measure); }
  .rep-final b { color: var(--navy-900); font-weight: 600; }
  .nr-field { margin-bottom: 16px; max-width: 520px; }
  .nr-field > label { display: block; font-size: var(--fs-10); font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--navy-600); margin-bottom: 5px; }
  .nr-field .hint { margin-top: 5px; }
  .rep-dates { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 16px 0 0; }
  .rep-dates .k { font-size: var(--fs-10); font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--navy-600); }
  .rep-dates .ov-chip { margin: 0; }

  /* Ruled out, and how the run itself went, are how WE debug the assessor — not the
     specialist's job. A discarded candidate is rare, and the run record is a trace.
     They sit at the foot, side by side, folded shut. */
  .rep-aside { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-top: 16px; }
  @media (max-width: 1100px) { .rep-aside { grid-template-columns: 1fr; } }
  .rep-aside > .readsec { margin-top: 0; }
  .fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before { content: "\25B8"; color: var(--navy-500); font-size: var(--fs-10); width: 9px; flex-shrink: 0; }
  .fold[open] > summary::before { content: "\25BE"; }
  .fold > summary:hover h3 { color: var(--accent-hover); }
  .fold > summary h3 { margin: 0; }
  .fold-body { margin-top: 12px; }

  /* Tabs inside a detail view. Same treatment as the top bar, one step quieter — they
     switch a view of one entity, not the screen you are on. */
  .subtabs { display: flex; margin: 16px 0 0; border-bottom: 1px solid var(--border); }
  .subtabs button { border: none; background: none; color: var(--navy-500); font-size: var(--fs-13);
    font-weight: 600; padding: 8px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  /* Flush left. Padded, the first tab's label started 14px in while everything else on
     the page started at the content edge, giving the eye a third left margin to track. */
  .subtabs button:first-child { padding-left: 0; }
  .subtabs button:hover { color: var(--navy-800); }
  .subtabs button.on { color: var(--navy-900); border-bottom-color: var(--crimson-600); }

  /* ------ report hand-off ------ */
  .handoff { display: grid; grid-template-columns: 300px 1fr; gap: 26px; align-items: start; margin-top: 20px; }
  @media (max-width: 1100px) { .handoff { grid-template-columns: 1fr; } }
  /* Options run most-useful-first for the reader receiving this: the asks, then the
     evidence for them, then the framing. A sub-option greys out with its parent. */
  .exp-group { margin-bottom: 16px; }
  .exp-k { font-size: var(--fs-10); font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--navy-600); margin: 0 0 7px; }
  .exp-opt { display: flex; align-items: center; gap: 8px; font-size: var(--fs-13); color: var(--navy-700);
    padding: 3px 0; cursor: pointer; }
  .exp-opt input { accent-color: var(--crimson-600); flex-shrink: 0; }
  .exp-opt.sub { margin-left: 20px; font-size: var(--fs-12); color: var(--navy-600); }
  .exp-opt.off { opacity: .45; cursor: default; }
  .exp-actions { display: flex; gap: 8px; margin: 4px 0 12px; }
  /* 12px, not 11: with the full pane behind it this is text someone proofreads before
     sending, not a thumbnail. */
  .exp-preview { border: 1px solid var(--line-panel); border-radius: var(--r-8); background: var(--surface-card);
    font-family: ui-monospace, "SFMono-Regular", monospace; font-size: var(--fs-12); line-height: var(--lh-prose);
    color: var(--navy-700); white-space: pre-wrap; padding: 16px 18px; overflow-x: auto; }
  .exp-note { font-size: var(--fs-12); color: var(--navy-500); margin: 0 0 10px; line-height: var(--lh-base); }
</style>
</head>
