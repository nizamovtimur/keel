source:
  id: mitre-atlas
  title: MITRE ATLAS
  kind: best_practice
  version: 5.6.0
  url: https://atlas.mitre.org/
  checked: '2026-08-29'
  entry_count: 101
  note: 'The long tail, and the only source here that is exhaustive by design. 16 tactics over these techniques, imported from the project''s own published dataset rather than retyped. Sub-techniques are deliberately not rows: they refine a parent rather than name a different thing, and a matrix nobody can read is not evidence of anything.'
