source:
  id: eu-ai-act
  title: EU Artificial Intelligence Act
  kind: regulation
  version: Regulation (EU) 2024/1689, consolidated 2026-07-27 (as amended by Regulation (EU) 2026/1744)
  released: '2026-07-27'
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
  checked: '2026-11-07'
  entry_count: 133
  note: 'A regulation, not a threat list: a system that falls short here is in breach, not merely behind
    best practice. Rows are the 119 articles (1 to 113, with 4a, 60a and 75a to 75d inserted by the 2026
    amendment) and the 14 annexes; the recitals explain the articles and are not rows. Most obligations
    apply to high-risk systems (Article 6, Annex III), and whether a system is high-risk is a legal classification
    Keel does not make. Where only some paragraphs of an article bind a deployed system, the row says
    which fall outside. Two parts inside Keel''s reach have no card yet although their article is covered:
    feedback loops in systems that keep learning (15(4)) and the deployer''s log retention (26(6)). A
    later consolidated version changes the count, and keel validate fails until every new entry has a
    row.'
entries:
- ref: Art. 15
  title: Accuracy, robustness and cybersecurity
  group: Chapter III, Section 2 - Requirements for high-risk AI systems
  state: covered
  threats:
  - T-SOURCE-POISON
  - T-SUPPLY-DEPS
  - T-DATA-LEAK
  - T-METADATA-LEAK
  - T-CROSS-TENANT
  - T-TOOL-ABUSE
  - T-CMD-INJECT
  - T-CODEGEN
  - T-CRED-THEFT
  - T-SSRF
  - T-DOS
  - T-HALLUCINATION
  outside: '15(2): benchmarks and measurement methods the Commission encourages; 15(3): declaring accuracy
    levels in the instructions for use, a documentation duty.'
- ref: Art. 14
  title: Human oversight
  group: Chapter III, Section 2 - Requirements for high-risk AI systems
  state: covered
  threats:
  - T-TOOL-ABUSE
  - T-HALLUCINATION
  mitigations:
  - CTRL-HUMAN-IN-LOOP
  - CTRL-HACT-CRITICAL
  - CTRL-RISK-BASED-APPROVAL
  - CTRL-IRREVERSIBLE-ACTION-GUARD
  - CTRL-PLAN-CONFIRMATION
  - CTRL-FATIGUE-DETECTION
  - CTRL-APPROVAL-THROTTLING
  - CTRL-SOURCE-REFERENCES
  - CTRL-ACTIVITY-ANOMALY-DETECTION
  outside: '14(5): separate verification by two people before acting on a remote biometric identification;
    the library does not model biometric systems.'
- ref: Art. 12
  title: Record-keeping
  group: Chapter III, Section 2 - Requirements for high-risk AI systems
  state: covered
  mitigations:
  - CTRL-AUDIT-LOGGING
  outside: '12(3): the minimum log content for remote biometric identification (Annex III, point 1(a));
    the library does not model biometric systems.'
- ref: Art. 26
  title: Obligations of deployers of high-risk AI systems
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: covered
  mitigations:
  - CTRL-ACTIVITY-ANOMALY-DETECTION
  - CTRL-AUDIT-LOGGING
  outside: '26(1)-(4) and (7)-(12), and in 26(5) everything past monitoring itself: using the system as
    instructed, assigning competent people to oversee it, the relevance of input data, informing the provider,
    authorities, workers and affected persons, suspending use, registration, the data protection impact
    assessment, authorisation of post-remote biometric identification and cooperation with authorities
    are the deployer''s organisational duties.'
- ref: Art. 19
  title: Automatically generated logs
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: gap
  note: 19(1) asks the provider to keep the system's logs for a period fit for its purpose, at least six
    months. The audit-logging card records and replays events but sets no retention period, so nothing
    in the library answers how long they are kept.
  outside: '19(2): how financial institutions keep the logs under financial services law.'
- ref: Art. 13
  title: Transparency and provision of information to deployers
  group: Chapter III, Section 2 - Requirements for high-risk AI systems
  state: gap
  note: '13(1) asks that a high-risk system''s operation be transparent enough for its deployer to interpret
    the output and use it appropriately. No card models that yet: source references let a reader check
    a statement, not understand how the system reached it.'
  outside: '13(2)-(3): the instructions for use and what they must contain, a documentation duty.'
- ref: Art. 50
  title: Transparency obligations for providers and deployers of certain AI systems
  group: Chapter IV - Transparency obligations for providers and deployers of certain AI systems
  state: gap
  note: No card yet for telling people they are dealing with an AI system (50(1)), for machine-readable
    marking of generated content (50(2)), or for disclosing deep fakes and generated text published on
    matters of public interest (50(4)), given clearly at the first interaction or exposure (50(5)). These
    are behaviours of a deployed system, so they are inside Keel's reach.
  outside: '50(3): emotion recognition and biometric categorisation, which the library does not model;
    50(6)-(7): how the obligations relate to other law, and the Commission''s codes of practice.'
- ref: Art. 5
  title: Prohibited AI practices
  group: Chapter II - Prohibited AI practices
  state: gap
  note: Since the 2026 amendment, a system that can produce intimate imagery of an identifiable person
    without consent, or child sexual abuse material, is prohibited unless it has technical safeguards
    that reliably prevent it (5(1)(ba), (bb) and 5(1a)(a)(ii)). That is a behaviour of a deployed system.
    The content-policy card is about what the organisation's own system says, not about generated imagery
    of real people, so this is a gap.
  outside: 'The other prohibitions in 5(1) and 5(2)-(8): uses banned for their purpose and the conditions
    for real-time remote biometric identification by law enforcement are a legal classification Keel does
    not make.'
- ref: Art. 1
  title: Subject matter
  group: Chapter I - General provisions
  state: out_of_scope
  note: States the Regulation's purpose and what it lays down. No duty on a system by itself.
- ref: Art. 2
  title: Scope
  group: Chapter I - General provisions
  state: out_of_scope
  note: Says whom and what the Regulation applies to and what it excludes. Whether a system is in scope
    is a legal question Keel does not answer.
- ref: Art. 3
  title: Definitions
  group: Chapter I - General provisions
  state: out_of_scope
  note: Definitions. They decide how the other articles read, but place no duty of their own.
- ref: Art. 4
  title: AI literacy
  group: Chapter I - General provisions
  state: out_of_scope
  note: Providers and deployers take measures to support the AI literacy of their staff; 4(2) and (3)
    task the Commission, Member States and the Board. Organisational, not a property of the system.
- ref: Art. 4a
  title: Processing of special categories of personal data for bias detection and correction
  group: Chapter I - General provisions
  state: out_of_scope
  note: Lets providers, and deployers of high-risk systems, process special categories of personal data
    to detect and correct bias, under conditions (pseudonymisation, access limits, deletion). A data-protection
    permission and its safeguards, outside the security and behaviour Keel assesses.
- ref: Art. 6
  title: Classification rules for high-risk AI systems
  group: Chapter III, Section 1 - Classification of AI systems as high-risk
  state: out_of_scope
  note: Decides whether a system is high-risk. That is a legal classification Keel does not make; Keel
    assesses the system either way.
- ref: Art. 7
  title: Amendments to Annex III
  group: Chapter III, Section 1 - Classification of AI systems as high-risk
  state: out_of_scope
  note: Empowers the Commission to amend the list of high-risk uses in Annex III. Binds the Commission,
    not the system Keel assesses.
- ref: Art. 8
  title: Compliance with the requirements
  group: Chapter III, Section 2 - Requirements for high-risk AI systems
  state: out_of_scope
  note: Requires a high-risk system to meet the requirements of Section 2. The requirements themselves
    are mapped at Articles 9 to 15.
- ref: Art. 9
  title: Risk management system
  group: Chapter III, Section 2 - Requirements for high-risk AI systems
  state: out_of_scope
  note: A risk management process the provider runs over the whole lifecycle. A Keel assessment is input
    to it (the risks found and the measures asked for), but the process itself is an organisational obligation,
    not a property of the system Keel assesses.
- ref: Art. 10
  title: Data and data governance
  group: Chapter III, Section 2 - Requirements for high-risk AI systems
  state: out_of_scope
  note: 'Governance of the training, validation and testing data: quality, representativeness, bias examination.
    That is the model builder''s process. Poisoning of the data a deployed system reads at run time is
    assessed under Article 15.'
- ref: Art. 11
  title: Technical documentation
  group: Chapter III, Section 2 - Requirements for high-risk AI systems
  state: out_of_scope
  note: The technical documentation the provider draws up before release (content in Annex IV). A documentation
    duty; a Keel report can be part of what it cites.
- ref: Art. 16
  title: Obligations of providers of high-risk AI systems
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: out_of_scope
  note: A list of the provider's duties. The technical ones point to Section 2 and Article 19, mapped
    there; the rest (marking, registration, declarations, corrective action) are organisational, and accessibility
    (16(l)) follows other directives outside what Keel assesses.
- ref: Art. 17
  title: Quality management system
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: out_of_scope
  note: 'The provider''s quality management system: written policies, procedures and responsibilities.
    An organisational system, not a property of the AI system.'
- ref: Art. 18
  title: Documentation keeping
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: out_of_scope
  note: How long the provider keeps documentation available to authorities. A record-keeping duty about
    papers, not about the system's own logs (those are Articles 12 and 19).
- ref: Art. 20
  title: Corrective actions and duty of information
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: out_of_scope
  note: 'What the provider must do when a system does not conform: correct, withdraw, recall and inform.
    A process duty after the fact.'
- ref: Art. 21
  title: Cooperation with competent authorities
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: out_of_scope
  note: Providers must give authorities information and access to logs on request. Cooperation with authorities,
    organisational.
- ref: Art. 22
  title: Authorised representatives of providers of high-risk AI systems
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: out_of_scope
  note: A duty of an operator in the value chain (representative, importer) to check papers, keep records
    and cooperate. Organisational, not a property of the system.
- ref: Art. 23
  title: Obligations of importers
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: out_of_scope
  note: A duty of an operator in the value chain (representative, importer) to check papers, keep records
    and cooperate. Organisational, not a property of the system.
- ref: Art. 24
  title: Obligations of distributors
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: out_of_scope
  note: 'A distributor''s duties: check marking and papers, keep the system in conformity while it holds
    it, take corrective action and inform authorities. Organisational, not a property of the system.'
- ref: Art. 25
  title: Responsibilities along the AI value chain
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: out_of_scope
  note: Who counts as the provider when a system is rebranded or modified, and what the parties in the
    value chain owe each other. Contractual and legal allocation of duties.
- ref: Art. 27
  title: Fundamental rights impact assessment for high-risk AI systems
  group: Chapter III, Section 3 - Obligations of providers and deployers of high-risk AI systems and other
    parties
  state: out_of_scope
  note: Certain deployers assess the impact on fundamental rights before first use. A legal assessment
    of a different kind; Keel's security assessment is not one and does not replace it.
- ref: Art. 28
  title: Notifying authorities
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 29
  title: Application of a conformity assessment body for notification
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 30
  title: Notification procedure
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 31
  title: Requirements relating to notified bodies
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 32
  title: Presumption of conformity with requirements relating to notified bodies
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 33
  title: Subsidiaries of notified bodies and subcontracting
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 34
  title: Operational obligations of notified bodies
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 35
  title: Identification numbers and lists of notified bodies
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 36
  title: Changes to notifications
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 37
  title: Challenge to the competence of notified bodies
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 38
  title: Coordination of notified bodies
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 39
  title: Conformity assessment bodies of third countries
  group: Chapter III, Section 4 - Notifying authorities and notified bodies
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 40
  title: Harmonised standards and standardisation deliverables
  group: Chapter III, Section 5 - Standards, conformity assessment, certificates, registration
  state: out_of_scope
  note: 'Part of the conformity system: standards and common specifications, conformity assessment, certificates,
    declarations, marking and registration, run by the Commission, notified bodies and providers. A paper
    and procedural matter, not a property of the running system.'
- ref: Art. 41
  title: Common specifications
  group: Chapter III, Section 5 - Standards, conformity assessment, certificates, registration
  state: out_of_scope
  note: 'Part of the conformity system: standards and common specifications, conformity assessment, certificates,
    declarations, marking and registration, run by the Commission, notified bodies and providers. A paper
    and procedural matter, not a property of the running system.'
- ref: Art. 42
  title: Presumption of conformity with certain requirements
  group: Chapter III, Section 5 - Standards, conformity assessment, certificates, registration
  state: out_of_scope
  note: 'Part of the conformity system: standards and common specifications, conformity assessment, certificates,
    declarations, marking and registration, run by the Commission, notified bodies and providers. A paper
    and procedural matter, not a property of the running system.'
- ref: Art. 43
  title: Conformity assessment
  group: Chapter III, Section 5 - Standards, conformity assessment, certificates, registration
  state: out_of_scope
  note: 'Part of the conformity system: standards and common specifications, conformity assessment, certificates,
    declarations, marking and registration, run by the Commission, notified bodies and providers. A paper
    and procedural matter, not a property of the running system.'
- ref: Art. 44
  title: Certificates
  group: Chapter III, Section 5 - Standards, conformity assessment, certificates, registration
  state: out_of_scope
  note: 'Part of the conformity system: standards and common specifications, conformity assessment, certificates,
    declarations, marking and registration, run by the Commission, notified bodies and providers. A paper
    and procedural matter, not a property of the running system.'
- ref: Art. 45
  title: Information obligations of notified bodies
  group: Chapter III, Section 5 - Standards, conformity assessment, certificates, registration
  state: out_of_scope
  note: Rules for notifying authorities and notified bodies. Binds authorities and conformity assessment
    bodies, not the system Keel assesses.
- ref: Art. 46
  title: Derogation from conformity assessment procedure
  group: Chapter III, Section 5 - Standards, conformity assessment, certificates, registration
  state: out_of_scope
  note: Lets a market surveillance authority authorise a system before its conformity assessment, and
    law enforcement or civil protection authorities use one in urgency; if authorisation is refused, they
    stop the use and discard its outputs (46(2)). Decisions of authorities, not a property of the system.
- ref: Art. 47
  title: EU declaration of conformity
  group: Chapter III, Section 5 - Standards, conformity assessment, certificates, registration
  state: out_of_scope
  note: 'Part of the conformity system: standards and common specifications, conformity assessment, certificates,
    declarations, marking and registration, run by the Commission, notified bodies and providers. A paper
    and procedural matter, not a property of the running system.'
- ref: Art. 48
  title: CE marking
  group: Chapter III, Section 5 - Standards, conformity assessment, certificates, registration
  state: out_of_scope
  note: The CE marking, including a digital marking reachable from the system's interface (48(2)). A conformity
    label, not a security or behaviour property Keel assesses.
- ref: Art. 49
  title: Registration
  group: Chapter III, Section 5 - Standards, conformity assessment, certificates, registration
  state: out_of_scope
  note: 'Part of the conformity system: standards and common specifications, conformity assessment, certificates,
    declarations, marking and registration, run by the Commission, notified bodies and providers. A paper
    and procedural matter, not a property of the running system.'
- ref: Art. 51
  title: Classification of general-purpose AI models as general-purpose AI models with systemic risk
  group: Chapter V, Section 1 - Classification rules
  state: out_of_scope
  note: Binds the provider of a general-purpose AI model, or the Commission acting on one. Keel assesses
    systems built on such a model, not the model provider.
- ref: Art. 52
  title: Procedure
  group: Chapter V, Section 1 - Classification rules
  state: out_of_scope
  note: Binds the provider of a general-purpose AI model, or the Commission acting on one. Keel assesses
    systems built on such a model, not the model provider.
- ref: Art. 53
  title: Obligations for providers of general-purpose AI models
  group: Chapter V, Section 2 - Obligations for providers of general-purpose AI models
  state: out_of_scope
  note: Binds the provider of a general-purpose AI model, or the Commission acting on one. Keel assesses
    systems built on such a model, not the model provider.
- ref: Art. 54
  title: Authorised representatives of providers of general-purpose AI models
  group: Chapter V, Section 2 - Obligations for providers of general-purpose AI models
  state: out_of_scope
  note: Binds the provider of a general-purpose AI model, or the Commission acting on one. Keel assesses
    systems built on such a model, not the model provider.
- ref: Art. 55
  title: Obligations of providers of general-purpose AI models with systemic risk
  group: Chapter V, Section 3 - Obligations of providers of general-purpose AI models with systemic risk
  state: out_of_scope
  note: Binds the provider of a general-purpose model with systemic risk, including the model's own cybersecurity
    and adversarial testing. Keel assesses systems built on such a model, not the model provider.
- ref: Art. 56
  title: Codes of practice
  group: Chapter V, Section 4 - Codes of practice
  state: out_of_scope
  note: Binds the provider of a general-purpose AI model, or the Commission acting on one. Keel assesses
    systems built on such a model, not the model provider.
- ref: Art. 57
  title: AI regulatory sandboxes
  group: Chapter VI - Measures in support of innovation
  state: out_of_scope
  note: Member States must set up AI regulatory sandboxes; taking part is voluntary for providers. It
    governs supervised development and testing, not how a deployed system behaves.
- ref: Art. 58
  title: Detailed arrangements for, and functioning of, AI regulatory sandboxes
  group: Chapter VI - Measures in support of innovation
  state: out_of_scope
  note: Regulatory sandboxes, real-world testing and support measures that Member States and authorities
    may offer. It governs how a system is tested under supervision, not how it behaves.
- ref: Art. 59
  title: Further processing of personal data for developing certain AI systems in the public interest
    in the AI regulatory sandbox
  group: Chapter VI - Measures in support of innovation
  state: out_of_scope
  note: Conditions for processing personal data inside a regulatory sandbox, including an isolated data
    environment and its logs. A data-protection regime for the sandbox, not for the deployed system.
- ref: Art. 60
  title: Testing of high-risk AI systems in real world conditions outside AI regulatory sandboxes
  group: Chapter VI - Measures in support of innovation
  state: out_of_scope
  note: 'Testing high-risk systems in real-world conditions before release: the plan, approval, consent
    and oversight. It includes that the system''s outputs can be reversed and disregarded (60(4)(k)),
    the same property Article 14 asks of a deployed system and mapped there.'
- ref: Art. 60a
  title: Testing of high-risk AI systems covered by Union harmonisation legislation listed in Section
    B of Annex I in real-world conditions outside AI regulatory sandboxes
  group: Chapter VI - Measures in support of innovation
  state: out_of_scope
  note: Regulatory sandboxes, real-world testing and support measures that Member States and authorities
    may offer. It governs how a system is tested under supervision, not how it behaves.
- ref: Art. 61
  title: Informed consent to participate in testing in real world conditions outside AI regulatory sandboxes
  group: Chapter VI - Measures in support of innovation
  state: out_of_scope
  note: The provider must obtain informed consent from the people a real-world test involves. A duty about
    running a test, not about the deployed system.
- ref: Art. 62
  title: Measures for providers and deployers, in particular SMEs, including start-ups
  group: Chapter VI - Measures in support of innovation
  state: out_of_scope
  note: 'Support for SMEs and start-ups: priority sandbox access, training, lower fees and an information
    platform run by the AI Office. Binds authorities, not the system.'
- ref: Art. 63
  title: Derogations for specific operators
  group: Chapter VI - Measures in support of innovation
  state: out_of_scope
  note: Lets microenterprises meet certain elements of the quality management system in a simplified way.
    An organisational concession, not a property of the system.
- ref: Art. 64
  title: AI Office
  group: Chapter VII, Section 1 - Governance at Union level
  state: out_of_scope
  note: Sets up the Union and national bodies that run the Regulation and their tasks. Binds the Commission,
    the Board, experts and Member States, not the system Keel assesses.
- ref: Art. 65
  title: Establishment and structure of the European Artificial Intelligence Board
  group: Chapter VII, Section 1 - Governance at Union level
  state: out_of_scope
  note: Sets up the Union and national bodies that run the Regulation and their tasks. Binds the Commission,
    the Board, experts and Member States, not the system Keel assesses.
- ref: Art. 66
  title: Tasks of the Board
  group: Chapter VII, Section 1 - Governance at Union level
  state: out_of_scope
  note: Sets up the Union and national bodies that run the Regulation and their tasks. Binds the Commission,
    the Board, experts and Member States, not the system Keel assesses.
- ref: Art. 67
  title: Advisory forum
  group: Chapter VII, Section 1 - Governance at Union level
  state: out_of_scope
  note: Sets up the Union and national bodies that run the Regulation and their tasks. Binds the Commission,
    the Board, experts and Member States, not the system Keel assesses.
- ref: Art. 68
  title: Scientific panel of independent experts
  group: Chapter VII, Section 1 - Governance at Union level
  state: out_of_scope
  note: Sets up the Union and national bodies that run the Regulation and their tasks. Binds the Commission,
    the Board, experts and Member States, not the system Keel assesses.
- ref: Art. 69
  title: Access to the pool of experts by the Member States
  group: Chapter VII, Section 1 - Governance at Union level
  state: out_of_scope
  note: How Member States may call on the scientific panel's experts, and pay for them. Binds Member States
    and the Commission, not the system.
- ref: Art. 70
  title: Designation of national competent authorities and single points of contact
  group: Chapter VII, Section 2 - National competent authorities
  state: out_of_scope
  note: Sets up the Union and national bodies that run the Regulation and their tasks. Binds the Commission,
    the Board, experts and Member States, not the system Keel assesses.
- ref: Art. 71
  title: EU database for high-risk AI systems listed in Annex III
  group: Chapter VIII - EU database for high-risk AI systems
  state: out_of_scope
  note: The EU database of registered systems, run by the Commission, into which providers and public
    deployers enter their data (71(2), (3)). Registration, organisational.
- ref: Art. 72
  title: Post-market monitoring by providers and post-market monitoring plan for high-risk AI systems
  group: Chapter IX, Section 1 - Post-market monitoring
  state: out_of_scope
  note: The post-market monitoring plan and system the provider runs after release. A process; Keel's
    re-assessments can feed it, and the logs it relies on are mapped at Articles 12 and 19.
- ref: Art. 73
  title: Reporting of serious incidents
  group: Chapter IX, Section 2 - Sharing of information on serious incidents
  state: out_of_scope
  note: Reporting serious incidents to authorities within set deadlines. A process duty of the provider
    (73(1)), and of the deployer through Article 26(5), after the event.
- ref: Art. 74
  title: Market surveillance and control of AI systems in the Union market
  group: Chapter IX, Section 3 - Enforcement
  state: out_of_scope
