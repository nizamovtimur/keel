  - T-METADATA-LEAK
  - T-CROSS-TENANT
  mitigations: []
- ref: ISD
  title: Inferred Sensitive Data
  group: Model creator, Model consumer
  state: gap
  threats: []
  mitigations: []
  note: 'Waiting on a weakness where the sensitive fact is produced by the model''s own inference rather than read: no data in reach rules it out, so it is not T-DATA-LEAK; harm reputation-legal, with output validation and context filtering attaching at the reply boundary.'
