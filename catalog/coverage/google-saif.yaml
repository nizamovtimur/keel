  note: 'Model-creator concern: it lands on the training pipeline and the weights, which the deploying party does not own; Keel models the system that runs the model, not the one that makes it.'
- ref: MXF
  title: Model Exfiltration
  group: Model creator, Model consumer
  state: covered
  threats:
  - T-DATA-LEAK
  - T-CRED-THEFT
  mitigations:
  - CTRL-DATA-ACCESS-CONTROL
  - CTRL-ACCESS-CONTROL
  - CTRL-PRIVILEGE-CONTROL
- ref: MDT
  title: Model Deployment Tampering
  group: Model creator, Model consumer
  state: covered
  threats:
  - T-SUPPLY-DEPS
  mitigations:
  - CTRL-INTEGRITY-VERIFICATION
  - CTRL-VERSION-PINNING
- ref: DMS
  title: Denial of ML Service
  group: Model consumer
  state: covered
  threats:
  - T-DOS
  mitigations: []
- ref: MRE
  title: Model Reverse Engineering
  group: Model consumer
  state: gap
  threats: []
  mitigations: []
  note: 'Waiting on a threat with the model itself as the asset: an endpoint answering unbounded queries with full outputs lets the model be cloned; harm data-exposed, rate limiting attaches soft.'
- ref: IIC
  title: Insecure Integrated Component
  group: Model consumer
  state: covered
  threats:
  - T-CMD-INJECT
  - T-SSRF
  - T-SUPPLY-DEPS
  mitigations: []
- ref: PIJ
  title: Prompt Injection
  group: Model creator, Model consumer
  state: covered
  threats:
  - T-DATA-LEAK
  - T-TOOL-ABUSE
  - T-CODEGEN
  - T-CMD-INJECT
  - T-SSRF
  - T-TOXIC
  mitigations:
  - CTRL-INPUT-FILTERING
  - CTRL-PROMPT-HARDENING
  - CTRL-CONTENT-STRIPPING
  - CTRL-EXTERNAL-CONTENT-SANDBOX
- ref: MEV
  title: Model Evasion
  group: Model creator, Model consumer
