source:
  id: google-saif
  title: Google Secure AI Framework - risk map
  kind: best_practice
  version: saif-data @ 2026-08-29
  url: https://saif.google/secure-ai-framework/risks
  checked: '2026-08-29'
  entry_count: 15
  note: 'The only source here that maps a risk to its controls and to the party accountable for them, which is Keel''s own angle arriving from somewhere else. It is also the only one published as machine-readable YAML, so drift against it is a diff rather than a reading exercise. `group` records SAIF''s persona: who owns the risk, the model creator or the model consumer.'
entries:
- ref: DP
  title: Data Poisoning
  group: Model creator
  state: out_of_scope
  threats: []
  mitigations: []
  note: 'Model-creator concern: it lands on the training pipeline and the weights, which the deploying party does not own; Keel models the system that runs the model, not the one that makes it.'
- ref: UTD
  title: Unauthorized Training Data
  group: Model creator
  state: out_of_scope
  threats: []
  mitigations: []
  note: 'Model-creator concern: it lands on the training pipeline and the weights, which the deploying party does not own; Keel models the system that runs the model, not the one that makes it.'
- ref: MST
  title: Model Source Tampering
  group: Model creator
  state: out_of_scope
  threats: []
  mitigations: []
  note: 'Model-creator concern: it lands on the training pipeline and the weights, which the deploying party does not own; Keel models the system that runs the model, not the one that makes it.'
- ref: EDH
  title: Excessive Data Handling
  group: Model creator
  state: out_of_scope
  threats: []
