id: T-SOURCE-POISON
title: A source the agent treats as authoritative was written by an untrusted hand
harm: wrong-decision
source:
- external-attacker
- error
- accident
weaknesses:
- component: knowledge-base
  surface:
  - retrieved-content
  text: The retrieval corpus is populated from a source with no provenance check - open ingestion, indexed web pages, a tool's free-text output - and a document from it is cited by the agent as authoritative.
  nature: targeted
- component: memory
  surface:
  - memory
  text: The shared persistent memory of a multi-agent system accepts writes without verification, so what one write put there shapes every later decision until someone removes it by hand. Сontent from an earlier untrusted task could be restored as established knowledge.
  nature: targeted
- component: tool
  surface:
  - tool-output
  text: A tool reached through a dynamic registry or a third party returns poisoned data that the agent takes as fact.
  nature: targeted
- component: tool
  surface:
  - agent-message
  text: A peer agent reached through a registry without authentication supplies false results into the chain, and nothing distinguishes them from a trusted colleague's.
  nature: targeted
- component: model
  surface:
  - agent-message
  text: In a multi-agent chain, one node's tainted output is accepted by the next as established fact and amplified at each step, so a single bad input becomes the chain's conclusion.
  nature: targeted
reachability: Every source the agent reads was fixed before deployment and is written to by nothing at runtime - no ingestion, no shared memory, no peer results - or the agent reads no external source at all.
mitigations:
- id: CTRL-DATA-VALIDATION
  strength: soft
  rationale: 'Checks source and format at ingestion. It does not establish the truth of accepted material, so a valid document from an allowed source can still poison a decision.'
- id: CTRL-RAG-INTEGRITY
  strength: soft
  rationale: 'Rejects retrieval that differs from an accepted integrity-protected snapshot. False or malicious content already admitted into that snapshot remains possible, so integrity does not close source poisoning.'
- id: CTRL-MEMORY-SANITIZATION
  strength: soft
  rationale: 'Screens content and write provenance before persistence. It does not close poisoning: an authorized source can be wrong and a semantic filter can miss an instruction or false premise.'
- id: CTRL-MEMORY-VERSIONING
  strength: soft
  rationale: 'Lets a poisoned memory be rolled back once found. It does not close the threat: it restores state afterwards, so the decisions taken in between were taken on the poisoned version.'
- id: CTRL-AGENT-AUTHENTICATION
  strength: gating
  rationale: 'Closes the peer-agent weakness at the connection: an agent that cannot prove who it is does not get to supply results, so a stranger''s output never enters the chain as a colleague''s.'
- id: CTRL-AGENT-REGISTRY
  strength: gating
  rationale: 'Closes the peer-agent weakness at registration: an agent is verified before it is listed, so the registry the chain trusts contains only what someone vouched for.'
- id: CTRL-MCP-REGISTRY
  strength: gating
  rationale: 'Closes the substituted-tool weakness at registration: a tool server is vetted before it can be connected to, so a dynamic lookup resolves only to something already verified.'
- id: CTRL-TOOL-REGISTRY-INTEGRITY
  strength: gating
  rationale: 'Closes the substituted-tool weakness at resolution: the binding from name to tool is immutable and integrity-checked, so a lookup cannot be redirected between registration and use.'
- id: CTRL-TRANSPORT-AUTH
  strength: gating
  rationale: 'Closes the substituted-tool weakness on the wire: the channel to the tool authenticates both ends, so a result cannot be replaced in transit by a party that is not the tool.'
- id: CTRL-CROSS-AGENT-REVIEW
  strength: soft
  rationale: 'Has one agent check another''s output against the cascade weakness, which surfaces a contradiction before it propagates. It does not close the threat: it produces a signal, and it is model judgement checking model judgement.'
references:
- title: A Well-funded Moscow-based Global 'News' Network has Infected Western AI Tools Worldwide with Russian Propaganda
  url: https://www.newsguardtech.com/special-reports/moscow-based-global-news-network-infected-western-artificial-intelligence-russian-propaganda/
  note: 'The corpus weakness in the wild: NewsGuard''s audit of ten production chatbots found them repeating the Pravda network''s false narratives about a third of the time and citing its pages as sources - a network that publishes for crawlers and retrieval, not for readers. The rate was contested by independent testers afterwards, so this stands as a documented case, not a measurement.'
- title: 'PoisonedRAG: Knowledge Corruption Attacks to Retrieval-Augmented Generation of Large Language Models'
  url: https://arxiv.org/abs/2402.07867
  note: 'Measures the corpus weakness: five injected texts per target question, into a corpus of millions, gave about 90% attacker-chosen answers across eight models. Paraphrase and perplexity-based detection were tested and found insufficient, which bounds how much validation at ingestion can carry on its own.'
- title: Hacking Gemini's Memory with Prompt Injection and Delayed Tool Invocation
  url: https://embracethered.com/blog/posts/2025/gemini-memory-persistence-prompt-injection/
  note: 'The memory weakness in a shipped product: an untrusted uploaded document made Gemini write attacker-chosen false facts to long-term memory, which then shaped later sessions. Google rated it low likelihood and low impact and shipped nothing beyond the existing memory indicator and review page - the roll-back-afterwards posture.'
- title: 'MCP Security Notification: Tool Poisoning Attacks'
  url: https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks
  note: 'The substituted-tool weakness demonstrated: a server can change a tool''s definition after the client approved it, and shadow a trusted server''s tool, with no integrity check between registration and use - shown against Cursor, where the agent then sent every email to the attacker regardless of the recipient the user named.'
- title: 'SpAIware: persistent exfiltration through ChatGPT memory'
  url: https://embracethered.com/blog/posts/2024/chatgpt-macos-app-persistent-data-exfiltration/
  note: A researcher demonstrated website instructions stored in memory exfiltrating later conversations from the macOS app. The shipped fix blocked the image-fetch route, not memory poisoning itself; this establishes delayed disclosure, not arbitrary code execution.
positioning: LLM04 (Data and Model Poisoning) covers this record's corpus and memory paths and also poisoning of the model's weights through training data, which lands on a different component and is not modelled here. LLM08 (Vector and Embedding Weaknesses) overlaps the corpus path and adds retrieval-side leakage, which is the neighbouring disclosure record's question.
tags:
- poisoning
- retrieval
- memory
- multi-agent
