id: T-DOS
title: Unbounded input or an unbounded loop consumes what others need
harm: downtime
source:
- external-attacker
- hallucination
- accident
- internal
- error
weaknesses:
- component: model
  surface:
  - user-input
  text: Input reaches the model with no bound on its size or on the work it triggers - a very long prompt, a request that unfolds into heavy processing - and the cost is paid from a pool others draw on. The work also includes generated output, hidden reasoning, retries and fallback calls; a short visible answer does not bound its compute or paid-service cost.
  nature: targeted
- component: tool
  surface:
  - agent-message
  text: Agents delegate to one another, or a tool loop runs, with no limit on depth or iteration count, so a cycle or a runaway plan consumes compute and queue capacity until something outside it stops. Even individually bounded calls can exhaust an operation allocation when delegated branches receive independent budgets rather than sharing one cumulative allocation.
  nature: targeted
- component: model
  surface:
  - tool-output
  text: Free-form text returned by a tool is processed with no bound on the work it may trigger, so a payload shaped for recursion or heavy processing arrives through a channel nobody rate-limits.
  nature: targeted
- component: tool
  surface:
  - model-output
  text: A tool with network access sends requests outward with no cap on volume or rate, so the model can be steered or can err into a flood that exhausts the organization's egress, quota or bill.
  nature: targeted
- component: downstream
  surface:
  - model-output
  text: A model-controlled query or job is admitted by a downstream service based on syntax and operation permission alone, while its expansion, execution time and resource demand are not bounded at that service; one accepted request can monopolize the service.
  nature: targeted
- component: downstream
  surface:
  - model-output
  text: The downstream service accepts concurrent or repeated work from an agent without an aggregate allocation for that caller, and continues jobs after the agent times out or retries, so remote work accumulates independently of the agent's local limits.
  nature: targeted
reachability: The endpoint accepts no untrusted or unbounded input, initiates no inter-agent or tool loops, and its tools have no unmetered outbound path. The condition must also cover hidden inference work, retries, delegated branches and resource-consuming downstream jobs, including work retained after a client timeout. A dedicated allocation is still material if depleting it exhausts service capacity or the payer's budget.
mitigations:
- id: CTRL-ITERATION-LIMITS
  strength: soft
  rationale: 'Bounds the number of loop iterations on covered paths. It does not close exhaustion: one admitted iteration can perform expensive inference or retain costly work downstream.'
- id: CTRL-TOKEN-LIMITS
  strength: soft
  rationale: 'Bounds the covered input or generation token fields. It does not close exhaustion: hidden billed work outside that cap, repeated calls and downstream execution can consume separate allocations.'
- id: CTRL-RATE-LIMITING
  strength: soft
  rationale: 'Bounds request arrivals on covered identities and routes. It does not close exhaustion: a permitted request can be expensive, and remote work can continue after the client times out.'
- id: CTRL-RESOURCE-QUOTAS
  strength: gating
  rationale: 'Closes all four weaknesses at the floor: hard limits on CPU, memory and bandwidth per agent and tool mean that whatever the path, consumption stops at the quota rather than at the shared pool''s end. These are the four agent/tool-runtime paths above; a remote service outside that enforced allocation needs its own work limits. Local quotas do not bound its query cost or retained jobs.'
- id: CTRL-DOWNSTREAM-WORK-LIMITS
  strength: gating
  rationale: Bounds admission, concurrency and active work in the downstream executing service, including a single expensive request and work retained after timeout. It closes that service-side resource path; it does not cap independent inference work.
references:
- title: OpenAI ChatGPT Crawler Reflective DDoS Vulnerability
  url: https://github.com/bf/security-advisories/blob/main/2025-01-ChatGPT-Crawler-Reflective-DDOS-Vulnerability.md
  note: 'The outbound weakness: the attributions endpoint fetched every URL in a list with no cap on its length, so one request turned OpenAI''s crawler into a flood against a site of the caller''s choosing. OpenAI disabled the endpoint after public disclosure.'
- title: vLLM 0.5.2.2 vulnerable to Denial of Service (CVE-2024-11040)
  url: https://github.com/advisories/GHSA-hhr6-7642-8pmh
  note: 'The user-input weakness, the work-it-triggers half: one completions request with beam search and a high best_of hangs the engine and blocks new requests for everyone - the cost is paid from the shared pool.'
- title: An Engorgio Prompt Makes Large Language Model Babble on
  url: https://arxiv.org/abs/2412.19394
  note: 'Measures the user-input weakness: crafted prompts suppress the end-of-sequence token and drive thirteen open models to two to thirteen times longer outputs, reaching over 90% of the length limit, with a run against a resource-limited service showing the availability hit (ICLR 2025).'
- title: 'GitLab: nested GraphQL query denial of service, CVE-2019-18455'
  url: https://gitlab.com/gitlab-org/gitlab/-/issues/30096
  note: A disclosed endpoint accepted nested queries whose expansion caused denial of service; GitLab fixed it in 12.4.1. This is evidence for the downstream query boundary, not an observed AI-agent incident.
positioning: LLM10 (Unbounded Consumption) lines up with this record and also names model extraction through high-volume querying, which is a disclosure of the model rather than an exhaustion of shared resources and is not modelled here. Downstream queries and jobs are additional execution locations for this resource-exhaustion path; a cheap model call can start expensive remote work. Hidden billed work, retries and delegated branches also draw on the operation allocation. Dedicated capacity or budget can still be depleted even when it is not shared.
tags:
