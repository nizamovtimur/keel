name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pin the interpreter
        # CI ran on whatever Python uv happened to pick, so a schema pydantic
        # generates from the signatures came out a different size than locally and
        # failed a byte budget. Reproducible beats latest.
        run: echo "3.14" > .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check generated schema is fresh
        run: uv run keel schema --check

      - name: Validate catalog
        run: uv run keel validate

      - name: Test
        run: uv run pytest

  web:
    # The reading app is committed as a build so `keel up` needs no Node. This fails
    # when web/ changed and keel/static/app was not rebuilt with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (frozen)
        run: npm ci
        working-directory: web

      - name: Type-check and build
        run: npm run build
        working-directory: web

      - name: Check the committed build is fresh
        run: |
          git add -N keel/static/app
          git diff --exit-code --stat keel/static/app
