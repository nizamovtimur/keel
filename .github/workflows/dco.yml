name: DCO

# Every commit in a pull request carries "Signed-off-by: Name <email>" matching its
# author: the contributor certifies the Developer Certificate of Origin
# (https://developercertificate.org). Bots and merge commits are skipped.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an' "$c")
            email=$(git log -1 --format='%ae' "$c")
            case "$author" in *'[bot]') continue ;; esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qiF "<$email>"; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no 'Signed-off-by: $author <$email>'"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign the commits and push again: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "Every commit is signed off."
